    text: Kadri'Ra can survive in the vacuum of space for up to eight days.
  - name: Attribute Bonus
    text: For every 50 years of life, Kadri'Ra may add +1D to any attribute (but may not exceed species
      maximums).
  - name: Natural Body Armor
    text: The thick hide of the Kadri'Ra provides +3D against physical attacks and +1D+1 against energy
      attacks.
