  - name: Stealth
    text: All Yrashu receive +2D when sneaking in the jungle. They are almost impossible to spot when
      they don't want to be seen. Naturally, this bonus only applies in a jungle and it would take a Yrashu
      several days to learn an alien jungle's ways before the bonus could be applied.
  special_skills:
  - name: Baskarn Survival
    text: This skill allows the Yrashu to survive almost anywhere on baskarn for an indefinite period
      and gives them a good chance of surviving in a jungle on almost any planet. Yrashu usually have
      this skill at 5D.
  - name: Yrashu Mace
    text: Yrashu are proficient in the use of a mace made from the roots of a certain species of tree
      that all Yrashu visit upon reaching adulthood. Most Yrashu have this skill at 4D. The weapons acts
      like an ordinary club (STR+1D).
  story_factors: []
  home_planet: Baskarn
  attribute_dice: 13D
  move: 10/12 (walking), 12/15 (jungle movement which
  size: 2 meters tall
  source: Alien Encounters (page 175)
