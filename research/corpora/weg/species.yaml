  - name: Energy Resistance
    text: Damage done to Iskalloni by energy weapons is reduced by one level of effect.
  special_skills: []
  story_factors:
  - name: Voluntary Cyborgs
    text: Iskalloni will have at least one implant which can be used as a weapon. Blaster-type modifications
      can be placed virtually anywhere on the body and will generally be 3D to 5D. Any melee weapons will
      be on the order of STR+1 damage up to STR+2D.
  - name: Roleplaying Hints
    text: Iskalloni appear calm, as though their thoughts are somewhere else--they always seem to be emotionally
      detached from whatever they are doing. The Iskalloni are bent on enslaving Human-kind, not out of
      any particular hatred, but simply because they feel the Humans and the species which associate with
      them are all weak and worthless. Additionally, the bio-technology currently used by the Iskalloni
      produces toxic wastes which the Iskalloni must process by hand. No Iskalloni can last more than
      a few months of constant exposure to these toxins, so the species has decided that it would be most
      prudent to place less important species in jeopardy. The Iskalloni are quiet and calculating. They
      do not speak much, but when they do, they appear as if they are being distracted by something going
      on inside their bodies--as if they are listening for an odd noise to repeat itself. The truth is
      that the Iskalloni are distracted nearly all the time because they are continually forcing their
      bodies to adapt to new physical conditions.
  home_planet: Iskallon
  move: '10'
  size: 1.3-1.5 meters tall
  source: Twin Star of Kira (pages 92-93)
