    text: The bulky Kadri'Ra can inflict STR+1D in trampling damage.
  special_skills: []
  story_factors:
  - name: Enslaved
    text: Because of their size and strength, Kadri'Ra have been prime targets of slavers. They are often
      forced to work as living earth-movers or as laborers in large-scale construction projects. Because
      they can exist in space for limited peroids of time, they have also been used as laborers in space
      docks. They are not considered sentient by the Empire and are not protected by any type of law.
      During the time of the Old Republic, there were an estimated 140,000,000 Kadri'Ra living on their
      adopted homeworld, Arapia. By contrast, when Emperor Palpatine dissolved the Imperial Senate, there
      were less than 14,000 remaining Kadri'Ra.
