    PERCEPTION: 2D+2/4D+2
    STRENGTH: 2D/4D
    TECHNICAL: 1D+1/3D+2
  special_abilities:
  - name: Prehensile Tail
    text: Abinyshi can use their tails as a third arm at -1D their die code. In combat, the tail does
      Strength damage.
  special_skills: []
  story_factors:
  - name: Believed Extinct
    text: Nearly all beings in the galaxy believe the Abinyshi to be extinct.
  home_planet: Inysh
  attribute_dice: 12D
  move: 10/12
  size: 1.2-1.6 meters
