      Prime is a crime punishable by imprisonment. A Gorothite who has managed to escape the planet is
      considered a "fugitive from justice" by the Empire, to be incarcerated and returned to Goroth Prime
      if caught (if the Imperial forces who find her have the time and inclination to do so). Gorothites
      are considered a very minor problem and do not receive the same "attention" as a fugitve Wookiee
      would.
  - name: Parental Instinct
    text: Adults instantly respond to the cries of a young Gorothite, whether the child is a part of their
      family or not. They are driven to protect the child, even if this puts themselves at extreme risk.
