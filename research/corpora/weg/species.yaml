- name: Aganof
  pdf_page: 8
  attributes:
    DEXTERITY: 1D/2D
    KNOWLEDGE: 1D/4D
    MECHANICAL: 1D/2D
    PERCEPTION: 1D/4D+2
    STRENGTH: 1D/3D
    TECHNICAL: 1D/3D
  special_abilities:
  - name: Blind and Deaf
    text: Aganof cannot see in the way that humans can; they also cannot hear in the traditional sense,
      but they can detect intense air vibrations. Their prime extrenal sense is touch and a sensitivity
      to ground vibrations. By judging the intensity and frequency of vibrations, in combination with
      the type of surface they are standing on, they can detect creatures near them.
  - name: Claws
    text: Aganof can use their claws to inflict STR+1D+2 damage.
  special_skills:
  - name: Vibration Detection
    text: 'Aganof use this skill to detect ground vibrations and determine the proximity of creatures
      and beings around them. The difficulty depends on the distance and type of vibration: They can also
      detect air vibrations, such as temperature change and movement, and thus can sometimes detect approaching
      flying creatures, or even sense incoming projectiles and dodge them. Aganof also use their hard
      shells and this skill for "speech" through ground vibrations, as naturally as humans use their mouths
      and sense of hearing for speech.'
  story_factors: []
  home_planet: Kuras III
  attribute_dice: 11D
  move: 4/6
  size: 1.3-2.5 meters tall, 1.5-3.5 meters long
  source: Alien Encounters (pages 20-21), Planets Collection
- name: Aing-Tii
