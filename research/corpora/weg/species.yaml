  - name: Lanuage
    text: Due to the nature of their vocal apparatus, the Tarc are unable to speak Basic or most other
      languages. As the Tarc have so effectively isolated themselves from the galactic community, it is
      exceedingly rare to find anyone who is able to understand them; even most protocal droids are not
      programmed with the Tarc's language. As a result, most Tarc who have left (or been banished from)
      Hjaff have an extraordinarily difficult time trying to communicate with other denizens of the galaxy.
  - name: Isolationists
    text: The Tarc are fierce isolationists. They feel that interacting with the galactic community will
      poison their culture with the luxuries, values, and customs of other societies. If forced into the
