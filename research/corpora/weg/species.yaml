    text: '(Used in place of Strengthto resist damage.) When a Filar-Nitzan is hit by an energy weapon
      of any kind or by some other element that may cause injury (such as open flame), the character rolls
      his diffusionskill when calculating damage. The diffusionskill requires six times the normal Character
      Point to increase; specializations cost three times the normal cost. Example: to improve diffusionfrom
      2D to 2D+1 would require 12 Character Points instead of two; to improve diffusion: blasterfrom 2D
      to 2D+1 would require six Character Points instead of one.'
  - name: Specializations
    text: Against any damage element (blaster fire, strong electricity, large quantities of other gases,
      open flame, etc.).
  - name: Aversion
    text: (Used in place of dodge.) To avoid blaster fire and other such potentially harmful things, the
      Filar-Nitzan have an aversion ability, a near-equivalent to dodge. This skill allows them to change
      their shapes quickly enough to often avoid melee weapons and occasionally blaster fire without having
      to move entirely out of the way. Aversion requires double the normal Character Point cost to increase.
  - name: Example
    text: 'to improve aversion from 2D to 2D+1 would take four Character Points instead of two; to improve
      aversion: blaster from 2D to 2D+1 would take two Character Points instead of only one.'
