  language: 's: Time to use: One round. This skill specialization is used to understand and "speak" the
    unique Anomid form of sign language. Only Anomids and other beings with six digits per hand can learn
    to "speak" this language. The skill costs the normal amount for specializations, but all characters
    trying to interpret Anomid sign language without the specialization have their difficulty increased
    by two '
- name: Anx
  pdf_page: 12
  attributes:
    DEXTERITY: 1D+1/4D
    KNOWLEDGE: 1D/3D+2
    MECHANICAL: 1D+1/4D
    PERCEPTION: 1D/3D+2
    STRENGTH: 2D/4D+2
    TECHNICAL: 1D+1/4D
  special_abilities:
  - name: Blindsight
    text: Anx have exceptionally poor eyesight, and instead use sense organs along their crests, knees,
      and elbows to "smell" the world around them.
  - name: Communication at a Distance
    text: Anx speak in a booming, low-frequency language that other Anx can hear up to five kilometers
      away.
  - name: Increased Hand-to-Hand Damage
    text: Due to their physiology, Anx characters add +1D to their Strength score when rolling their hand-to-hand
      damage.
  special_skills: []
  story_factors:
  - name: Fin Cloaks
    text: The skin and fins of an Anx change colors to reflect their emotions, making an Anx's basic mood
      easy to decipher. As a result, Anx characters often wear fin cloaks that make it more difficult
      for others to interpret their emotions. An Anx without a fin cloak suffers a -2D penalty to all
      Bargain and Con skill checks.
  home_planet: Gravlex Med
  attribute_dice: 12D
  move: 12/14
  size: 4 meters tall on average
  source: Ultimate Alien Anthology (pages 11-13)
- name: Anzat
  pdf_page: 13
  attributes:
    DEXTERITY: 2D/5D
    KNOWLEDGE: 1D+1/4D
    MECHANICAL: 1D+1/4D
    PERCEPTION: 2D/4D
    STRENGTH: 2D/5D
    TECHNICAL: 1D+1/4D
  special_abilities:
  - name: Anzati Tracking
    text: Anzati are able to sense the Force in others, and each is automatically considered Force-sensitive
      and possessing of the Sense Force skill. When tracking prey, Anzati oftentimes use Force powers
      such as Life Detection, Life Sense, Receptive Telepathy, Sense Force, and Sense Force Potential.
  - name: Long-lived
    text: Anzati are practically immortal, and can live for eons.
  - name: Stealthy
    text: Because they must secretly hunt sentient beings, Anzati have grown adept at maintaining their
      stealth and secrecy. This is reflected in a +1D bonus to their hide and sneak skills.
  - name: Vampires
    text: 'The Anzati feed from living beings: for every turn spent feeding, 2 pips are subtracted from
      the victim''s Knowledge, Mechanical, Perception, and Technical attributes. If any one attribute
      is reduced to 0 or less, the victim dies. The damage to the attributes is permanent, and reduces
      skills accordingly.'
  special_skills: []
  story_factors: []
  attribute_dice: 14D
  move: 10/12
  size: 1.6-1.8 meters tall
  source: Ultimate Alien Anthology (pages 13-14)
- name: Aqualish
  pdf_page: 13
  attributes:
    DEXTERITY: 2D/4D
    KNOWLEDGE: 1D/3D
    MECHANICAL: 1D+2/3D+2
    PERCEPTION: 2D/4D
    STRENGTH: 2D/4D+2
    TECHNICAL: 1D+2/3D
  special_abilities:
  - name: Fins
    text: Aqualish are born with the natural ability to swim. They receive a +2D bonus for all movement
      attempted in liquids. However, the lack of fingers on their hands decreases their Dexterity, and
      the Aqualish suffer a -2D penalty when using equipment that has not been specially designed for
      its fins.
  - name: Hands
    text: The Quara do not receive the swimming bonus, but they are just as "at home" in the water. They
      also receive no penalties for Dexterity actions. The Quara are most likely to be encountered off-world.
  special_skills: []
  story_factors:
  - name: Belligerence
    text: Aqualish tend to be pushy and obnoxious, always looking for the opportunity to bully weaker
      beings. More intelligent Aqualish turn this belligerence into cunning and become manipulators.
  home_planet: Ando
  attribute_dice: 12D
  move: 9/12 (walking), 5/7 (swimming, Aquala only)
  size: 1.8-2 meters tall
  source: Ultimate Alien Anthology (page 14), Alien Anthology
