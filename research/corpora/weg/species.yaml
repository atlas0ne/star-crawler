- name: Abyssin
  pdf_page: 7
  attributes:
    DEXTERITY: 1D+2/4D
    KNOWLEDGE: 1D/3D+2
    MECHANICAL: 1D/3D
    PERCEPTION: 1D/3D
    STRENGTH: 2D/4D
    TECHNICAL: 1D/2D+2
  special_abilities:
  - name: Regeneration
    text: Abyssin have this special ability at 2D. They may spend beginning skill dice to improve this
      ability as if it were a normal skill. Abyssin roll to regenerate after being wounded using these
      skill dice instead of their Strength attribute - but turn "days" into "hours". So, an Abyssin who
      has been wounded rolls after three standard hours instead of three standard days to see if he or
      she heals. In addition, the character's condition cannot worsen (and mortally wounded characters
      cannot die by rolling low).
  special_skills:
  - name: Survival
    text: 'Desert: During character creation, Abyssin receive 2D for every 1D placed in this skill specialization,
      and, until the skill reaches 6D, advancement is half the normal Character Point cost.'
  story_factors:
  - name: Violent Culture
    text: 'The Abyssin are a primitive people much like the Tusken Raiders: violent and difficult for
      others to understand. Abyssin approach physical violence with a childlike glee and are always eager
      to fight. However, they are slightly less happy to be involved in blaster fights and are of the
      opinion that starship combat is incredibly foolish, since you cannot regenerate once you have been
      explosively decompressed (this attitude has become generalized into a dislike of any type of space
      travel). It should be noted that the Abyssin do not think of themselves as violent or vicious. Even
      during a ferocious blooding, most of those involved will be injured, not killed - their regenerative
      factor means that they can resort to violence first and worry about consequences later.'
  attribute_dice: 12D
  move: 8/12
  size: 1.7-2.1 meters tall
  source: Ultimate Alien Anthology (pages 7-8), Galaxy Guide
- name: Adarian
  pdf_page: 7
  attributes:
    DEXTERITY: 1D+1/3D+1
    KNOWLEDGE: 2D/4D
    MECHANICAL: 2D/4D
    PERCEPTION: 1D/3D+2
    STRENGTH: 1D+2/3D+2
    TECHNICAL: 2D/4D+1
  special_abilities:
  - name: Search
    text: When conducting a search that relies upon sound to locate an object or person, an Adarian receives
      a +2D bonus, due to his or her extended range of hearing. Adarians can hear in the ultrasonic and
      subsonic ranges, so thus will be able to hear machinery or people at extremely long distances (up
      to several kilometers away).
  special_skills:
  - name: (A) Carbon-Ice Drive Programming / Repair
    text: 'Time to use: Several minutes to several days. This advanced skill is used to program and repair
      the unique starship interfaces for the Carbon-Ice-Drive, a form of macro-scale computer. The character
      must have a computer programming/ repairskill of at least 5D before taking Carbon-Ice Drive programming/
      repair, which costs 5 Character Points to purchase at 1D. Advancing the skill costs double the normal
      Character Point cost; for example, going from 1D to 1D+1 costs 2 Character Points.'
  - name: (A) Carbon-Ice Drive Engineering
    text: 'Time to use: Several days to several months. This is the advanced skill necessary to engineer
      and design Carbon-Ice Drive computers. The character must have a Carbon-Ice Drive programming/ repairskill
      of at least 5D before purchasing this skill, which costs 10 Character Points to purchase at 1D.
      Advancing the skill costs three times the normal Character Point cost. Designing a new type of Carbon-Ice
      Drive can take teams of engineers several years of work.'
  story_factors:
  - name: Caste System
    text: Adarians are bound by a rigid sceel'saracaste system and must obey the dictates of all Adarians
      in higher castes. Likewise, their society is run by a planetary corporation, so all Adarians must
      obey the requests of this corporation, often to the detriment of their own desires and objectives.
  home_planet: Adari
  attribute_dice: 12D
  move: 10/12
  size: 1.5-2 meters tall
  source: 'Galaxy Guide 12 - Aliens: Enemies and Allies'
  language: 's: When speaking languages that require precise pronounciation (Basic, for example), an Adarian
    suffers a -1D penalty to this skill. When speaking languages that rely more upon tonal variation (Wookiee,
    for example), the Adarian suffers no penalty. Adarian Long Call: Time to use: Two rounds. By puffing
    up the throat pouch (which takes one round), an Adarian can emit the subsonic vocalization known'
