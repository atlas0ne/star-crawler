    MECHANICAL: 1D/3D
    PERCEPTION: 1D/2D
    STRENGTH: 2D/4D
    TECHNICAL: 2D/4D
  special_abilities:
  - name: Malaise
    text: The Servants are congenitally sluggish, and cannot improve skills, although they can be flash-imprinted
      (see below).
  - name: Flash-Imprint Skills
    text: The Servants, although not very bright, can be taught any skill by a "flash-imprinting" technique
      used by DarkStrider. Using the technique tends to scramble whatever other skills they already possess
      and redistributes their skill dice as DarkStryder desires. The flash-imprint process takes one Kathol
      day.
  - name: Obedience
    text: 'The Servants are routinely flash-imprinted to obey DarkStryder. They are not willingly loyal:
      they just obey reflexively.'
  - name: No Ta-Ree
    text: The Yimi are unable to use Ta-Ree.
  special_skills: []
  story_factors:
  - name: ''
    text: The Servants hate DarkStryder. Although they must obey
  - name: ''
    text: the despot, as per their imprinting, they don't have to
  - name: ''
    text: interpret its orders as it wishes, or aid it without specific
  - name: ''
    text: instructions.
  home_planet: Kathol
  attribute_dice: 10D
  move: '10'
  size: 1 meter tall
  source: The DarkStryder Campaign - Endgame (page 37)
- name: Yinchorri
  pdf_page: 177
  attributes:
    DEXTERITY: 1D+1/4D
    KNOWLEDGE: 1D+1/4D
    MECHANICAL: 1D+1/4D
    PERCEPTION: 1D+1/4D
    STRENGTH: 1D+1/4D
    TECHNICAL: 1D+1/4D
  special_abilities:
  - name: Increased Stamina
    text: Yinchorri characters gain a +1D bonus to all stamina skill rolls.
  special_skills: []
  story_factors:
  - name: Cold-Blooded
    text: If exposed to extreme cold without the proper equipment, a Yinchorri character suffers an immediate
      -2 penalty to all Perception rolls made to determine initiative. After ten minutes, the character
      will suffer an additional -2 to all attributes.  After 20 minutes, a Difficult Strength or Stamina
      roll must be made, with success indicating no damage.  Failure indicates that the character suffers
      an additional -2 penalty to all attributes.  A roll must then be made every 10 minutes, with the
      difficulty increasing by +3 points each time, and each failed roll results in a further -2 modifier
      to all attributes.  If the penalties ever exceed the Yinchorri's Strength score, he dies.  If returned
      to a warm environment, the Yinchorri will recover fully within 30 minutes.
  home_planet: Yinchorr
  attribute_dice: 12D
  move: 10/12
  size: 1.7 to 2.2 meters tall
  source: Ultimate Alien Anthology (pages 188-190), Alien
- name: Yrashu
