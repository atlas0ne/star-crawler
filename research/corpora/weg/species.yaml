  attributes:
    DEXTERITY: 2D/4D
    KNOWLEDGE: 1D/3D
    MECHANICAL: 2D/4D
    PERCEPTION: 1D+2/4D+1
    STRENGTH: 2D+2/4D+1
    TECHNICAL: 3D/5D
  special_abilities:
  - name: Technical Aptitude
    text: Yevethans have an innate talent for engineering. Yevethan technicians can improve on and copy
      any device they have an opportunity to study, assuming the tech has an appropriate skill. This examination
      takes 1D days. Once learned, the technician can apply +2D to repairing or modifying such devices.
      These modifications are highly reliable and unlikely to break down.
  - name: Dew Claw
    text: Yevethan males have large "dew claws" that retract fully into their wrist. They use these claws
      in fighting, or more often to execute subordinates. The claws do STR+1D damage. The claws are usually
      used on a vulnerable spot, such as the throat.
  special_skills: []
  story_factors:
  - name: Isolation
    text: The Yevethans have very little contact with aliens, and can only increase their knowledge of
      alien cultures and technologies by direct exposure. Thus, they are generally limited to 2D in alien-related
      skills.
  - name: Honor Code
    text: Yevethans are canny and determined fighters, eager to kill and die for their people, cause and
      Victory, and unwilling to surrender even in the face of certain defeat.
  - name: Territorial
    text: Yevethan regard all worlds within the Koornacht Cluster as theirs by right and are willing to
      wage unending war to purify it from alien contamination.
  - name: Xenophobia
    text: Yevethans are repulsed by aliens, regard them as vermin, and refuse to sully themselves with
      contact. Yevethans go to extreme measures to avoid alien contamination, including purification rituals
      and disinfecting procedures if they must spend time in close quarters with "vermin."
  home_planet: N'zoth
  attribute_dice: 12D
  size: 1.5-2.5 meters
  move: '10'
  source: Alien Encounters (page 174), Cracken's Threat
- name: Yimi
  pdf_page: 177
  attributes:
    DEXTERITY: 1D/3D
