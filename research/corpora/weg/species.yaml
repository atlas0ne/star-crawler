- name: Aar'aa
  pdf_page: 6
  attributes:
    DEXTERITY: 2D+2/4D+1
    KNOWLEDGE: 2D/4D
    MECHANICAL: 1D+2/3D+1
    PERCEPTION: 2D+2/4D+1
    STRENGTH: 2D/4D
    TECHNICAL: 1D+2/3D+1
  special_abilities:
  - name: Claws
    text: Do STR+1D damage
  - name: Skin-Changing
    text: By spending 1 full round standing against a solid surface, a skin-changer gains a +4D bonus
      to all sneak checks. For particularly complex patterns to mimic, as much as 3 rounds may be required,
      depending on the Gamemaster's decision.
  special_skills: []
  story_factors:
  - name: Sluggishness in Cold Weather
    text: Aar'aa become sluggish in particularly cold weather. At the GM's option, Aar'aa characters may
      suffer a -1D penalty to all Dexterity and Strength skills in cold weather environments.
  home_planet: Aar
  attribute_dice: 12D
  size: 1.4-2.0 meters
  move: 10/12
  description: The Aar'aa are a species of color-changing aliens from the planet Aar who have come to
    be known as "skin- changers." They are made famous around the galaxy due to the nature of their color-changin
    skin; given enough time, an Aar'aa can change his skin tone to exactly match the backdrop against
    which he is set. The Aar'aa are reptiles who often become sluggish in extremely cold temperatures;
    however, their unique ability to avoid detection makes them highly prized in fields where stealth
    is called for. The Aar'aa are many times employed as assasins, bounty hunters, bodyguards, thieves,
    and more
  personality: 'Aar''aa, like most reptilian species, have a somewhat different mindset than that of their
    warm- blooded companions. They are sometimes aloof and other times threatening, moving between moods
    quickly especially when there is a drastic change in temperature. Many are very confident to the point
    of arrogance, as over the years they have realized the extent of their usefulness in the galaxy and
    have, '
  language: Aar'aa speak their native tongue or Aarese. Basic is difficult for them, but they can manage
    a highly-accented version of it similar in sound to the accented Basic spoken by Trandoshans.
