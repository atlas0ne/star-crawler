    text: The Tarc's pent-up emotions sometimes cause them to erupt in a violent frenzy. In this state
      they attack anyone or anything near them, and they cannot be calmed. These rages can happen at any
      time, but usually they occur during periods of intense stress (such as combat). To resist becoming
      enraged a character must make a difficult willpowerroll. For each successful rage check a player
      makes, the difficulty for the next check will be greater by 5. A rage usually lasts for 2D+2 rounds,
      but for each successful rage check a player makes, the duration of the next rage will be increased
      by 2 rounds.
