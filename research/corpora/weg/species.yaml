    text: The thick plates of armor affor an Aing-Tee +2 against physical attacks.
  - name: Tail Slap
    text: The mighty tail of a Aing-Tii can deliver a powerful blow (STR+2D), though they may only use
      this attack every other turn.
  - name: Hyperspacial Perception
    text: Aing-Tii have special talents which allow them to navigate a ship. They receive an additional
      +1D to any astrogation rolls in the Marcol Void and Kathol Outback, and an additional +2D to astrogation
      rolls in the Kathol Rift.
  - name: Mute
    text: Aing-Tii do not speak, but communicate by flickering, touching, and tasting one another's long,
      thin tongues.
  special_skills: []
  story_factors:
  - name: Secretive Monks
    text: Aing-Tee are extremely secretive, and the only example of the species that is remotely known
      to the outside galaxy are the wandering Force-sensitive Aing-Tee Monks.
  home_planet: Kathol Outback
  attribute_dice: 12D
  move: 8/10
  size: 2 meters tall on average
  source: The DarkStryder Campaign - The Kathol Outback
- name: Akwin
