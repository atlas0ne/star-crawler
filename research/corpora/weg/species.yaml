- name: Araquia
  pdf_page: 14
  attributes:
    DEXTERITY: 3D/4D
    KNOWLEDGE: 1D/3D
    MECHANICAL: 1D/2D+1
    PERCEPTION: 2D/3D+2
    STRENGTH: 3D/4D
    TECHNICAL: 2D/4D
  special_abilities:
  - name: Web Throwing
    text: Araquia throw their webs down on prey or opponents, entangling them and trapping them in this
      sticky "net," which has a Strength of 5D. Once entangled, prey may be wrapped up into a bag and
      carried off.
  - name: Web Gliding
