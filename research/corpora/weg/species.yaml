- name: Anguilla
  pdf_page: 11
  attributes:
    DEXTERITY: 2D/4D+2
    KNOWLEDGE: 2D/4D
    MECHANICAL: 0D/2D
    PERCEPTION: 1D/4D+1
    STRENGTH: 2D/5D
    TECHNICAL: 0D/2D
  special_abilities:
  - name: Swimming
    text: Anguilla are natural swimmers and receive +3D to all swimming rolls.
  - name: Slippery Skin
    text: Because of their slippery skin, all brawling rolls (including grappling attacks) against Anguilla
      are at a +10 penalty.
  - name: Bite
    text: STR+1D damage.
  - name: Vision
    text: Anguilla can see in the infrared spectrum, allowing them to see in complete darkness provided
      there are heat sources. They suffer no penalties in darkness.
  - name: Enhanced Senses
    text: Anguilla have an incredible sense of smell when in Alluuvia's oceans. With an Easy search or
      Perception total, they can detect predators up to 300 meters away and they can detect Imperials
      and their vehicles (because of their "alien" scent) up to two kilometers away. They lose this bonus
      when out of water.
  special_skills: []
  story_factors:
  - name: Primitive Culture
    text: The Anguilla are technologically primative and do not know skills that rely on advanced technology.
  home_planet: Alluuvia
  attribute_dice: 12D
  move: 2/4 (slithering), 14/18 (swimming)
  size: 3-4 meters long
  source: 'Operation: Elrood (page 36)'
  language: 's: Anguilla have learned only a few basic words; some Anguilla know the Ithorian language
    fairly well. They have a natural aptitude for languages and with an Easy languages roll, they can
    understand the gist of a statement. Those trying to understand an Anguilla need a Moderate languages
    roll.'
