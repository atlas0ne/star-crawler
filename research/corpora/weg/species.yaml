      sensory information to the host. It can suffer damage, with a Strength attribute of 1D. If the segment
      is wounded, the host is also wounded until it breaks contact. If the segment is incapacitated or
      killed, the host suffers a wound and contact is broken. Maintaining contact with a segment counts
      as an action, as do any actions taken by the segment.
