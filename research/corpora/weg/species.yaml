      business, ecology, languages, value, weather prediction, bargain, persuasion or first aid.'
  - name: Natural Healing
    text: If a M'shinn suffers a form of damage that does not remove her plant covering (for example,
      a blow from a blunt weapon, or piercing or slashing weapon that leaves only a narrow wound), the
      natural healing time is halved due to the beneficial effects of the plant. However, if the damage
      involves the removal of the covering, the natural healing time is one and a half times the normal
      healing time. Should a M'shinn lose all of her plant covering, this penalty becomes permanent. A
      M'shinn can be healed in bacta tanks or through standard medicines, but these medicines will also
      kill the plant coveing in the treated area. The M'shinni have developed their own bacta and medpac
      analogs which have equivalent healing powers for M'shinn but do not damage the plant covering; these
      specialized medical treatments are useless for other species.
