- name: Yvarema
  pdf_page: 179
  attributes:
    DEXTERITY: 1D
    MECHANICAL: 1D
    KNOWLEDGE: 4D
    PERCEPTION: 5D
    STRENGTH: 2D+2/4D+2
    TECHNICAL: 3D
  special_abilities:
  - name: Hive Intelligence
    text: Yvara intelligence is dependent on the number of Yvarema present. For game purposes the hive
      intelligence affects all attributes except Dexterity, Perception and Strenght. Yvarema separated
      from the Majjvara or any royal explorers suffer penalties (indicated below) applied to their Knowledge
      and Technical attributes. Number of Yvarema Penalty 10,000+  -1 5,000-9,999  -1D 1,000-4,999  -1D+2
      500-999 -2D 100-499 -2D+2 Below 99  -3D
  - name: Pheromonic and Empathic Link
    text: The bond of the Yvarema hive-mind is based partly on pheromonic communication and partly on
      some as-yet unexplored empathy. The Yvarema are capable of empathic perception with other species,
      although it is far less accurate than the link shared with other Yvarema. They can identify the
      emotions of others around them, in general terms (angry, happy, afraid) and can tell whether an
      individual is friendly, indifferent or hostile. This check requires a Moderate Perception roll,
      which may be modified depending on the intensity of the emotion. Yvarema receive a +1D bonus to
      Perception to make this check.
  - name: Enhanced Vision
    text: Yvarema explorer-scouts have exceptional vision in low-lighting and receive a +2D bonus to Perception
      and search in darkness. Lore Gatherer
  - name: Enhanced Vision
    text: Yvarema royal explorers have exceptional vision in low-lighting and receive a +1D+1 bonus to
      Perception and search in darkness. The Majjvara
  - name: Type
    text: Alien leader Alien species 5D, cultures 5D+2, intimidation 4D+1, languages 5D+2
  - name: Bargain 7D, command
    text: Yvarema 8D+2, investigation 6D, persuasion 6D+2 STRENGHT 3D
  - name: Hive Intelligence
    text: The Majjvara is the nexus of the Yvarema hive-mind. As a result, shemay have access to any skill
      that any Yvarema has. For instance, she may use a lore- gatherer's language skill in place of her
      own. While she may use Knowledge skills as her own, she may also see and understand other skills
      like melee combat, first aid or archaic starship piloting. While she cannot actually perform these
      skills, she does understand them.
  - name: Pheromonic and Empathic Link
    text: The bond of the Yvarema hive-mind is based partly on pheromonic communication and partly on
      some as-yet unexplored empathy. The Majjvara can sense the general emotional state of other non-Yvarema
      by making a Moderate Perception check, which may be modified depending on the intensity of the emotion.
      The Majjvara receives a +1D bonus to Perception to make this check.
