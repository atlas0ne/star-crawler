- name: Farseeing
  side: Jedi Powers
  group: Control and Sense Powers
  pdf_page: 19
  control_difficulty: Very Easy, modified by proximity.  Add +5 to +20 to the difficulty if the character
    wishes to see something in the past. Add +10 to +30 for the future.
  sense_difficulty: Very Easy if the target is friendly and doesn't resist.  If the target resists, make
    a control or Perception total for the difficulty.  Modified by relationship.
  required_powers: Life sense
  time_to_use: At least one minute.
  effect: 'The Jedi may see the person or place he wishes to see in his mind as the situation currently
    exists.  The power can also be used to see the future or the past.  The Jedi sees the immediate surroundings,
    for example, when a friend is in danger, or what happened on his home planet in his absence. Farseeing
    requires calm conditions and at least one minute, but often takes a few minutes. Farseeing cannot
    be done in the face of danger. The Jedi''s vision may not be entirely accurate: Power   Sense    Past/Present
    roll > difficulty Future 0-10 50%   10% 11-20  75%   25% 21-30  90%   50% The past and present are
    set and it is merely a matter of the Jedi having correct perceptions. However, the future is always
    fluid, always in motion, never set until it becomes the present - therefore it is much harder to predict.  The
    percentages on the chart are a rough measure of how much correct information the character receives
    in the vision. For example, 10% means that the character will only be able to make out the most basic
    details of a situation, such as "My friends are in danger." 25% means that the Jedi gets a somewhat
    accurate vision of what will transpire, but most major details will be missing from the vision.  50%
    means that the character''s vision was about half right.  75% means that the character has an understanding
    of the critical happenings, but the character still has missed a major detail or two, which, of course,
    can complicate things. 90% means that the character has a very accurate and very detailed vision of
    what has transpired or will transpire.  100% means that the character''s vision is even more accurate
    and detailed, complete with minor, almost trivial details. When a character farsees into the future,
    the gamemaster has to make an honest effort to correctly represent what will happen: if the characters
    get a 75% result, the gamemaster must try to predict what he thinks the characters will do and what
    the outcome will be.  Of course, since the future is so fluid, things are always subject to change.  Farseeing
    is a great mechanic for the gamemaster to reveal part of the story - enough to tantalize the players,
    without ruining the story.'
