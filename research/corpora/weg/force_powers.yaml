  time_to_use: Five minutes
  effect: Battle meditation has two possible s.  The Jedi can force her adversaries to abandon their assault
    and turn on each other, or she can alter the tide of the battle, strengthening her allies and at the
    same time weakening her enemies.  Before initiating the power the Jedi must state which effect she
    wishes to use. The targets of this power must have initiated combat for the effects to take hold.  In
    game terms, a Jedi may only use this power effectively on or after the first round of combat, not
    before. Enemies are defined as those who seek to oppose the Jedi's immediate goal (rescuing a prisoner,
    defeating a group of dark siders, et cetera); allies are defined as those who seek to uphold and forward
    the Jedi's goal. When attempting to turn attackers against each other, the Jedi's highest skill roll
    ( control, sense, or alter) to activate the skill becomes the difficulty the targets must beat to
    avoid the .  Otherwise they immediately see their allies as the "true" enemy and attack.  The Jedi
    must maintain the effect each round for the combatants to continue fighting.  Once the power is dropped,
    its effects wear off instantly. On a successful roll to change the balance of the battle in the Jedi's
    allies' favor (the power 's second function), the Jedi's enemies lose 1D for every 4D she has in her
    best Force skill, in an attribute determined by the Jedi (i.e., Strength, Dexterity, et cetera) to
    a minimum of 1D, while her allies receive a bonus of the same value to an attribute of her choosing.
  example: Nomi Sunrider and three of her Jedi Knight companions are battling a dozen Sith minion - followers
    of Freedon Nadd. Seeing the tide of the engagement turning in the dark siders' favor, Nomi decides
    to use her battle meditation power to help her allies overcome their enemies. Since she has a control
    of 1D+1, a sense 2D+1, and an alter 1D, she may increase one attribute of all of her companions (she
    chooses Dexterity in this case) by 2D+1 (the highest of the three), and decrease one attribute of
    that of her opponents by 2D+1 (She chooses Strength), to a minimum of 1D, until she drops the power.  While
    Nomi continues to maintain the power, her allies all have a 2D+1 bonus to Dexterity (and all of its
    skills) and all her enemies have a 2D+1 penalty to Strength (and all of its skills).
