    power failed). At the gamemaster's discretion, a failed climbing/ jumping roll might mean the Jedi
    fails to achieve the desired height or distance, fails to properly cushion his landing and suffers
    normal falling damage, or both. Multiple action penalties apply. The climbing/jumping roll is a third
    action in that round, whether the power is successful or not. Height Jumped Jumping Difficulty 0 -
    1 meter   Very Easy 1 - 2 meters  Easy 3 - 4 meters  Moderate 5 - 8 meters  Difficult 9 - 15 meters
    Very Difficult 16 - 20 meters Heroic Add +5 to the difficulty for every additional 5 meters. If the
    character is simply jumping downwards, with no upwards movement, reduce jumping difficulty by one
    level. Add +1 to the difficulty per meter of horizontal distance jumped.
  example: Ambelled Daru has a control skill of 5D, alter of 3D+2, and a climbing/jumping skill of 4D,
