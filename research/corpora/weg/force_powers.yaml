  effect: 'A Jedi character may choose the life bond power to permanently form a mental link with one
    other individual, normally a mate (although sometimes siblings, parent and child, or even very close
    friends choose to life bond). Detailed information can be learned by activating the power.  If both
    characters have the life bond power, reduce all sense difficulties by one level (although both characters
    must still roll for life bond to achieve the benefits listed below).  The following benefits are only
    in effect when the characters are actively using the life bond power. On an Easy sense roll, the Force-user
    is aware of the other''s general location and general emotional state: whether the person is frightened,
    in pain, injured, happy, or experiencing some other strong emotion. On a Moderate sense roll, the
    Force-user experiences the other''s senses: he or she sees though the other''s eyes, hears what the
    other hears, and smells, tastes, and feels what the other person is experiencing.  However, at this
    level, the characters are affected by each other''s experiences - both characters share pain, and
    if one character is injured, the other character suffers an injury one level lower. On a Difficult
    sense roll, the Force-user is considered telepathically linked to the life bond partner and can read
    the surface thoughts of the other if the other is willing to share those thoughts. On a Very Difficult
    sense roll, the Force- user can send thoughts to the life-bonded partner (as per the projective telepathy
    power), allowing the characters to carry on a telepathic conversation. As an added benefit, the two
    characters can have premonitions about each other: for'
  example: ', if one character is severely injured, his or her life bond partner will sense that something
    bad has happened.  This aspect of the life bond power is modified by proximity only, as outlined below.  Sensing
    premonitions is automatic of within 11,000 kilometers of each other.  If on the same planet but more
    than 1,00 kilometers from each other, a Very Easy sense roll is necessary to sense premonitions.  If
    not on the same planet but in the same star system, and Easy sense roll is necessary to sense premonitions.  If
    not in the same star system but within 10 light-years, a Moderate sense roll is required.  If more
    than 10 light-years but less than 100 light-years away, a Difficult sense roll is necessary.  If more
    than 100 light-years away from each other, a Very Difficult sense roll is necessary. Life-bonded characters
    may not share skills, attributes, Force Points, or Character Points. However, since the characters
    do have such a close bond, the actions of one can affect the other.  If a life-bonded character commits
    an evil action, the Jedi partner receives a Dark Side Point even though these actions were not the
    Jedi''s fault.  Obviously, life bonding is an exceedingly serious commitment, and not to be taken
    lightly. Both characters must agree to the life bond for the power to work and a character may only
    life bond with one other individual.  Life bonding takes 1D weeks to complete (as the Jedi becomes
    accustomed to the background Force presence of the life bond partner).  During that time, the Jedi''s
    control is -1D.  The life bond power may not be activated until the bond is completely formed. Death
    is the only means of severing the life bond.  If one member of the life-bonded couple is killed, the
    surviving partner enters a near- catatonic state of shock for 1D days.  After re- awakening, the partner
    grieves and readjusts to a solitary existence; all die codes are reduced by -1D for the same amount
    of time it took to forge the life bond. Any attempt to forge a new life bond in the future requires
    a much longer period of adjustment: 2D weeks for a second bond, 3D weeks for a third bond, and so
    forth.'
