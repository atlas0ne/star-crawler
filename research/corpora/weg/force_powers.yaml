    to disable other electronics, such as weapons, comlinks, and even individual computer terminals. (This
    power cannot be used to disrupt entire computer networks, or large and very complicated devices such
    as a capital scale hyperdrive or shield generator.) The targeted device must be operational for this
    power to work, i.e. you can't affect a droid or datapad that's shut off or a blaster that's not being
    fired. Unless otherwise stated, these devices have a Strength of 2D. Targeting small electronics with
    this power, such as a comlink or hand weapon, adds +5 to the alter difficulty. Targeting devices that
    operate on short bursts, such as blasters, adds +15 to the alter difficulty. If a Force sensitive
    character is holding the piece of equipment the Jedi is attempting to disable, the opponent may add
    his control dice to the alter difficulty.
