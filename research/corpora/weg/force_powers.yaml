- name: Postcognition
  side: Jedi Powers
  group: Sense Powers
  pdf_page: 15
  sense_difficulty: Easy if seeing less than two hours into the past; Moderate if seeing two hours to
    a week; Difficult if seeing a week to six months; Very Difficult if seeing six months to a year; Heroic
    if seeing a year to two years; +10 for each additional year into the past.
  required_powers: Hibernation trance, life detection, sense force
  time_to_use: Five minutes, +10 to difficulty for each minute cut.  Minimum one minute.
  effect: Postcognition allows a Jedi to investigate the tenuous imprints of the Force left on objects
    when they are handled by living beings. The character must be able to handle the target object. The
    Jedi must declare how far in the past is being reviewed prior to rolling postcognition. If the roll
    is successful, the Jedi can determine who has handled or touched the object and what events have transpired
    around it. The Jedi may "search" for specific incidents or simply review past events, somewhat like
    viewing a hologram. If the postcognition roll is equal to or higher than three times the difficulty
    number, the character can witness events when the object was present as if she were there herself.
    If the postcognition roll is greater than or equal to twice the difficulty number, the Jedi gains
    a good sensory impression of the event, but is limited in that the primary sense (the sense which
    gives the most information, usually sight) is wavery or obscured; the other sensory impressions come
    through clearly. If the postcognition roll is simply greater than the difficulty number, then all
    sensory impressions are muffled, tactile sense is dulled, smells or tastes are indistinct or mixed.
    The Jedi receives a vague sense of who handled the object and what events transpired around it.
  example: Ana is going to use postcognition on a blaster to see if it was used to murder an Alliance
    officer. She declares that she will search back a full year (a Very Difficult task) - her postcognition
    total is 24, which just barely beats the difficulty number. Ana gets several sensory impressions -
    blurry images of a woman grabbing the gun, a muffled scream as a man is shot and falls to the ground.
    Unfortunately, the images are so indistinct that Ana can't tell exactly who is using the gun and who
    was shot. If Ana had limited her postcognition viewing to less than two hours - an Easy task - her
    roll of 24 would have been more than three times the difficulty. She would have seen any events with
    crystal clear clarity.
