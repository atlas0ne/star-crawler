powers:
- name: Absorb/Dissipate Energy
  side: Jedi Powers
  group: Control Powers
  pdf_page: 6
  control_difficulty: Very Easy for sunburn; Easy for intense sun; Moderate for solar wind; Difficult
    for a radiation storm.  Characters may use this power for energy attacks such as blaster bolts and
    Force lightning - the difficulty is Moderate plus the damage roll of the attack.
  this_power_may_be_kept_up: as long as the source of the energy is constant.
  effect: This power allows Jedi to absorb/ dissipate energy, including light, heat, radiation, and blaster
    bolts.  If the user fails the roll, he takes full damage from the energy. This power may be used to
    ward off sunburn, heat-stroke, and radiation exposure, as will as withstand intense heat.  This power
    may also be used to absorb blaster bolts, as Darth Vader did on Cloud City. The character must activate
    the power in the same round to absorb the blaster bolt or Force lightning -- the character must be
    able to roll the power before the attack lands.  He can't use this power after the attack has hit.
  example: A stormtrooper is shooting at Ana. Rather than dodge behind cover, she decides to use absorb/dissipate
    energy to absorb the shot. The difficulty is Moderate plus the damage of the blaster bolt.  For the
    Moderate difficulty, the gamemaster picks a difficulty number of 14.  Ana roll control and gets a
    21. If the blaster's damage roll is less than seven, then Ana absorbs the blaster bolt and takes no
    damage.   If the blaster's damage roll is seven or higher she takes full damage from the blaster shot.
  skills_used:
  - control
- name: Accelerate Healing
  side: Jedi Powers
  group: Control Powers
  pdf_page: 6
  control_difficulty: Easy for wounded characters, Moderate for incapacitated characters, Difficult for
    mortally wounded characters.
  time_to_use: One minute
  effect: A Jedi who uses this power successfully may make two natural healing rolls for the current day
    (12 hours apart) regardless of the severity of the injury.  The Jedi gets a +2 modifier to both Strength
    rolls to heal.  Accelerate healing may only be attempted once per day.
  example: Ana has been incapacitated; normally a full two weeks of rest are necessary before she can
    roll to heal. She makes her Moderate control roll to activate accelerate healing.  She now gets to
    make two Strength rolls to heal and gets to add +2 to both rolls. Since she's incapacitated, Ana needs
    a total of 9 or better to improve to wounded. Ana's first Strength roll is an eight; adding the +2
    gives her a total of 10.  She improves from incapacitated to wounded twice (she's at -2D to all actions).
    Twelve hours later, Ana gets to make her second healing roll.  Since she's wounded, she only needs
    a Strength total of 7 to improve from wounded twice (at -2D) to wounded (-1D to all actions).  Her
    Strength roll is seven; the +2 gives her a total of nine.  She now heals to wounded.
  skills_used:
  - control
- name: Concentration
  side: Jedi Powers
  group: Control Powers
  pdf_page: 6
  control_difficulty: Easy if the Jedi is relaxed and at peace; Difficult if the Jedi is filled with aggression,
    fear, or other negative emotions; Very Difficult if the Jedi is acting on the negative emotions.
  effect: When using this power, Jedi clear Force Powers 5 all negative thoughts from their minds, feeling
    the Force flowing through the universe and their own being. The individual Jedi concentrates on one
    specific task at hand.  If the skill roll is successful, the Jedi may add +4D to any one action in
    that round.  The Jedi may do nothing other than using the concentration power and using that one skill
    for a single action.  The Jedi receives no bonus if anything else is done in that round, including
    duplicate uses of the same skill or dodges or parries. This power may be used in conjunction with
    Force Points and Character Points.  This power is only in effect for one round and may not be kept
    up.
  example: Luke is flying down the trench of the Death Star.  With Ben's urging, he clears his mind of
    negative thoughts, and feels the Force flowing through him.  Using the Force, he concentrates on the
    task at hand of firing a proton torpedo into the unshielded exhausst port.  Since he has cleared his
    mind, the control difficulty is Easy. Luke's player declares that Luke is also spending a Force Point
    to accomplish the task this round.  Luke's starship gunnery skill is 6D.  he looses -1D for doing
    one other thing in the round (using the Force counts as an action), reducing his starship gunnery
    skill to 5D.  Because he rolls successfully for his control, he receives the bonus of +4D, making
    his effective skill for that round 9D.  Because he is spending a Force Point, his skill level is doubled
    to 18D! If Luke attempted any other action in that round, including firing another proton torpedo
    or blaster, or dodging enemy shots, he would receive no bonus.
  skills_used:
  - control
- name: Contort/Escape
  side: Jedi Powers
  group: Control Powers
  pdf_page: 7
  control_difficulty: Very Easy for loose bonds; Easy for hand binder; Moderate for serious restraints;
    Difficult to Heroic for maximum security (varies at gamemaster's discretion, depending on security
    measures)
  required_powers: Concentration, control pain, enhance attribute
  effect: The character may escape bonds by contorting in painful and difficult (but still physically
    possible) ways.  By stretching, twisting, and dislocating joints a Jedi can escape almost any physical
    restraining device.  While this is indeed a painful procedure, Jedi are trained to block out the pain
    and focus on the task at hand.
  skills_used:
  - control
- name: Control Disease
  side: Jedi Powers
  group: Control Powers
  pdf_page: 7
  control_difficulty: Very Easy for a mild infection, Easy for modest illness (such as a fever or flu),
    Moderate for a severe illness (gangrene or hive virus), Difficult for a life threatening disease,
    Very Difficult for a massive, long standing disease, Heroic for a rapid-acting life-threatening disease.
  required_powers: Accelerate healing
  time_to_use: 30 Minutes to several uses over the course of weeks.
  effect: Control disease allows the Jedi to direct and control the antibodies and healing resources of
    her body to throw off an infection or to resist the diseases within the body.  Using the power requires
    the Jedi to meditate for half an hour. If the infection is severe, the Jedi must make repeated skill
    attempts over the course of several weeks or months to cure the disease entirely. (Gamemaster's discretion
    as to how many rolls are needed and how often.)
  skills_used:
  - control
- name: Control Pain
  side: Jedi Powers
  group: Control Powers
  pdf_page: 7
  control_difficulty: Very Easy for wounded or stunned characters, Easy for incapacitated characters,
    Difficult for mortally wounded characters. The power can be kept up, so the character can ignore the
    pain of injuries for a long period of time.  However, whenever the character is injured again, the
    Jedi must make a new control pain roll, with the difficulty being the new level of injury.
  effect: 'An injured character who uses control pain can act as if he has not been wounded the next round
    after he uses the skill.  The wound is not healed, but the character doesn''t suffer the penalties
    of being wounded: a wounded Jedi doesn''t loose 1D from all actions; an incapacitated character can
    still act normally, as can a mortally wounded character.  This power can also be used to shrug off
    any stun results. However, the injury can still grow worse even if the character doesn''t feel the
    pain.   For'
  example: ', a character who''s been wounded twice and is wounded again would still become incapacitated.  Mortally
    wounded users make the same rolls as other mortally wounded characters, even if they aren''t feeling
    any pain.'
  skills_used:
  - control
- name: Detoxify Poison
  side: Jedi Powers
  group: Control Powers
  pdf_page: 8
  control_difficulty: Very Easy for a very mild poison (alcohol); Easy for mild poison; Moderate for an
    average poison; Difficult for a virulent poison; Very Difficult to heroic for a neurotoxin.
  time_to_use: Five minutes
  effect: This power allows a Jedi to detoxify or eject poisons that have entered her body.  If the Jedi
    makes the power roll, the poison doesn't affect her.
  skills_used:
  - control
- name: Emptiness
  side: Jedi Powers
  group: Control Powers
  pdf_page: 8
  control_difficulty: Moderate
  note: Characters who are consumed by the dark side of the Force may not use this power.
  required_powers: Hibernation trance
  effect: 'The user empties his mind to allow the Force to flow through him.  Characters in emptiness
    seem to be in deep meditation and are totally oblivious to their surroundings.  A character in emptiness
    may not move or take any action except to try to disengage from the emptiness. While in emptiness,
    a character is difficult to sense or affect with the Force.  When another character attempts to use
    a Force power on the character in emptiness, add the meditating character''s emptiness roll to the
    difficulty for the other character''s sense or control rolls (only the sense roll if the affected;
    if the power doesn''t use the sense skill, then add the difficulty to the control roll).  This difficulty
    is added regardless of whether or not the empty character would willingly receive the power''s effect.
    Once a character gets out of emptiness, the character gets a +6 bonus modifier to all Force skill
    rolls for a period equal to the amount of time the character spent in emptiness.  This bonus is reduced
    by 1 for every Dark Side Point the character has. When in emptiness, characters dehydrate and hunger
    normally - some initiates have died because they lacked enough control to bring themselves out of
    emptiness. When the character enters into emptiness, the player must state for how long the character
    will be in meditation.  A character must make a Difficult control skill roll to exit emptiness.  The
    character may attempt to come out of meditation under the following circumstances: • When the stated
    time has passed. • Once each hour beyond the original time limit. • The character''s body takes any
    damage more serious than stun damage. Force Powers 7'
  skills_used:
  - control
- name: Enhance Attribute
  side: Jedi Powers
  group: Control Powers
  pdf_page: 9
  control_difficulty: Moderate
  effect: A Jedi uses this power to increase a single attribute for a limited period.  An increased attribute
    can help a Jedi jump higher, see better, and run faster.  All skills governed by the enhanced attribute
    increase by the same amount for as long as the power remains in . An attribute increased by this power
    remains enhanced for the duration listed below.   Duration and attribute increase are determined by
    how much a character's control skill roll exceeds the difficulty number.  Duration can be extended
    through the use of Character Points - for every Character Point a Jedi spends, the duration is increased
    by one combat round.  The points can be spent at any time before the power fades. A Jedi can only
    increase one attribute at a time.  If a character invokes the power to enhance a second attribute
    while the first attribute is still enhanced, then the first enhancement fades and the second attribute
    receives the increase. Skill Roll >  Attribute Difficulty By  Duration/Increase 0-13   +1D / 3 rounds
    14-25   +2D / 2 rounds 26+   +3D / 1 round
  skills_used:
  - control
- name: Force of Will
  side: Jedi Powers
  group: Control Powers
  pdf_page: 9
  control_difficulty: Easy
  this_power_may_be_kept_up: .
  effect: By using Force of will, the character uses his or her own willpower skill to fight the s of
    hostile Force powers.  If faced with a mind-based power, the Jedi's willpower skill roll may be added
    to either the control or Perception code.  The control (or Perception) plus willpower total is referred
    to as the "protection number." If the attack roll is less than the target's control (or Perception)
    roll, the character suffers no ill effects.  If the attack roll is greater than the protection number,
    the Jedi suffers the full effects of the attacking power.  If the attack roll is greater then the
    control roll, but less than the protection number, the Jedi is protected from the power, but his willpower
    is considered "battered." Subtract  -1D from the character's willpower skill.  The Jedi can still
    continue to defend, but with the decreased willpower.  Reroll for a new protection number in this
    case. If a Jedi's willpower skill ever reaches 0D, the Force of will  power is automatically dropped,
    and the Jedi can only resist with control or Perception. It takes one day to recover 1D of damage
    from a "battered will," or one hour in emptiness (or rage) for each 1D to recover.
  note: Force of will  does not protect against Force lightning or Force storms or objects hurled by telekinesis.  These
    are external rather than internal powers, in which case willpower would be useless. However, it works
    on injure/kill, telekinetic kill, inflict pain, and other powers which directly use the Force to affect
    the target.
  example: Nomi is attacked by an alien being whose skills reach into the dark side.  With an Easy control
    roll, Nomi initiates the force of will power.  The alien decides to use the telekinetic kill power
    on Nomi.  The alien's control and sense rolls are successful, and he now rolls his alter skill against
    Nomi's control skill of 6D.  Because Nomi is using the force of will  power, she adds her willpower
    skill of 7D+2 to her control code for a protection number of 13D+2. If the alien rolls less than Nomi's
    control skill, she would remain unaffected. If the alien rolls greater than the protection number,
    Nomi would be struck by the full force of her opponent's attack.  The alien would make an additional
    alter roll against Nomi's unaided control roll to determine damage. If the alien rolls greater than
    Nomi's control skill, but less than her protection number, she would be fully protected from the hostile
    Force power.  However, her will is considered to be battered, and her willpower skill drops -1D to
    6D+2.  She must roll the 6D+2 to get a new (and presumably lower) protection number.  It will take
    her either a full day of meditating, or one hour in emptiness to bring her willpower die code back
    up to 7D+2.
  skills_used:
  - control
- name: Hibernation Trance
  side: Jedi Powers
  group: Control Powers
  pdf_page: 10
  control_difficulty: Difficult
  this_power_may_be_kept_up: .
  effect: 'The Jedi places himself into a deep trance, remarkably slowing all body functions. The Jedi''s
    heartbeat slows, his breathing drops to barely perceivable levels, and he falls unconscious. When
    a Jedi enters a hibernation trance, the character must declare how much time they will spend and/or
    under what circumstances the character will awaken: after a specific amount of time, or what stimulus
    needs to be present (noise, someone touching them, etc.).  A character can heal while in a hibernation
    trance, but may not use any other skills or Force powers. Hibernation trance serves two purposes.
    It allows a Jedi to "play dead."  It can be used to survive when food or air supplies are low.  A
    character in hibernation uses only about a tenth as much as someone who is sleeping - he can hibernate
    for a week in a dry climate, for up to a month in a wet climate before dying of thirst. Anyone who
    sees a Jedi in hibernation assumes he is dead unless he makes a point to test him.  Another Jedi with
    the sense skill or the life detection power will be able to detect the Force within the hibernating
    character and realize that he is alive.'
  skills_used:
  - control
- name: Instinctive Astrogation Control
  side: Jedi Powers
  group: Control Powers
  pdf_page: 10
  control_difficulty: Very Difficult.  Modified by astrogation difficulty.
  time_to_use: One minute
  effect: 'Instinctive astrogation control is far more difficult than sense-based instinctive astrogation
    power because rather than trying to feel the correct solutions to the hyperspace equations, the Jedi
    calculates them in his head. This is quite possible and is often done as part of training exercises,
    though the figures generated are rarely utilized because it is so easy even for a Jedi to make a mistake.
    The difficulty is modified by how hard the task is with a nav computer. Task is: Modifier (add to
    difficulty) Very Easy  0 Easy  +5 Moderate  +10 Difficult  +15 Very Difficult +20 Heroic  +30 If the
    control roll is successful, a Very Easy astrogation roll is necessary to enter the correct routs into
    the nav computer.  If the Jedi fails the attempt, she overlooks an obstacle, and sends the ship down
    an inherently dangerous path, thereby making the astrogation difficulty Very Difficult.  If the control
    roll is missed by five or more points, the astrogation difficulty increases to Heroic. This is a largely
    unknown application of the control power that allows Jedi to plot astrogation paths instead of using
    the more well-known sense-based instinctive astrogation power.  Instinctive astrogation control is
    little more than a curiosity, studied only by a few Jedi theoreticians.'
  skills_used:
  - control
- name: Reduce Injury
  side: Jedi Powers
  group: Control Powers
  pdf_page: 10
  control_difficulty: Moderate for incapacitated characters, Difficult for mortally wounded characters,
    Very Difficult for dead characters.
  required_powers: Control pain
  effect: By using this power, a Jedi may call upon the Force to reduce the amount of injury he suffers;
    this power is normally only used in desperation because of its long-term repercussions. When the power
    is successfully used, the Jedi loses a Force Point.  Any injury that is suffered is reduced to wounded.  If
    the original injury would have killed the character, he must choose to suffer a permanent injury of
    some kind.
  note: Spending Force Points in this manner not at the beginning of the round - is allowed. Also, it
    is not always a "selfish" act to save one's own life, so the character might be able to get the Force
    Point back.  If the character was fighting to save others from doom and fails - and if he falls, they
    certainly die - this would be considered a heroic action because it involves a great sacrifice.
  skills_used:
  - control
- name: Remain Conscious
  side: Jedi Powers
  group: Control Powers
  pdf_page: 10
  control_difficulty: Easy for stunned characters, Moderate for incapacitated characters, Difficult for
    mortally wounded characters.
  required_powers: Control pain
  effect: Remain conscious allows a Jedi to remain conscious even when he has suffered injuries which
    would knock him unconscious. In game terms, when a character with this power suffers this kind of
    injury, they lose all of their actions for the rest of the round, but they are still conscious (normal
    characters automatically Force Powers 9 pass out).  On the next round, the character may attempt to
    activate the power - this must be the first action of that round; the Jedi cannot even dodge or parry.
    If the role is unsuccessful, the Jedi passes out. If successful, the Jedi can do any one other action
    declared for that round - often characters will attempt to control pain so that he will be able to
    remain conscious.  Once this action is completed, the Jedi will lapse into unconsciousness, unless
    control pain or something else is done to keep the character conscious.
  example: Ana suffers several stuns and should be knocked unconscious ... but she has remain conscious.  Ana
    loses her remaining actions for that round, but she is still awake. At the beginning of the next round,
    Ana's player declares that she will try to activate remain conscious and control pain. The player
    makes the Moderate control roll to activate remain conscious, so Ana stays awake for the rest of the
    round. (If the roll had failed or Ana hadn't activated remain conscious, she would have passed out
    at the beginning of the round.) Ana must now make a Very Easy control roll to activate control pain.
    If she succeeds, she may now act normally; if the roll fails, Ana is overwhelmed by the pain and slips
    into unconsciousness.
  skills_used:
  - control
- name: Remove Fatigue
  side: Jedi Powers
  group: Control Powers
  pdf_page: 11
  control_difficulty: Moderate.
  this_power_may_be_kept_up: .
  required_powers: Accelerate healing, control pain
  effect: The character uses this power to combat the effects of strenuous work.  The Jedi manipulates
    the Force, causing bodily toxins to be ejected much more efficiently, thus allowing for greater stamina.  While
    kept up, the Jedi must make a stamina check once per day.  While using this power, a Jedi must fail
    two stamina checks before he or she is fatigued.  The character still has to eat and drink normally.  If
    the Jedi does fail two stamina checks and becomes fatigued, a penalty of -1D is applied to all attributes
    and skills for 1D hours.
  skills_used:
  - control
- name: Resist Stun
  side: Jedi Powers
  group: Control Powers
  pdf_page: 11
  control_difficulty: Moderate
  time_to_use: One minute
  effect: Resist stun allows the Jedi to prepare his body to resist the effects of stun damage.  The power
    must be activated before the character has suffered any damage. A successful result allows the Jedi
    to resist all stun results (except for unconscious).  An unconscious result forces the Jedi to drop
    the power and he is considered stunned.  Normal injuries (wounded, incapacitated, mortally wounded,
    and killed) are treated normally.
  example: Ana has a Strength of 3D; if she suffers three stun results, she is knocked unconscious. She
    activates the resist stun power and decides to keep it "up". (Since the power is kept "up", she suffers
    a -ID penalty to all actions.) In the first round of combat, Ana suffers two stun results ... but
    since she is using the resist stun power, she is not affected by the stuns. When she suffers a third
    stunned result, Ana must drop the resist stun power, but she is only considered stunned (-ID to actions).
  skills_used:
  - control
- name: Short-Term Memory Enhancement
  side: Jedi Powers
  group: Control Powers
  pdf_page: 11
  control_difficulty: Difficult
  required_powers: Hibernation trance
  effect: When a Jedi uses this power, he or she can replay recent events in order to more carefully examine
    images and peripheral occurrences.  Using the power, a Jedi can freeze images and even scan memory
    tracks to recall details that were seen but not consciously registered at the time of observation.
    In game terms, this power can be used to alert a Jedi to information, items, other characters, or
    anything else that passed before his senses within a specific span of time.  In addition, if a gamemaster
    provided clues or leads to clues that the players originally missed or ignored, this power can be
    used to recall them.  When players get stuck on a puzzle or mystery within an adventure, this power
    can alert them to possible solutions, if those solutions were observed earlier in the adventure. How
    far back a Jedi can remember depends on the success of his control roll. Skill Roll >          Memory
    Dificulty by         Extends Back 1-8              Through current episode 9-20            Through
    last episode 21+           Through last two episodes
  skills_used:
  - control
- name: Beast Languages
  side: Jedi Powers
  group: Sense Powers
  pdf_page: 12
  sense_difficulty: Easy if the animal is domesticated/friendly (such as a bantha); Moderate to Difficult
    if the animal is wild, but non-predatory (such as an undomesticated tauntaun); Very Difficult to Heroic
    if the animal is ferocious/predatory (such as a wild rancor).
  this_power_may_be_kept_up: .
  required_powers: Life sense, receptive telepathy, projective telepathy, translation
  effect: This power allows the Jedi to translate a beast-language and allows the Jedi to speak it. As
    creatures rarely have "true" languages, the Jedi is actually reading the differences in surface emotions
    within grunts and growls and other cues of body language.  Note that the character may keep up this
    power if the Jedi needs to continue picking up the emotional state of a creature.  For beasts that
    can be ridden, subtract 2D from their orneriness code while this power is in effect.  A creature's
    minimum orneriness code is 0D.
  skills_used:
  - sense
- name: Combat Sense
  side: Jedi Powers
  group: Sense Powers
  pdf_page: 12
  sense_difficulty: Moderate for one opponent, modified by  +3 for each additional opponent the Jedi wishes
    to defend against.
  required_powers: Danger sense, life detection
  effect: Combat sense allows a Jedi to focus on the battle at hand. Everything else becomes dulled and
    muted as the Jedi's senses are all turned toward the combat occurring around him.  All targets become
    mentally highlighted in the Jedi's mind, enhancing his ability to attack and defend.  In game terms,
    the Jedi gains important advantages. First, the Jedi may choose when he wishes to act that round-no
    initiative rolls are necessary while the power is in effect.  If more than one Jedi is using the power,
    whoever rolled highest when invoking the power determines when he wishes to act. Second, the Jedi's
    attack and defense rolls are increased by +2.  Combat sense lasts for ten combat rounds and doesn't
    count as a "skill use' for determining die code penalties.
  skills_used:
  - sense
- name: Danger Sense
  side: Jedi Powers
  group: Sense Powers
  pdf_page: 12
  sense_difficulty: Moderate or attacker's control roll
  required_powers: Life detection This power can be "kept up".
  effect: Danger sense allows a Jedi to extend his senses around himself like protective sensors creating
    an early warning system for as long as the power remains in effect. When this power is used, the Jedi
    detects any attacks the round before they are made. This gives the Jedi a round to decide how to react
    to the danger. In game terms, if a character plans to attack the Jedi on the next round, she must
    declare her action the round before.  Attacking characters with Force skills may roll their control
    skill to increase the difficulty of using this power. Force Powers 11
  skills_used:
  - sense
- name: Instinctive Astrogation
  side: Jedi Powers
  group: Sense Powers
  pdf_page: 13
  sense_difficulty: Moderate, modified by astrogation difficulty.
  required_powers: Magnify senses
  effect: 'This is the more well known ability of the Jedi to calculate astrogation routes without the
    use of a nav computer.  The Jedi uses his sense skill to feel through the myriad of hyperspace routes
    to determine the safest path. The difficulty is modified by the treacherousness of the path: Task
    is:      Modifier (add to difficulty) Very Easy  0 Easy  0 Moderate  0 Difficult  +5 Very Difficult
    +10 Heroic  +15 If the Jedi succeeds at charting the course, she needs only generate an Easy astrogation
    total to plot a safe path.  If the Jedi fails the roll, the astrogation difficulty is automatically
    Very Difficult; if the roll is missed by more than five points, increase the difficulty to Heroic.'
  skills_used:
  - sense
- name: Life Detection
  side: Jedi Powers
  group: Sense Powers
  pdf_page: 13
  sense_difficulty: Very Easy if the subject has Force skills or is Force-sensitive; Moderate if not.
    Modified by relationship.
  this_power_may_be_kept_up: .
  effect: This power allows the Jedi to detect the location of sentient beings who might otherwise remain
    hidden from their normal senses.  When the power is activated, the Jedi knows the location of all
    sentients within 10 meters - if the power is kept up, the Jedi may know whenever a sentient approaches
    within 10 meters of them or vice versa. When the Jedi approaches or is approached by a sentient being,
    the character makes a sense roll and each sentient creature makes an opposed control or Perception
    roll to avoid detection.  Both actions are "free" actions and don't count as a skill use (and thus
    there are no die code penalties except those caused by injury).  If a tie occurs, the Jedi detects
    the creature in question. If Jedi beats the target's roll by 10 or more points, the Jedi is aware
    if the person has Force skills (yes or no), is Force-sensitive (yes or no), or if they have met before
    (yes or no), and if yes, what their identity is.
  example: Ana has her life detection power "up." Bill, the gamemaster, knows that three Gamorreans are
    approaching Ana from behind. She rolls her sense to see if she can detect the beings - she rolls a
    22. The first Gamorrean's roll is a 9; Ana's roll beats his by 13 points. Ana knows the being is not
    Force-sensitive, doesn't have Force skills; since Ana's never met the being before, she doesn't know
    its identity, not even its species. The second Gamorrean rolls a 15 - Ana only knows about the existence
    and location of the second being. Ana's roll beats the third Gamorrean's by 11 points, so she knows
    that this being is also not Force-sensitive and doesn't have Force skills. However, Ana has met the
    creature before-she knows the third being is Draughckt, a Gamorrean she met a few years earlier on
    the planet Seltos.
  skills_used:
  - sense
- name: Life Sense
  side: Jedi Powers
  group: Sense Powers
