    -2D for multiple action penalties), and gets a 7, making his alter difficulty.  Next he rolls his
    control of 3D, and gets a 11 (which exceeds the difficulty by 4).  This adds +2D to his climbing/jumping
    roll, cancelling out the multiple action penalty. The ledge on which he wants to jump is 4 meters
    up and the chasm is 3 meters across, thus the difficulty is Moderate+3. Ambelled Daru rolls his 4D
    climbing/jumping (4D -2D +2D), and gets a 16, making the difficulty and using the Force to leap safely
    on top of the ledge.
