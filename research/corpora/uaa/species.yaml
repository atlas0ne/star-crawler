    can cover the eyes to protect and clean them.)
  personality: The Chevs are not a broken people, despite their apparent subservience to the Chevin. Their
    passive, compliant behavior belies a sly crafti- ness and firm resolve. Centuries of slavery have
    made the Chevs protective of their cultural heritage as well as forced them to become highly adaptive.
    Chevs know that they will overthrow their masters some day, but until that day comes, they remain
    patient a
