      one) +2 or Profession (any one) +2, Listen +1, Read/Write Ranth, Speak Basic (civilized Ranth only),
      Speak Ranth, Spot +1, Survival +1 (nomadic Ranth in arctic ‘dimates only). Feats: Alertness. Rodian
      Rodians hail from the Tyrius star system in the Mid Rim, and their culture places great emphasis
      on hunting and tracking. The Rodian homeworld is humid and choked with _heavy rain forests teeming
      with dangerous lifeforms. The Rodians evolved into brutal hunters and killers to survive. As their
      technology became more advanced, they started exterminating other lifeforms on their world at an
      increasing pace. If a Republic scout vessel hadn''t reached Rodia when it did, the world’s ecosystem
      might well have been damaged beyond repair, and the Rodians would have died out. Instead, they joined
      the Galactic Republic, fascinated by the powerful ships that let them travel to the stars and the
      mighty energy weapons used by the aliens they found there. Rodian culture is built almost entirely
      around the concept of “the hunt.” Their art glorifies violence and the act of stalking prey. The
      more intelligent and dangerous a hunter''s prey, the more honorable the hunt. Rodians have numerous
      annual festivals that exist solely to honor such activities. Since joining the test of the galaxy’s
      spacefaring species, the Rodians have come to view bounty hunting as the most honorable profession
      in existence. Many of them have found great success in this field. Personality: Rodians tend to
      be violent, tenacious, and dedicated. Physical Description: Rodians have multifaceted eyes that
      range in color from light blue to pitch black, a tapered snout, and skin that is universally deep
      green. A typical Rodian has a prominent ridge of spines running along the back of his skull. His
      fingers are long and flexible, and end in suction cups. The average Rodian stands 1.5 to 1.7 meters
      tall. Homeworld: Rodia, an industrial Mid Rim planet choked with heavy rain forests. Language: Rodians
      speak Rodese and Basic, but many learn to speak Huttese as well. Example Names: Andoorni Hui, Avaro
      Sookcool, Beedo, Chido, Clezo, Drooto Sploonore, Doda, Gorak Khzam, Greedo, Greeata, Griv, Gulek
      Lohn, Keerik, Kelko, Koobis Nu, Loa Tibeeme, Malo, Meris Gen, Navik, Ne’chak, Neela, Neesh, Pqweeduk,
      Revidjasa, Skee, Slerog Fenn, Teeko, Treetor, Tulagn, Wald. Age in Years: Child 1-12; young adult
      13-15; adult 16-35; middle age 36-49; old 50-59; venerable 60+. Adventurers: Rodian adventurers
      leave their homeworld to improve their skills, hoping to one day return and claim the title of Hunt
      Master. To this end, they take on roles that allow them to flex their hunt- ing skills, increase
      their battle prowess, and ultimately gain experience to some day earn the prestigious profession
      of “bounty hunter.” Few Rodians have anything to do with the Force, so Rodian Force-users are extremely
      rare.'
