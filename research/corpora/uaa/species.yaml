    text: Toydarians gain the bonus feat Trick.
  - name: Free Language Skills
    text: Read/Write and Speak Toydarian, and Speak Huttese.
  adventurers: Toydarian adventurers, rare as they are, tend to be fringers or scoundrels, No Toydarian
    Force-users are known or believed to exist.
  example_names: Creducio, Farex, Gelt, Jink, Kelgwa, Oparro, Pwigiri, Quant, Rovello, Rylkra, Tigbwi,
    Tyra, Watto, Zerpo.
