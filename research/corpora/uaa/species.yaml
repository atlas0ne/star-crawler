  adventurers: Psadans have little or no interest in exploring the galaxy. Very few Psadans seek to leave
  example_names: Ba‘han, Da’yid, Lupec, Parla, Rhev, Rsidd, Sinni, Sy’nir, Yaodi.
  language: Psadan is a guttural language of grunts, throaty groans, and deep vocalizations. There is
    no written form of the language. Psadans pass on knowledge through an oral history.
  homeworld: Wayland, a remote jungle world in the Outer Rim.
  physical_description: Psadans have large flat faces, short stocky legs, and rock-hard scales. Their
    backs are covered with a shell of thick armored plates, and they frequently adorn their bodies with
    skins and bones from creatures they've hunted. The average Psadan stands about 1.5 meters tall.
  personality: Psadans are nature worshipers who enjoy hunting. Their religion dictates that no part of
    a slaughtered creature can go to waste. Their low
- name: Quermian
  pdf_page: 126
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Strength, +2 Dexterity, -2 Constitution, +2 Intelligence, +2 Wisdom.
  - name: Medium-size
    text: As Medium-size creatures, Quermians have no special modifiers due to their size.
  - name: Speed
    text: Quermian base speed is 10 meters.
  - name: Short-Range Telepathy
    text: Quermians can commu- nicate telepathically with other Quermians as well as Force-users who possess
      the Sense feat. Using this ability is a full-round action. A Quermian must make eye contact with
      the person it wishes to contact telepathically and succeed at a Wisdom check (DC 10). A failed check
      indicates that the attempt has failed, although the Quermian may try again. The Quermian must physically
      see the target; for instance, eye contact through a HoloNet communication would not suffice. If
      the target wishes to resist the telepathic contact, he must succeed at a Will save (DC 20) to block
      the thought transmission. Quermians can only trans- mit simple phrases and emotional impressions,
      and they must renew the telepathic contact every round with a new Will save. This ability does not
      enable non-Quermians to send telepathic messages, only receive them.
  - name: Free Language Skills
    text: Read/Write and Speak Quermian.
  adventurers: Quermian adventurers often become nobles or scoundrels or pursue one of the Force-using
    classes. Few, if any, belong to more combat oriented classes, since Quermians typically rely on reason
    rather than violence.
  example_names: Yrrani Basa, Ayra Foon, Naaz Hola, Yarael Poof, Tyan Maereth.
  language: Quermians have the own spoken and written language, Spoken Quermian is often described as
    melodious, and the Quermian alphabet contains as many vowels as consonants. Quermians also speak Basic
    with ease.
  homeworld: The beautiful Outer Rim planet of Quermia.
  physical_description: Quermians have four arms, two clawed feet, and small bodies. The hands of one
    set of arms contain their olfactory glands. Their heads sway almost hypnotically at the end of a long
    neck. Deeply set small eyes rest above a lipless mouth that seems permanently set in a bemused smile.
    The Quermian brain is split between the head and chest cavity. Skin color ranges from ashen white
    to dark gray. Adults
  personality: Quermians are a gentle, unassuming people. They embrace reason, shun violence, and enjoy
    interacting with members of other species and cultures,
- name: Qwohog
  pdf_page: 127
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Dexterity, -2 Wisdom.
  - name: Small
    text: As Small creatures, Qwohog gain a +1 size bonus to their Defense, a +1 size bonus on attack
      rolls, and a +4 size bonus on Hide checks, They must use smaller weapons than Medium- size beings
      use, and their lifting and carrying limits are three-quarters those of Medium-size characters.
  - name: Speed
    text: Qwohog base speed is 6 meters on land and 12 meters in water.
  - name: Breathe Underwater
    text: As amphibious creatures, Qwohog can’t drown in water, Qwohog receive a +8 species bonus on Swim
      checks and can alway choose to take 10 on such checks, even under adverse conditions.
  - name: Saltwater Aversion
    text: A Qwohog immersed in salt water for more than 10 minutes begins taking damage (1 point per minute)
      as the salt bums hi gill slits and lungs.
  - name: Free Language Skills
    text: Read/Write and Speak Qwohog, Speak Basic or Qwohog Sign Language
  adventurers: Qwohog remain unknown to the galaxy at large until Rebel and Imperial agents discover their
    homeworld during the Rebellion era. Many Qwohog serve the Rebel Alliance during the Galactic Civil
    War and are rewarded with postings in the New Republic. Independent Qwohog are usually hired as surveyors
    and medics, although a few have found work as pilots. Qwohog heroes can belong to any class, although
    f
  example_names: Ceyluun, Eelid, Falor, Indeeri, Jebel, Kei No Kay, K’zk, Melleod, Nemedor, Pol, Saryana,
    Zaami.
  language: Qwohog use sound waves to communi- cate underwater. In air, these sound waves can only be
    heard out to a range of 4 meters, and various devices are needed to translate the sound waves to words.
    The Qwohog also use sign language to communicate out of the water over a distance. This native sign
    language has been replaced by Basic but is still part of the Qwohog’s heritage.
  homeworld: Hirsi, an Outer Rim planet covered mostly by freshwater lakes. What little land there is
    on Hirsi has small deposits of rare rudic crystals, which are prized for their use in sensor devices.
  physical_description: Qwohog have smooth skin, scales instead of hair, black eyes, and a slim yet muscular
    frame. Raised silvery scales grow atop their heads and ring their wrists, waists, and ankles. Rows
    of gill slits under their arms circulate water through their lung cavities; out of water, the gill
    slits are nearly undetectable.
  personality: Qwohog work and play hard, dividing their energies equally between survival and pleasure.
    Although Wavedancers draw strength and inspiration from their communities, many are lured from their
    homeworld by a sense of wanderlust and a desire to explore the unknown. Although very trusting and
    eager to make friends, a Qwohog can display startling ferocity when wronged.
- name: Ranat
  pdf_page: 128
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Dexterity, -2 Intelligence, ~2 Charisma.
  - name: Small
    text: As Small creatures, Ranats gain a +1 size bonus to their Defense, a +1 size bonus on attack
      tolls, and a +4 size bonus on Hide checks. They must use smaller weapons than Medium-size beings
      use, and their lifting and carrying limits are three-quarters those of Medium-size characters.
  - name: Speed
    text: Ranat base speed is 10 meters, or 2 meters when burrowing through soft earth or clay.
  - name: Natural Weapon
    text: A Ranat can bite opponents with its powerful jaws and sharp teeth, dealing 1d4 points of piercing
      damage (plus Strength modifier}. The bite attack does not provoke attacks of opportunity.
  - name: Flexible Body
    text: Ranats have somewhat flat, semi- flexible bodies. They gain a +4 species bonus on Escape Artist
      checks and can move through open- ings too tight for Small creatures but large enough to accommodate
      Tiny creatures.
  - name: Darkvision
    text: Ranats can see in the dark up to 20 meters. Darkvision is black and white only but otherwise
      functions as normal sight.
  - name: Primitive
    text: Ranats with heroic or professional classes receive the bonus feat Weapon Group Proficiency (primitive
      weapons) instead of the usual Weapon Group Proficiency bonus feats.
  - name: Human Enmity
    text: Ranats take a —-2 penalty on Bluff, Diplomacy, Entertain, Gather Information, and Intimidate
      checks when dealing with Humans.
  - name: Free Language Skills
    text: Read/Write and Speak Ranat.
  example_names: Engal Jeers, Kleef, Marbor, Nestra Pallik, Reegesk, Targan, Veerz, Nevar Yalnal.
  homeworld: The Outer Rim planet of Rydar 1 {until The Rise of the Empire era). After Human colonists
    exterminate the Ranats on Rydar Il, Ranat survivors adopt the Outer Rim jungle world of Aralia as
    their new homeworld.
  physical_description: A Ranat is a 1-meter-tall, thin, dirty, rodentlike creature with sharp, protruding
    incisors and a Jong. whiplike tail. A Ranat’s short, durable claws, while not terribly effective in
    combat, allow it to burrow easily through soft dirt and clay. Its fur-covered body is flexible, enabling
    it to slip through narrow openings.
  personality: Ranats are selfish, aggressive, foul- tempered, obstinate, and treacherous beings who take
    whatever measures they feel are necessary to insure their own survival. They are ferocious when comered
    and threatened. Although primitive and crude by galactic standards, they like to hoard technological
    items and various trinkets of personal value.
- name: Ranth
  pdf_page: 129
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Dexterity, -2 Intelligence, -2 Wisdom.
  - name: Medium-size
    text: As Medium-size creatures, Ranth have no special modifiers due to their size.
  - name: Speed
    text: Ranth base speed is 10 meters.
  - name: Natural Weapon
    text: A Ranth can swipe opponents with a sharp clawed hand, dealing 1d3 points of slashing damage
      (plus Strength modifier). The claw attack does not provoke attacks of opportunity.
  - name: Insulating Fur
    text: 'Ranth gain a +4 species bonus on Fortitude saves to resist the effects of extreme cold (see
      Heat and Cold in Chapter Twelve of the Star Wars Roleplaying Game). ~@Skill Bonus: Nomadic Ranth
      gain a +2 species bonus on Survival checks in arctic climates. Civilized Ranth do not receive this
