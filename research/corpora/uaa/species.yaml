      A, Equipment: Variety of personal belongings. Skills: Craft {any one) +3, Hide +3, Knowledge (any
      one) +3, Read/Write Elom, Read/Write Elomin, Speak Elom, Speak Elomin, Survival +0. Feats: None.
      Elomin For several centuries, the galaxy believed the Elomin were the only sentient species on the
      desert world Elom. When the Old Republic first visited Elom a century before the rise of the Empire,
      the Elomin were divided into separate political nations, used internal combustion engines and slug-throwing
      weaponry, and were barely able to launch satellites into orbit. Blasters, repulsorlifts, and starships
      were beyond anything the Elomin had ever imagined. They took quickly to the advanced technology
      the first-contact specialists chose to share with them. By the time the Galactic Civil War erupted,
      the Elomin and their world were active participants in the galac- tic economy. The world of Elom
      is rich in deposits of lommite, a mineral used in the fabrication of transparisteel. Lommite became
      a sought-after commodity, and the Elomin were canny enough to enter into mining agreements with
      offworld shipbuilders that would not damage the environment of their world. Culturally, the Elomin
      try to discover or create order in all things. They view the universe as a logical, organized puzzle
      and endeavor to find the pieces and bring them to their logical places. When confronted with something
      that doesn’t fit into the pattern they have defined, they may try to redefine the pattern but are
      just as likely to attempt to ignore the discordant details. Such was the case when the Elomin first
      discovered the existence of the underground-dwelling Eloms, another sentient species native to their
      world. The Elomin first denied the existence of the Eloms and then later denied they were sentient.
      It wasn’t until the Old Republic granted the Eloms all the rights of sentients under its laws and
      the Eloms helped the Elomin resist Imperial oppression. during the Rebellion era that they fully
      acknowledged the existence and independence of their neighbors. Personality: Elomin have difficulties
      relating to other species, which they view as perpetrators of chaos. They excel as pilots, navigators,
      and theoreti- cal thinkers as long as they can operate independently or with other Elomin. They
      get along well the Woastoids and other species that value logi and order as much as they do, but
      Elomin consider dealing with Humans and other illogical beings an exercise in frustration. Physical
