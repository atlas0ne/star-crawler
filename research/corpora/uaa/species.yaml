      one) +2, Knowledge (any one) +3, Profession (any one) +3, Read/Write Basic, Read/Write Devaronese,
      Speak Basic, Speak Devaronese. Feats: None. Draethos Draethos are roughly humanoid beings who live
      nearly 800 years. Although they are reputed to be fierce and unrepentant warriors, Draethos at large
      have failed to live up to this reputation. In fact, Draethos encountered away from their homeworld
      are pacifistic and highly intelligent, if socially inept and shy. In fact, Draethos who choose not
      to follow the warrior’s path are exiled from their homeworld and forced to live on desolated planets
      or among aliens. Exiled Draethos feel compelled to leam as much as possible, becoming experts on
      several topics by early adulthood. These Draethos are so enthralled with learning that they rarely
      pause to apply what they learn. Unlike other species obsessed with knowledge, Draethos seldom appreciate
      a good debate, even if it’s in their field of expertise. Their love of knowledge accompanies a fear
      of missing an important detail while debating or a failure to put into words what they know explicitly
      to be true. Older Draethos usually overcome this fear. Personality: Exiled Draethos are highly intelligent
      but socially awkward. They have trouble grasping the complex customs of other species and thus tend
      to keep to themselves. They generally avoid conflict and strife. Draethos living on the homeworld
      are either haughty, spoiled aristocrats or fierce, aggressive warriors eager to demonstrate their
      combat prowess. Fortunately for the rest of the galaxy, they keep to themselves and spend most of
      their energies honing their skills and hunting other fierce predators on their own planet. Physical
      Description: Draethos are slender, tightly muscled humanoids that average 1.8 meters tall. Their
      coarse, scaly skin ranges in color from violet to mauve to gray. Their eyes are black, pupilless,
      and set into the sides of their sloped head. They have webbed hands, and their lipless mouths give
      the illusion of a large overbite. Homeworld: Thosa, a barren world of jagged, windswept mountains
      and deep caves, located in the Outer Rim. Very few non-Draethos know the planet’s name and precise
      location. Language: Draethos speak and read Draethos. Their spoken language sounds like a flurry
