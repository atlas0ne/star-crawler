  adventurers: Twileks can belong to any heroic class. Twi'lek adventurers typically leave Ryloth to explore
    the Outer Rim and seek fame and fortune. They prefer to work behind the scenes. Few Twi'leks can stand
    the regimented lifestyle of the soldier; many wind up in business (whether legal or illegal), performing
    as entertainers, or even serving as diplo- mats. The Force is strong in this species, and some Twi
  example_names: Abdi Badawzi, Arali Dil, Bib Fortuna, Cesi Eirriss, Con Varra, Dahz Thulaka, Deel Surool,
    Dia Passik, Esm Arkhee, Firith Olan, Gida Luroon, Hid Togema, Jelahan Sirar, Klyto Sygnus, Koyi Komad,
