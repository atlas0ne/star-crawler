  - name: Speed
    text: Neti base speed is 10 meters.
  - name: Metamorph
    text: A Neti has the innate ability to alter its shape and size at will. A Neti can vary its size
      anywhere from Medium-size to Huge. A Neti can also alter its form to be roughly humanoid, squat
      and quadrupedal, or solid and treelike. Changing size and shape is a full-round action. Even in
      quadrupedal or treelike form, a Neti has manipulative tendrils to operate tools and make attacks.
      A Neti in quadrupedal form is more diffi- cult to trip or move with a bantha rush (receiving a +4
      stability bonus on rolls to resist these effects), but it cannot run or charge. A Neti in its stationary
      tree form is extremely resistant to these attacks (+12 stability bonus on all rolls to oppose bantha
      rushes and trips), but it is immobile. The extra wound points a Neti gains for being Huge disappear
      if it assumes a smaller form. A Neti that takes 12 or more points of wound damage in Huge form cannot
      reduce its size until healed.
  - name: Photosynthesis
    text: As plants, Neti have no need for food. They have a greatly reduced need for water as long as
      they have regular access to broad- spectrum light. A Neti needs only one-tenth the water of most
      races, but if deprived of sunlight, it starves, much as other races do when lacking food. A Neti
      with the Control feat that enters a Force trance can survive almost indefinitely in an area with
      natural sunlight and rain.
  - name: Camouflage
    text: In its treelike form, a Neti gains a +8 circumstance bonus on Hide checks when concealed among
      trees and similar foliage.
