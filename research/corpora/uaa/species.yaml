    text: A T’surr’s tough hide provides a +1 natural armor bonus to Defense.
  - name: Superior Depth Perception
    text: A T’surr’s four eyes provide remarkable depth perception, granting a +1 bonus on ranged attack
      rolls.
  - name: Physical Intimidation (males)
    text: T’surr males may use their Strength modifier instead of their Charisma modifier for Intimidate
      checks,
  - name: Low-Light Vision
    text: T’surr can see twice as far as normal in dim light (such as moonlight), and they retain the
      ability to distinguish color and detail under these conditions.
  - name: Skill Bonus (males)
    text: T’surr males gain a +2 species bonus on Intimidate checks.
  - name: Bonus Feat
    text: T’surr have excellent vision and hear- ing. They gain the bonus feat Alertness.
  - name: Free Language Skills
    text: 'Read/Write and Speak T’surrese. T''surr Commoner (Male): Init —1; Defense 9 (-1 Dex, -1 size,
      +1 natural); Spd 10 m; VP/WP. 0/10; Atk +0 melee (1d4+1, unarmed strike) or —1 ranged; SQ Species
      traits; SV Fort +0, Ref -1, Will +0; SZ L; Face/Reach 2 m by 2 m/4 m; FP 0; DSP 0; Rep +0; Str 12,
      Dex 8, Con 10, Int 10, Wis 10, Cha 10. Challenge Code A. Equipment: Variety of personal belongings.
      Skills: Hide -5, Intimidate +3, Knowledge (any one) +1, Listen +2, Profession (any one) +2, Read/Write
      T’surrese, Speak Basic, Speak T’surrese, Spot +2. Feats: Alertness. T''surr Commoner (Female): Init
      -1; Defense 10 (-1 Dex, +1 natural); Spd 10 m; VP/WP 0/10; Atk +1 melee (1d3+1, unarmed strike)
      or +0 ranged; SQ Species traits; SV Fort +0, Ref -1, Will +0; SZ M; FP 0; DSP 0; Rep +0; Str 12,
      Dex 8, Con 10, Int 10, Wis 10, Cha 10. Challenge Code A. Equipment: Variety of personal belongings.
      Skills: Craft {any one) +1, Knowledge (any one) +1, Listen +2, Profession (any one) +2, Read/Write
      T’surrese, Speak T’surrese, Spot +2. Feats: Alertness. Tunroath The Tunroth were simple hunters
      before Duros scouts discovered them during an exploration of the Jiroch system nearly 9,000 years
      before the Battle of Yavin. Although access to galactic-level technology allowed the Tunroth to
      colonize other planets in their home system, they continued to favor primitive weapons over modern
      blasters, preferring to hunt wild beasts armed only with the sacred klirun, the traditional Tunroth
      hunting bow. Ten years before the Battle of Yavin, expansionist Lortan fanatics swept across a dozen
      systems and destroyed everything in their path. The Reslian Purge, as it became known, wiped out
      millions of Tunroth. The primitive hunters lacked the weaponry to repel the Lortian invaders. The
      intervention of the Imperial Navy ended the Reslian Purge, and although the Imperials interceded
      only to safeguard their own interests, the Tunroth still owed the Empire a debt of gratitude. The
      species reluctantly accepted Imperial tule, and many Tunroth became unlikely supporters of the Emperor''s
      New Order. After the fall of the Empire, the Tunroth hesitated to join the New Republic for fear
      of being seen as Imperial sympathizers. However, their fears proved unfounded, as the New Republic
      welcomed Tunroth membership. The Tunroth live in communes of 50 to 300 indi- viduals, each commune
      governed by a great hunter. The Assemblage of Three—a body made up of the three highest-level hunters—governs
      Tunroth society. They assemble whenever an issue that concerns all Tunroth arises, such as the need
      to colonize more worlds, alleviate overcrowding, or deal with an external threat. Tunroth leaders
      who forbade blasters in favor of traditional hunting weapons changed their view after the Reslian
      Purge, to the point where the Tunroth now stockpile blasters and other modern weapons for the express
      purpose of defending their communes. The species’ adoption of modern weaponry has not diminished
      the Tunroth hunting tradition. Twenty- seven different levels of Tunroth hunter are known to exist,
      and each has its own strict guidelines for ascension. The highest of the 27 ranks is stiilran, though
      no hunters of this class are known to exist during the time of the Old Republic, the Empire, or
      the New Republic. It has long been rumored that some Jedi artifact, such as a temple or hidden tomb,
      lies somewhere in the Jiroch system. However, the Tunroth fervently deny these tales. Personality:
      Tunroth are hardworking, tenacious, and opportunistic. They adapt quickly to changing circumstances.
      Hunters are the most respected indi- viduals in Tunroth society, and virtually all Tunroth aspire
      to become hunters of the highest level. Physical Description: Muscular and hairless, the average
      Tunroth has an elongated skull set forward over the neck, large vertical nostrils, large wide-set
      eyes, and a lower jaw studded with bony protru- sions. Tunroth stand about 1.7 meters tall. Their
      hands feature two opposable thumbs and a single finlike finger. Homeworld: Jiroch-Reslia, the third
      planet of the Jiroch system, located in the Mid Rim. After joining the Republic and developing hyperdrive
      technology, Tunroth colonized Jiroch-Kalok and Jiroch-Saloch, two other inhabitable planets in their
      home system, Language: Tunrothese is a primitive-sounding language of grunts and snarls, with simple
      vocaliza- tions. Written Tunrothese uses pictograms that represent physical objects. Example Names:
      Kiran Tatch, Tonas Vueral, Rathe Palror, Xarrce Huwla. Age in Years: Child 1-11; young adult 12-17;
      adult 18-40; middle age 41-60; old 61-79; venerable 80+. Adventurers: Tunroth adventurers are usually
      scouts or scoundrels. The galaxy’s wealthy elite will frequently hire Tunroth hunters to Jead safaris
      or capture elusive creatures for study. Many low-ranking Tunroth hunters and aspiring amateurs exploit
      their species’ reputation, pretending to be more skilled than they actually are. Tunroth make excellent
      bounty hunters, beastwardens, and big-game hunters (see Chapter Two: Prestige Classes for descriptions
      of the beastwarden and big-game hunter prestige classes). Tunroth strong in the Force either become
      Force adepts (tumming their traditional klirun bows into Force weapons) or join the Jedi Order.'
