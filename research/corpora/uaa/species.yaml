      Use +1, Craft (any one) +1, Knowledge (any one) +1, Profession (any one) +0, Read/Write Selonian,
      Speak Selonian, Swim +4. Feats: None, Shi‘ido Despite their secretive nature, Shiido cannot resist
      the urge to travel the galaxy and learn about other species. Little is known about them except that
      they can take the form of virtually any other humanoid species they wish. They go to great lengths,
      short of violence, to guard their species’ secrets. The Shiido explore the galaxy with no agenda
      other than to learn about other cultures. Shiido travel from world to world aboard space transports,
      drawing as little attention to themselves as possible. Occasionally Shi’ido will stumble upon a
      planet they like and will spend the rest of their long lives there, mastering the local customs
      and insinuating them- selves into the daily lives of the indigenous species. Personality: Shi''ido
      are curious, shy, and secretive. They prefer to avoid confrontations, especially on their homeworld,
      where they''ll pretend to be innocu- ous aliens, harmless creatures, boulders, or trees to avoid
      outlanders. They understand that some other species fear their shapeshifting abilities and are thus
      reticent to call attention to themselves. Physical Description: In their natural form, Shi''ido
      are humanoids with pale, hairless skin. They stand about 1.8 meters tall. They have thin, dense
      bones, double joints, and elasticized tendons, which helps them assume the appearance of virtually
      any other species. Homeworld: Lao-mon (Sh ‘shuun in Shi''idese), a tropical world in the Colonies
      region populated by large predators. No expedition to Lao-mon has yielded evidence that the Shi''ido—or
      any other ‘sentient species—ever lived there. It’s assumed that the species’ ability to change shape
      has protected them from discovery and predators. Language: Shijidese is an ancient language that
      incorporates a wide range of vocalizations. Xenobiologists are uncertain whether a written form
      of Shi''idese exists. Shi’ido can learn to speak and read other languages, and those who venture
      from their homeworld are quick to master Basic, — Example Names: Shi''ido change their names as
      often as they change forms, although a Shi''ido who settles on a world might keep the same name
