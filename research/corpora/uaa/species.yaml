      Code A. Equipment: None. Skills: Hide +3, Listen +0, Speak Codruese (under- stand only), Survival
      +1. Feats: None. Colicoid Colicoids are an insectoid species native to Colla IV. In battle, Colicoids
      curl up into a protective ball, then unfurl suddenly, catching their prey off guard. Their alien,
      insectoid minds give them a natural defense against Jedi mind tricks. Colicoids are highly intelligent,
      emotionless, and cannibalistic (particularly when food is scarce). Long ago, they transferred their
      ruthlessness to commerce, making them brutally efficient at business. Despite the Colicoids’ successful
      commercial ventures and their strict business protocols, enough visitors to the Colla system have
      been murdered and consumed by the Colicoids that Colla IV has spent years in diplomatic disputes.
      Many diplomats consider an assignment to Colla IV a death sentence. Colicoids are responsible for
      designing the Trade Federation’s murderous droidekas—destroyer droids fashioned to resemble their
      creators, Personality: Colicoids possess a ruthless cunning that serves them well on the battlefield
      and at the negotiating table. They are vicious, calculating creatures driven by greed, and they
      show little regard for others. Physical Description: Colicoids are tall, insectoid beings with multiple
      appendages, chitinous bodies, and powerful stinging tails. Their flat heads have multi-faceted eyes
      that give them superior vision, and their long antennae provide an acute sense of smell. An adult
      Colicoid averages 1.8 meters tall. Homeworld: Colla IV, located on the border of the Inner Rim and
      the Expansion Region. Language: The Colicoid language involves clicks and humming noises from their
      antennae and jointed legs, which is difficult to interpret and impossible for other species to reproduce.
      They speak Basic with a noticeable buzz. Colicoids often converse in their own language while in
      the presence of other species—few would be pleased to hear what schemes and plots the Colicoids
      discuss right in front of them. Colicoids do not have a written language of their own and must use
      Basic. Example Names: Bzhat, G’zharp, Kyrrik, J’kilkrizt, T’karzhk, Ytil. Age in Years: Child 1-4;
      young adult 5-7; adult 8-33; middle age 34-49; old 50-64; venerable 65+. Adventurers: Colicoids
      are rarely anything other than soldiers, although an enterprising Colicoid might find success as
      a scoundrel, scout, or bounty hunter. No Colicoid Force-users are known to exist.'
