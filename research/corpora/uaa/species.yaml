  physical_description: Miraluka average 1.8 meters tall. In almost every respect, they look like Humans
    except they have nearly featureless eye sock- ets. They tend to cover their eyeless visages with decorative
    cloth.
  personality: Miraluka have no interest in personal gain or glory. They are thoughtful, pensive, and
