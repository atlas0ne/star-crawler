  - name: Keen Smell
    text: A Noghri can identify an individual by smell at a range of 10 meters with a successful Wisdom
      check (DC 10). The range increases to 20 meters if the individual is upwind and drops to 6 meters
      if the individual is downwind. If the Noghri has never encountered the individual before, a successful
      Wisdom check reveals only the individual’s species or some scent unique to that individual (which
      will allow the Noghri to recognize the individual in the future).
  - name: Primitive
    text: Noghri with heroic or professional classes receive the bonus feat Weapon Group Proficiency (primitive
      weapons) instead of the usual Weapon Group Proficiency bonus feats.
  - name: Free Language Skills
    text: Read/Write and Speak Honoghran (Noghrese).
  adventurers: Noghri adventurers are typically fringers, scouts, or soldiers. Noghri Force-users are
    rare. Many who leave their homeworld become body- guards in the employ of Darth Vader, Grand Admiral
    Thrawn, or Leia Organa-Solo (depending on the era).
  example_names: Cakhmaim clan Eikh’mir, Ekhrikhor clan Bakh’tor, Khabarakh clan Kim’bar, Ovkhevam clan
    Bakh'tor, Ruhk clan Baikh’'vair, Sakhisakh clan Tlakh’sar.
  language: Noghri speak and read Honoghran (sometimes called Noghrese by galactic linguists). They speak
    Basic with ease, albeit with soft, whis- pered, chilling voices.
  homeworld: The devastated world of Honoghr, located in the Outer Rim.
  physical_description: Noghri are small, compact humanoids. A typical Noghri has gray skin, beady black
    eyes set deep within bony sockets, claws, and fangs. Adult Noghri average 1.3 meters tall.
  personality: Noghri are fierce, dedicated warriors who place the honor of their clans and the safety
    of their charges above all. For a relatively primitive species, they are shrewd, quick to adapt, and
    mindful of customs and rituals. They do not grasp the concept of humor well and are not particularly
    sociable.
- name: Nosaurian
  pdf_page: 116
  canon: legends
  traits:
  - name: Ability Modifiers
    text: '+2 Dexterity, -2 Charisma. &S Medium-size: As Medium-size creatures, Nosaurians have no special
      modifiers due to their size.'
  - name: Speed
    text: Nosaurian base speed is 10 meters.
  - name: Natural Weapon
    text: A Nosaurian can gore with its hors instead of making an unarmed strike. The gore attack deals
      1d6 points of piercing damage (plus Strength modifier) and does not provoke — attacks of opportunity.
      A Nosaurian who charges. and hits his opponent with a gore attack deals double damage.
  - name: Skill Bonuses
    text: Nosaurians gain a +2 species bonus on Climb and Survival checks,
  - name: Free Language Skills
    text: Read/Write and Speak Nosaurian.
  adventurers: Nosaurian adventurers can be of any class, though fringers and soldiers have become more
    common in The New Jedi Order era.
  example_names: Fefar Blackeye, Clegg Holdfast, Churra Leafhom, Moco Minkfruit.
  language: Nosaurians speak their own language, which consists of barks, warbles, and hissing sibilants.
    Their written language combines two ancient alpha- bets and includes plenty of metaphors associated
    with nature, weather, and the seasonal cycle.
  homeworld: New Plympto, a temperate planet in the Core Worlds region.
  physical_description: Nosaurians stand between 1.2 and 1.5 meters tall. They have four nimble fingers
    on each hand and possess three-toed, birdlike feet. They have thick skin ranging from light green
    to black. Their most striking feature is the ridge of homs sprouting from their foreheads like a savage
    head- dress. The horns are sharp enough to gore opponents,
  personality: 'Nosaurians are gregarious and even- tempered by nature. However, the perceived injustices
    inflicted upon the species by Humans in power have left most Nosaurians embittered and angry. The
    Yuuzhan Vong’s merciless assault of New Plympto ha: only increased the Nosaurians’ descent into a
    kind of disgusted fatalism.'
- name: Nuknog
  pdf_page: 117
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Dexterity, -2 Intelligence, —2 Wisdom.
  - name: Small
    text: As Small creatures, Nuknog gain a +1 size bonus to their Defense, a +1 size bonus on attack
      rolls, and a +4 size bonus on Hide checks. They must use smaller weapons than Medium- size beings
      use, and their lifting and carrying limits are three-quarters those of Medium-size characters.
  - name: Speed
    text: Nuknog base speed is 6 meters.
  - name: Rush
    text: Nuknog can temporarily improve their agility, reflexes, and speed. A rushing Nuknog gains a
      temporary +4 Dexterity (which improves his Defense, ranged attacks, Reflex saves, and Dexterity-based
      skills) and moves at twice the normal speed (12 meters). While using this ability, the Nuknog cannot
      use skills that require patience and concentration, such as Move Silently, Combat Expertise, or
      any Force-based skill. A rush lasts for a number of rounds equal to 5 + the Nuknog’s Constitution
      modifier. At the end of this duration, the Nuknog loses the bene- fits of the rush and is fatigued
      (—2 Strength and Dexterity; can’t run or charge) for a number of rounds equal to the rush’s duration.
      A Nuknog can use the rush ability a number of times per day equal to 3 + the Nuknog’s Constitution
      modifier.
  - name: Skill Bonuses
    text: Nuknog have acute senses. They gain a +2 species bonus on Listen, Search, and Spot checks.
  - name: Free Language Skills
    text: Read/Write and Speak Nuknog.
  adventurers: Most Nuknog jump at the chance to leave Sump and never return. They are easily manipu-
    lated with promises of safe passage offworld, but they have few skills to offer. Some Nuknog will
    volunteer to become slaves just to get away from their home- world, although not all Nuknog are willing
    to take such extreme measures, given how most slaves are treated. Nuknog heroes are usually fringers.
  example_names: Vek Bolko, Buhar Lod, Po Nulnik, Skoo Runkin, Ark Roose, Noop Warko,
  language: Nuknog speak a language of the same name. It consists of squeaks, barks, and gruff vocal-
    izations. Written Nuknog uses a simple alphabet.
  homeworld: Sump is a humid, dilapidated Outer Rim world few care to visit. Pollution from offworld mining
    interests has contaminated the ecosystem, creating vast, toxic marshes incapable of sustaining
  physical_description: A Nuknog is a bipedal, teptilian humanoid with a long, skinny neck, bulbous snout,
    stocky legs, and a bumpy ridge along the centerline of the skull. The average Nuknog stands approximately
    1.2 meters tall,
  personality: Nuknog are short-tempered, petty, easily manipulated beings who rarely see the big picture.
    They resent most other beings in the galaxy and blame the most convenient scapegoats for their problems.
    The bravest Nuknog actually have the will and drive to rise above their meager lives, and they are
    rare indeed.
