    or mercenaries. Others set out to find new places to hunt and explore. A few use their warrior traditions
    to become soldiers, some even developing into bounty hunters. They may appear gruff and unpleasant
    at first, but if given the chance, they become valuable members of any mission team.
  example_names: Bossk, Corrsk, Cradossk, Dussk, Fusset, Grulluss, Juuus, Kallukoras, Krussk, Nakaron,
    Portha, Reosss, Ssurrg, Traggissk, Tusserk, Yarroq, Yavassk.
  language: Dosh, the Trandoshan language, consists mostly of harsh grunts and growls. The writ- ten language
    incorporates simple alphabetic glyphs. Most Trandoshans who travel the galaxy also learn to speak
    Basic.
  homeworld: Trandosha (also called Hsskor or Dosha), an arid planet located in the Mid Rim. The planet
    orbits the same sun as Kashyyyk, the Wookiee homeworld.
  physical_description: Trandoshans range from 1.5 to 2.1 meters tall. Their scaly hides offer addi- tional
    defense against attacks and range in color from sandy brown to glossy green.
  personality: Trandoshans are aggressive, selfish, and vindictive beings. Violent, brutal, and driven,
    they love to compete, but can show compassion and mercy when the situation warrants. They like to
    collect trophies from various successful hunts, and they generally value credits more than friendship,
    although a Trandoshan will pledge his life to protect another being who has saved him from certain
    death.
