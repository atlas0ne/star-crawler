      Wumdi. Age in Years: Child 1-10; young adult 11-15; adult 16-35; middle age 36-54; old 55-64; venerable
      65+. Adventurers: Nikto adventurers can be of any class, with certain subspecies gravitating toward
      certain classes. The fringer class is the most common among the Nikto. Green, Southern, and Pale
      Nikto are often scouts, while Red and Mountain Nikto are commonly soldiers. Esral''sa’Nikto (Mountain
      Nikta) The blue-gray mountain Nikto have nose flaps through which they filter grit, dust, or dangerous
      fumes. Fins protrude from their cheeks and serve as their primary hearing organs. These fins also
      aid in temperature control, cooling the Nikto in checks against drowning (see Suffocation and Drowning
      in Chapter Twelve of the Star Wars Roleplaying Game). Pale Nikto also gain a +4 species bonus on
      Swim checks,'
