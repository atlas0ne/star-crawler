  homeworld: Noe’ha’on, a jungle world located in the Expansion Region.
  physical_description: Nochons resemble bipedal insects with enormous multifaceted eyes, large mandibles,
    four arms, and a soft carapace covered in “short bristles. The average Noehon stands about 1.1 meters
    tall. Glands on either side of their mouths produce a musky secretion used to mark territory, possessions,
    and even subordinates. Every Noehon exudes a distinctive musk.
  personality: Male and female Noehons raised in a weld are usually abusive and combative. They sheep-
    Bhly placate their superiors and are unnecessarily truel to their inferiors and underlings. Noehon
    raised outside a weld are more even-tempered and better equipped to function socially within the greater
    galactic community,
