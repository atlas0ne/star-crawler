      (any one) +2 or Knowledge (any one) +2, Pilot +1, Profession (any one) +1, Read/Write Rybese, Speak
      Basic, Speak Rybese, Swim +5. Feats: Spacer. Ryn The Ryn are a species of interstellar vagabonds
      who wander the galaxy as spacehands, merchants, construction workers, pilots, and scouts. Known
      for their exhilarating music and transience, Ryn possess a certain gypsylike quality. The Ryn have
      been spacefarers for so long that they have forgotten where they originated. Not even the great
      libraries of Obroa-skai or Woostri can confirm their distant origin. Theories about why the Ryn
      spread across the galaxy are abundant, and the Ryn themselves have two contradictory legends regarding
      their past. One says that the Ryn were once fierce warriors who were set against a long-forgotten
      Inner Rim threat. Another professes that the Ryn people volunteered ten thousand of their musicians
      and entertainers to a nearby world whose culture lacked poets and artists. The single largest concentration
      of Ryn during The New Jedi Order era lies in a remote corner of the Corporate Sector. Universally
      reviled and distrusted, Ryn have a repu- tation as thieves and confidence tricksters, and their
      personal philosophy about doing whatever it takes to survive only strengthens that reputation. The
      Yuuzhan Vong invasion of the galaxy during The New Jedi Order era creates millions of refugees in
      the Tingel Arm of the galaxy. During this difficult time, the Ryn are ostracized and invariably
      relegated to the worst parts of the refugee camps. Because of their supersti- tions regarding personal
      hygiene, or more accurately lack thereof, the characteristic odor of the Ryn means that the “worst
      part” of a refugee camp is somewhere near the communal latrines. Personality: Ryn are flamboyant,
      gregarious, self- sufficient, and driven. They work hard, often seeking employment as entertainers,
      tradesfolk, mechanics, and spacehands. They love secrets and have come to expect little from other
      species; hence, they are instinctively wary of any non-Ryn who offers them aid. Physical Description:
      Ryn have sharp features, slender tails, and skin tones ranging from light purple to deep blue-black.
      Their bodies are covered with smoky-hued fuzz ranging in color from light brown to snow white. Ryn
      tend to have brown or blue eyes, although a few have green or amber eyes. Their chiti- nous beaks
      are perforated and extend down past their thin-lipped mouths. Male Ryn cultivate large, snow- white
      mustaches to match their unkempt, shock-white hair. Ryn adults stand 1.4 to 1.8 meters tall. Homeworld:
      Unknown, although research leads some to speculate that the Ryn homeworld lies some- where in the
      Core Worlds region. Language: Ryn have their own language. Spoken Ryn uses tones and inflections
      combined in a way that can be best described as melodious. Young Ryn also learn Basic so that they
      can more easily integrate into galactic society. Example Names: Clarani, Doumar, Droma, Gaph, Kelzpol,
      Melisma, Mezza, Neldor, Ormarda, Reznim, Romany, R’vanna, Sapha, Shimor. Age in Years: Child 1-11;
      young adult 12-15; adult 16-48; middle age 49-65; old 66-79; venerable 80+. Adventurers: Ryn heroes
      generally begin as fringers or scouts, sometimes taking levels in the noble or tech specialist class,
      Ryn Force adepts are known to exist, but Ryn have yet to embrace any Jedi tradition.'
  adventurers: Rybet adventurers are typically fringers, scouts, and scoundrels. Most other species find
    the notion of a Rybet Jedi laughable, and no Rybet has yet found the Jedi way of life alluring.
  example_names: Rilba Bronk, Moruth Doole, Brilf Greepto, Gribbet, Brayg Krenimec.
  language: Rybets speak and write their own language (Rybese), which is punctuated with grunts and croaks.
    Many learn to speak Basic as well.
  homeworld: Rybets claim their species originated on the planet Varl, located in the Outer Rim. The Hutts
    contest this claim, as do many legitimate xenobiologists.
  physical_description: The Rybet are short, squat humanoids with rough-textured green skin and four long
    fingers and toes that end in vestigial suction cups. Skin colors range from bright green to deep olive,
    with faint ochre stripes along their cheeks. Their eyes are bulbous and lanternlike, with upper and
    lower eyelids that close across the center of the eye. Adult males stand between 1.2 and 1.5 meters
    tall, while fe
  personality: Rybet are sly, astute, impertinent opportunists. They are well adapted for life in space,
    prefer a nomadic lifestyle, and would rather live in a starship’s gloomy cargo hold than the most
    opulent palace on any world. They don't like to stay in one place for long, and their grasp of morals
    and ethics is questionable at best.
