      Con 12, Int 12, Wis 12, Cha 10. Challenge Code B. Equipment: See above. Skills: As above except:
      Hide -10. Feats: See above. Nikto The Nikto evolved on Kintan, a harsh planet located deep within
      Hutt Space. Mutations triggered by the planet''s radioactive atmosphere have bred five different
      (but genetically compatible) Nikto subspecies, each one adapted to a specific environ- mental niche.
      Nikto have a limited range of facial expressions simply because they lack the musculature. Their
      “stat~ ing” eyes and seemingly blank expression often lead others to underestimate Nikto intelligence.
      Life on Kintan and the casual brutality of their Hutt overlords have made the Nikto cunning combatants.
      The Nikto have never developed hyperdrive technol- ogy but are found throughout the galaxy as slaves
      of the Hutts. For the most part, Nikto are content with @ life of servitude, preferring slavery
      to a life of toil and hardship on their homeworld. When two Nikto of different subspecies interbreed
      (a frequent occurrence since the Hutts enslaved the species), the children adopt the species traits
      of either parent. Personality: Nikto lack charisma and would rather follow orders than give them.
      What they lack in free will they make up for in single-mindedness and tenacity. They also adapt
      quickly to their environment. Physical Description: All Nikto are reptilian humanoids with leathery
      skin, sometimes covered in spikes or horns. All five subspecies have deep black eyes, sometimes
      covered with protective membranes. Nikto adults stand 1.8 meters tall, on average. Homeworld: Kintan,
      a radioactive planet located ir the Outer Rim. Language: Nikto speak and read Nikto. Most Nikto
      who leave their homeworld also learn to speak Basic. Example Names: Calliose, D''we’mouk, Ga’p’tashi,
