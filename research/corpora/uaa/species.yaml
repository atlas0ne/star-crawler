    text: As Medium-size creatures, Vodrans have no special modifiers due to their size.
  - name: Speed
    text: Vodran base speed is 10 meters.
  - name: Natural Armor
    text: A Vodran’s leathery hide provides a +1 natural armor bonus to Defense.
  - name: Hutt Loyalty
    text: Any check made to bribe, blackmail, or seduce a Vodran in the service of a Hutt suffers a -8
      penalty. A Vodran indentured to the Hutts will follow a Hutt’s orders regardless of the danger,
      even if obedience means certain death for the Vodran. Vodran heroes who do not pledge absolute loyalty
      to the Hutts do not gain this ability.
  - name: Skill Bonus
    text: Vodrans gain a +2 species bonus on Survival checks.
  - name: Free Language Skills
    text: Read/Write and Speak Huttese.
  adventurers: Vodrans are normally encountered outside of Hutt service only when they are sold to others.
    Occasionally, a Vodran overcomes his or her social conditioning and inbred inclination to obey authority.
    Other members of the species treat these freethinking individuals as renegades and lunatics. Vodran
    heroes are typically scoundrels, scouts, or soldiers, although Force-users are also possible.
  example_names: Meido Lycri, Klietu Mutela, Xenon Nnaksta, Lakren Plooru, Saran Vydek.
  language: The Hutts eradicated the Vodrans’ ancient language millennia ago. Huttese is now the Vodrans’
    native language.
  homeworld: Vodran, one of many inhabited worlds in the Si’klaata Cluster (located in the Outer Rim),
    is a jungle world infested with predators and scavengers, including the loathsome dianoga. Many Hutts
    make their homes on Vodran, breaking the backs of their Vodran servants to maintain their opulent
    lifestyle.
  physical_description: Humanoid, with leathery brown skin, black featureless eyes, a flat nose, and a
    face ringed by horny protrusions, the average Vodran stands about 1.75 meters tall. A Vodran’s underdevel-
    oped facial muscles permit only a slight range of facial expressions.
  personality: Vodrans are simple-minded beings who lack individuality, believing in the well-being of
    the Hutts regardless of how many Vodrans must die to protect that well-being. Unlike their Hutt masters,
    Vodrans partake of few, if any, diversions. They have trouble mastering complex social behaviors such
    as etiquette or innuendo.
- name: Vor
  pdf_page: 180
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Constitution, +2 Intelligence.
  - name: Medium-size
    text: 'As Medium-size creatures, Vors. have no special modifiers due to their size. Speed: Vor base
      speed is 10 meters on land. Their flying speed is 16 meters (average maneuverability).'
  - name: Skill Bonuses
    text: Vors are able negotiators who hide their emotions well. They gain a +2 species bonus on Bluff
      and Diplomacy checks.
  - name: Free Language Skills
    text: Read/Write and Speak Vorese.
  adventurers: 'Vors seldom venture far from Vortex. When they do roam the galaxy, Vors tend to be nobles,
    scouts, tech specialists, and aerobats (see Chapter Two: Prestige Classes).'
  example_names: Deskalur, Inchiiri, Kaliopi, Krini- shen, Sha-viri, Wiliran, Yiruthir.
  language: Vorese is a melodious language of soft chirps, lilting squawks, and trilling whistles. Swirling
    lines and tapered diamond shapes form the individual letters of the Vorese alphabet.
  homeworld: Vortex, a blue-gray Mid Rim planet with a severe axial tilt that causes sudden seasonal changes
    and fierce windstorms, Grassy, multicolored plains stretch for thousands of kilometers across the
    planet's surface.
  physical_description: Vors are reptilian avians with flat, pointed heads, slender limbs, and translu-
    cent, membranous flaps of skin extending from their
  personality: Vors are tranquil, imaginative, and spir- itual beings who loathe discord, Vors usually
    consider what is best for their society, clan, or colleagues instead of their own needs or the needs
    of any one individual. Vor suppress their emotions, remaining composed even in times of great joy
    or tragedy and saving their emotional outbursts for private moments.
- name: Vratix
