      : Twa hundred years before the Battle of Yavin, Dressellians were simple hunters foraging for food
      in the wild. Two centuries later, they''d evolved into a burgeoning industrial-level society with
      a loose coalition government. The Empire gave a choice: slavery or death. To the Empire''s surprise,
      many Dressellians chose death, albeit in combat. The Bothans supplied the Dressellian resistance
      with weapons, and sheer defiance and tenacity allowed the “primitive alien scum” to drive back the
      Imperial invaders of their world. scouts. Dressellian Force-users are very rare. Dressellians joined
      with the Rebel Alliance shortly before the Battle of Endor, and since then members of the species
      have been spotted in every comer of the civilized galaxy. Dressel joined the New Republic shortly
      after the Empire''s defeat, although it usually. takes some coaxing by the Bothans to get them to
      care about matters affecting the galaxy at large. The Yuuzhan Vong invasion has stoked the Dressellian
      passion for freedom. Dressellians every- where, from lone tramp freighter pilots to the stalwa defenders
      of Dressel, oppose these galactic oppressors at every turn by helping to evacuate or defend Republic
      colonies. Personality: Dressellians are fiercely independent loners by nature. Their early encounters
      with other species (such as the Humans of the Galactic Empire} have made a lasting impression, and
      they are gener- ally wary of “outlanders.” Most Dressellians have a high regard for Bothans, however,
      given the two species’ shared history of peace. Although self-servin and quick to anger, Dressellians
      are loyal to others who have aided them and asked for nothing in retum. Physical Description: Dressellians
      have elongated, hairless heads, wrinkled flesh, and wiry bodies. The average Dressellian stands
      about 1.8 meters tall. Their wrinkled skin has earned them the callous nickname “prune face,” to
      which all Dressellians take offense. Homeworld: Dressel is a temperate Mid Rim world rich in natural
      resources. Bothan explorers discovered it shortly before the dissolution of the Old Republic and
      chose not to interfere with the Dressellians, who. were, at the time, a hunting-and-gathering society,
      The Bothans colonized a nearby asteroid belt instead. By the time the Empire occupied Dressel, the
      Dressellians had developed industrial-level technol- ogy—steam-powered machines, slugthrowers, and
      so on. Language: Dressellians speak Dressellese, a simple language that’s evolved over millennia.
      As Dressellian and Bothan relations improved, many Bothese terms found their way into the Dressellese
