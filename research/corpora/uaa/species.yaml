    nostrils, and soft, felty ears. Their bodies are
  personality: The Thakwaash mind contains many different personalities, and most Thakwaash tend to switch
    back and forth between them often. The aver- age Thakwaash has relatively good control over most of
    its personalities, Other species find the Thakwaash hard to deal with at first, until they start treating
    the Thakwaash’s minds almost as distinct individuals. Like most multiple personality disorders, one
    pe
- name: Thisspiasian
  pdf_page: 160
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, -2 Wisdom, ~2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Thisspiasians have no special modifiers due to their size.
  - name: Speed
    text: Thisspiasian base speed is 8 meters.
  - name: Prehensile Tail
    text: A Thisspiasian never provokes attacks of opportunity when making trip attacks with his tail.
      Further, a Thisspiasian can use his tail to lift up to a medium load, leaving his hands free to
      do other things. This negates the check penalty associated with medium loads, but the Thisspiasian’s
      speed is reduced to 2 meters. A Thisspiasian’s tail can also support up to twice the weight of a
      heavy load when firmly wrapped around an object that can support at least that much weight.
  - name: Constrict
    text: On a successful grapple check, a Thisspiasian can constrict with its tail for 1d6 points of
      damage (1d8 if he also has the Martial Arts feat) plus his Strength bonus instead of his normal
      unarmed damage.
  - name: Bonus Feat
    text: Thisspiasians gain the bonus feat Weapon Group Proficiency (simple weapons).
  - name: Free Language Skills
    text: Read/Write and Speak Thisspiasian.
  adventurers: Thisspiasian heroes can belong to any class, although nobles and soldiers are the most
    common,
  example_names: Dal Jassano, Oppo Rancisis, Kenko Sarapas, Tersis Shanhadi.
  language: Thisspiasians speak their own language, which consists of complex interlocking phrases and
    heavy use of sibilants.
  homeworld: Thisspias, a temperate and rocky world located in the Expansion Region.
  physical_description: A Thisspiasian’s humanoid upper body is covered in long flowing hair. The scales
    that adorn a Thisspiasian’s serpentine lower body come in varied hues, often matching the hair of
    the upper body. Thisspiasians typically coil their tails beneath their torsos when resting or meditating.
  personality: Thisspiasians strive to submerge their raging passions and emotions beneath a sea of calm
