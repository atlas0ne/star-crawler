  adventurers: All Neti are Force-sensitive. Those who live in seclusion tend to be Force adepts, while
    those who join the galaxy at large can be Jedi consulars and Jedi guardians. Neti scouts are also
    possible.
  example_names: Frond Dra-loor, Ood Bnar, Shal Koom, Tuwan Urlu,
