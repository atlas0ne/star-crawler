    an attitude that has remained with them throughout millennia of interacting with the rest of the galaxy.
    Their representatives in the Galactic Senate were among the most vocal prior to the rise of the Empire,
    but after Emperor Palpatine’s defeat, their beliefs kept them from joining the New Republic.
- name: Ayrou
  pdf_page: 18
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Constitution, +2 Wisdom.
  - name: Medium-size
    text: As Medium-size creatures, Ayrou have no special modifiers due to their size.
  - name: Speed
    text: Ayrou base speed is 10 meters.
  - name: Bonus Feat
    text: Ayrou are crafty negotiators and expert gatherers of information. They receive the bonus feat
      Trustworthy.
  - name: Free Language Skills
    text: Read/Write and Speak Ayrou.
  adventurers: Ayrou adventurers are frequently nobles, scouts, or scoundrels. Force-using Ayrou are rare
    but not unheard of.
  example_names: Chee‘ad, Tircee, Noreckee, Kuusa, Tessyn.
  language: Ayrou speak and read Ayrou. The trilling, shrieking Ayrou language is often compared to the
    sound of a songbird being strangled.
  homeworld: Maya Kovel, a windswept Outer Rim world with a thin, acrid atmosphere.
  physical_description: A typical Ayrou is tall and thin, standing 2 meters tall but weighing only 65
    kilograms. The Ayrou are an attractive species, with milky white skin and long, lean limbs.
  personality: Ayrou are strong-willed individualists, wily negotiators, and tireless collectors for informa-
    tion about anything and everything. Despite their relentless drive, the Ayrou are a peaceful species.
    They regard haggling and dealing as an art form and think combat is the refuge of juveniles, the feeble-minded,
    and others who can't succeed using their wits.
- name: Balosar
  pdf_page: 19
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Dexterity, -2 Constitution, -2 Wisdom, +2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Balosars have no special modifiers due to their size.
  - name: Speed
    text: Balosar base speed is 10 meters,
  - name: Antennapalps
    text: A Balosar’s antennapalps are sensi- tive to sound and provide a +4 species bonus on Listen checks
      while they are extended.
  - name: Poison Resistance
    text: Growing up on a polluted homeworld has given Balosars resistance to toxic substances. Balosars
      gain a +4 species bonus on Fortitude saves to resist the effects of poisons.
  - name: Moral Ambiguity
    text: Bluff and Diplomacy checks receive a +4 circumstance bonus when targeting a Balosar if the Balosar
      is promised profit or power.
  - name: Free Language Skills
    text: Read/Write and Speak Balosar and Basic.
  adventurers: Although crime runs rampant on Balosar, the species’ tendency toward criminal activi- ties
    has more to do with the deplorable conditions of the planet than any biological imperative. Many Balosars
    leave their homeworld in search of a better life, only to find life on other planets equally harsh.
    A Balosar hero can belong to any heroic class.
  example_names: Vaya Bar jaraka, Nina Dar'Eboros, Elan Sleazebaggano, Zirk Mer'darro.
  language: Balosars speak their own language, which consists of deep vocalizations and throaty rasps.
    Written Balosar is crude looking, but is no less complex than written Basic.
  homeworld: Balosar is an inhospitable Core World that has seen better days, The planet's high crime
    rate and corrupt government discourages tourists, and the air is barely breathable because of industrial
    pollution.
  physical_description: A Balosar has coarse hair, a frail-looking frame, and retractable antennapalps
    atop her head. The average Balosar stands about 1.6 meters tall, and most have sickly complexions
    from a lack of sunlight and clean air.
  personality: 'Balosars are often weak-willed and self-absorbed. Many suffer from severe depression and
    feel like they''re trapped: others grudgingly accept their lot in life with a sarcastic grin. A Balosar’s
    moral and ethical outlook is often skewed by hard life expe- riences, and many have trouble distinguishing
    between right and wrong.'
- name: Barabel
  pdf_page: 20
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, -2 Dexterity, -2 Wisdom.
  - name: Medium-size
    text: As Medium-size creatures, Barabel have no special modifiers due to their size.
  - name: Speed
    text: Barabel base speed is 10 meters.
  - name: Natural Armor
    text: The Barabel’s scaly hide provides a +2 natural armor bonus to Defense.
  - name: Natural Weapons
    text: 'A Barabel can choose to attack with a claw, a bite, or a tail slap instead of making a normal
      unarmed strike. Each of its natural weapons deals 1d6 points of damage plus the Barabel''s Strength
      modifier, although the type of damage varies as follows: claw (slashing), bite (piercing), tail
      (bludgeoning). These attacks do not provoke attacks of opportunity.'
  - name: Radiation Resistance
    text: Barabel receive a +2 species. bonus on Fortitude saves against radiation.
  - name: Darkvision
    text: Barabels can see in the dark up to 20 meters, Darkvision is black and white only but otherwise
      functions as normal sight. _
  - name: Low-Light Vision
    text: Barabels can see twice as far as normal in dim light (such as moonlight or under- water). They
      retain the ability to distinguish color and detail under these conditions.
  - name: Primitive
    text: Barabel with professional or heroic classes receive the bonus feats Weapon Group Proficiency
      (primitive weapons) and Weapon Group Proficiency (simple weapons) instead of the usual Weapon Group
      Proficiency feats.
  - name: Skill Bonus
    text: Barabel receive a +4 species bonus on Intimidate checks.
  - name: Free Language Skills
    text: Read/Write and Speak Barabel.
  adventurers: Barabel adventurers are mostly fringers, but scouts or soldiers are also common.
  example_names: Baraduk, Ragath, Saba, Skahtul, Shallamar, Skahtul, Tibor, Tull Raine, Vangar.
  language: Barabel speak and read Barabel. Their native language consists of harsh-sounding hisses and
  homeworld: The dark, humid world of Barab | in the Outer Rim.
  physical_description: Barabel are large reptilian humanoids with black keratin scales covering their
    bodies. Their bulging, slitted eyes are set above huge mouths filled with needlelike teeth that often
    reach five centimeters long. Adults stand between 1.9 and 2.2 meters tall.
  personality: As a species, Barabel are mean-spir- ited and short-tempered. They confront most other
    beings with a habitually aggressive stance. They treat siblings, parents, and mates with more compassion,
    though they are only genuinely affectionate toward their offspring.
- name: Baragwin
  pdf_page: 21
  canon: legends
  traits:
  - name: Ability Modifiers
    text: —4 Dexterity, +2 Constitution, +2 Intelligence.
  - name: Medium-size
    text: As Medium-size creatures, Baragwin have no special modifiers due to their size.
  - name: Speed
    text: Baragwin are lumbering beings. Their base speed is 6 meters.
  - name: Natural Armor
    text: Baragwin have thick skin that provides a +2 natural armor bonus to Defense.
  - name: Mood Sense
    text: A Baragwin can sense another sentient being’s mood. and general demeanor with a successful Sense
      Motive check (DC 15). This ability has a range of 10 meters,
  - name: Bonus Feat
    text: 'Baragwin receive the bonus feat Skill Emphasis. They may apply the feat to any one of the following
      skills: Computer Use, Craft (any one), Disable Device, Repair.'
  - name: Free Language Skills
    text: Read/Write and Speak Basic.
  adventurers: Baragwin adventurers tend to be scoundrels, soldiers, or tech specialists. They usually
    find a line of work connected to war or arms manufacturing.
  example_names: Hermi Odle, Dagel Igara, Idalli Kodrue, Digo Fadani.
  language: Basic is the native language of the Baragwin. Just as the Baragwin claim no world of origin,
    they do not possess a native language.
  homeworld: Unknown. Baragwin assimilate easily into societies that are tolerant of aliens.
  physical_description: The Baragwin are hunch- backed, humanoid saurians with massive heads nearly as
    wide as their shoulders and three digits on each massive hand. Their skin is tough, wrinkled, and
    ranges in color from drab green to dark olive. Their nostrils are broad and frequently seen to twitch.
  personality: Baragwin personalities are as varied as Humans. If anything, Baragwin are underestimated
    due to their shuffling gait and ponderous way of carrying themselves. They are, in fact, highly intelli-
    gent but rarely take steps to correct the misperceptions ignorant beings may have about them—it often
    lets them identify potential foes.
- name: Bartokk
  pdf_page: 21
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, +2 Constitution, -6 Intelligence, —4 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Bartokk have no special modifiers due to their size.
  - name: Speed
    text: Bartokk base speed is 10 meters.
  - name: Natural Armor
    text: Bartokk receive a +1 natural armor bonus to Defense.
  - name: Damage Reduction
    text: A Bartokk’s carapace provides DR 2. This ability stacks with DR values provided by manufactured
      armor.
  - name: Extra Limbs
    text: Bartokk have four arms ending in strong claws. The extra limbs give them a +4 species bonus
      on Climb checks and grapple checks. A Bartokk has one primary hand and three off hands. A Bartokk
      can wield up to four weapons, but the normal penalties for fighting with multi- ple weapons apply
      (see the Multiweapon Fighting feat description in the New Feats appendix).
  - name: Natural Weapons
    text: Bartokk have razor-edged claws that allow them to make unarmed attacks without provoking attacks
      of opportunity. As an attack action, a Bartokk can make one claw attack (with no penalty) or combine
      its primary claw attack with up to three off-hand claw attacks (suffering the normal penalties for
      multiweapon fighting). Each claw deals 1d6 points of slashing damage plus the Bartokk’s Strength
      modifier.
  - name: Hive Mind
    text: A Bartokk is linked telepathically to every other Bartokk within 500 meters. A group of two
      or more Bartokk cannot be flanked, nor can they be denied their Dexterity bonuses to Defense unless
      all of them are caught flat-footed. When making Listen or Spot checks for a group of Bartokk, make
      only one check using the best skill bonus and the lowest DC. Bartokk gain a temporary +1 bonus to
      Intelligence for each additional Bartokk within 500 meters (maximum +12). The increase in Intelligence
      does not grant a Bartokk additional
  adventurers: Bartokk are rarely encountered alone. Groups of Bartokk often work as assassins in exchange
    for weapons and technology. Bartokk heroes are always segregated members of the species who lack the
    ability to join a hive mind (even with other Bartokk outcasts); lacking imagination, they typically
    become soldiers. No Bartokk Force-users are known to exist.
  example_names: Bartokk traditionally don’t have names, for they see little need to recognize individuals
    or their achievements. Bartokk who are ostracized and forced to abandon their kin sometimes take simple
    names, such as Krekk, Lulkk, or simply “Bartokk.”
  language: Bartokk are capable of speech but have no spoken or written language of their own.
  homeworld: An unnamed, rocky world located in the Outer Rim. Only members of the species know its location.
  physical_description: A Bartokk resembles a bipedal insectoid with a thick carapace, a small head, large
    multifaceted eyes, and four arms tipped with razor-sharp. claws. The average Bartokk adult stands
    about 1.9 meters tall.
  personality: Individual Bartokk are barely sentient. When they form large groups, their intellect increases
    exponentially, making them formidable opponents in numbers.
- name: Besalisk
  pdf_page: 23
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Dexterity, +2 Constitution.
  - name: Medium-size
    text: As Medium-size creatures, Besalisks have no special modifiers due to their size.
  - name: Speed
    text: Besalisk base speed is 10 meters.
  - name: Extra Limbs
    text: Male Besalisks have four arms, and female Besalisks can have as many as eight arms. The extra
      limbs give them a species bonus on Climb checks and grapple checks equal to the number of arms they
      possess (+4 for a four- armed Besalisk). Although Besalisks can hold items in each of their many
      hands, their brains are not complex enough to let them use more than four limbs in combat. For combat
      purposes, a Besalisk has one primary hand and three off hands. A Besalisk suffers the normal penalties
      for fighting with multiple weapons (see the Multiweapon Fighting feat description in the New Feats
      appendix).
  - name: Food Stores
    text: Besalisks can go without food for 8 days (instead of 3). They can go without water for 3 days
      (instead of 1). See Starvation and Thirst in Chapter Twelve of the Star Wars Roleplaying Game for
      more information.
  - name: Skill Bonuses
    text: Besalisks receive a +4 species bonus. on Survival checks in arctic environments and a +2 species
      bonus on Swim checks.
  - name: Free Language Skills
    text: Read/Write and Speak Besalisk.
  adventurers: Besalisks usually roam the galaxy to get away from their desolate homeworld or to turn
    a tidy profit. They often become embroiled in smug- gling ventures, gunrunning, and organized criminal
  example_names: Lexia Trexor, Taster Dannex, Dexter Jettster, Rysken Mokksi, Henk Zessek,
  language: Besalisks speak their own language, made up of grunts, growls, and barks. Written Besalisk
    uses a simple alphabet and short words. Besalisks speak Basic with ease.
  homeworld: Ojom, located in the Outer Rim, is a cold ocean world covered in giant glaciers that slowly
    move across the planet's surface. Each glacier supports a small Besalisk commune. Ojom has many space
    stations orbiting it, most of them larger than any planet-based commune. These stations fill the tole
    of Ojom’s spaceports and are more hospitable than the planet’s surface.
  physical_description: Besalisks are stocky humanoids with thick arms, a bony headcrest surrounded on
    either side by short feathers, and a wide mouth with a large elastic sack dangling from it. The average
    Besalisk stands about 1.8 meters tall. Male Besalisks have four arms, while female Besalisks can have
    as many as eight arms.
  personality: Besalisks are seen as gluttonous, an unfair characterization considering their bodies store
    water for days and food for over a week. Another false assumption is that they are nervous or in poor
    shape because they sweat profusely. In truth, they're simply accustomed to much cooler temperatures
    than most other species. Besalisks are sociable, gregarious, and keen-witted.
- name: Bimm
  pdf_page: 24
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Strength, +2 Intelligence, +2 Charisma.
  - name: Small
    text: As Small creatures, Bimms gain a +1 size bonus to their Defense, a +1 size bonus on attack rolls,
      and a +4 size bonus on Hide checks. They must use smaller weapons than Medium- size beings use,
      and their lifting and carrying limits are three-quarters those of Medium-size characters.
  - name: Speed
    text: Bimm base speed is 6 meters.
  - name: Free Language Skills
    text: Read/Write and Speak Bimm.
  adventurers: Bimm adventurers are typically scoundrels who work their way into the wealthy lives of
    nobles. Bimms of both types became Jedi in the days of the Old Republic.
  example_names: Rycar Ryjerd, Jarel Rulinam, Roki Morjara, Rav Mjalu.
  language: The two species of Bimms share the same language, spoken as a harmonious singsong - that sounds
    more like a collection of ballads than a standard form of communication.
  homeworld: Bimmisaari, a temperate and densely forested planet located in the outer reaches of the Mid
    Rim.
  physical_description: The first and mast commonly encountered Bimms are near-Humans of short stature
    that roughly resemble Human children in physical build, although males can grow (and take pride in)
    thick, full beards. Males and females both stand 1 to 1.5 meters tall.
  personality: Both species of Bimms are mild- mannered and cordial. The near-Human Bimms greatly value
    storytelling, particularly tales of heroic adventures. For all their love of heroics, they favor scholarly
    and artistic pursuits, preferring to record or invent tales and ballads of heroic deeds rather than
    perform them. Nonetheless, it is not unheard of for a Bimm to join a group of adventurers to witness
    tru
- name: Bith
  pdf_page: 25
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Constitution, +2 Intelligence, +2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Bith have no special modifiers due to their size,
  - name: Speed
    text: Bith base speed is 10 meters.
  - name: Heightened Smell
    text: Bith can identify an individual by smell at a range of 10 meters with a successful Wisdom check
      (DC 15).
  - name: Micro-Vision
    text: Bith gain a +4 species bonus on Search and Spot checks when limiting the use of these skills
      to an area up to 4 meters distant. However, Bith are myopic and suffer a -2 penalty on Spot checks
      to notice things that are 10 meters away or farther. Bith suffer a -4 penalty per range increment
      on ranged attack rolls instead of the normal -2 penalty per range increment.
  - name: Meditative Trance
    text: Instead of sleeping for 8 hours, a Bith can enter a trance that lasts 4 hours. At the end of
      the trance, he gains the benefits of having slept for 8 hours. The trance cannot be entered more
      than once per standard day. During the trance, the Bith remains some- what aware of his surroundings
      and can make Listen and Spot checks to avoid being surprised.
  - name: Free Language Skills
    text: Read/Write and Speak Bith. BLOOD CARVER fy t BOTHAN
  adventurers: Bith heroes tend to be nobles. Bith Force-users are not unheard of, and Bith Jedi consulars
    are relatively common during the days of the Old Republic. It is possible that some survived the Jedi
    Purge on the Bith homeworld.
  example_names: Lirin Car’n, Fiz Cor’gril, Figrin Da’'n, Doikk Na'ts, Tedn Dahai, Herian l’ngre, Angor
    Farn, Brin Da’p, Farquil, Fiz Cor’gril, Nalan Cheel, Nara Deega, Ickabel G’ont, Tech M’or, Tisilan.
  language: Bith speak and read Bith. Bith who travel the galaxy commonly speak Basic as well.
  homeworld: The small planet of Clak’Dor Vil, located in the Outer Rim’s Colu system (Mayagil Sector).
    Once a garden paradise with technologically advanced cities, Clak’Dor VIl was reduced to an ecological
    wasteland following a war between the Bith cities of Nozho and Weogar, forcing the Bith to live in
    domed, artificially sustained ecosystems.
  physical_description: Bith have gray to milky- white skin and stand 1.6 to 1.8 meters tall. Their large
    black eyes give them incredibly sharp vision, permitting them to focus on microscopic objects, but
    their long-range vision isn’t very clear. (Their acute sense of smell partially compensates for their
    poor long-range vision.)
  personality: Bith are dedicated pacifists and tend to be thoughtful, quiet, and introverted. They take
    great interest and pleasure in intellectual and artistic pursuits.
- name: Blood Carver
  pdf_page: 26
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Dexterity, -2 Wisdom, -2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Blood Carvers have no special modifiers due to their size.
  - name: Speed
    text: Blood Carver base speed is 12 meters.
  - name: Sneak Attack
    text: If a Blood Carver faces an oppo- nent who is unable to defend himself effectively from his attack,
      he can strike a vital spot for 1d6 points of extra damage. This extra damage applies only to melee
      attacks or ranged attacks within 10 meters. The sneak attack damage applies only to opponents that
      have discernible anatomies and are susceptible to critical hits. Blood Carver heroes and professionals
      gain an additional die of sneak attack damage every five levels (+2d6 at 5th level, +3d6 at 10th
      level, and so on). The sneak attack bonus stacks with the sneak attack ability of prestige classes
      such as the bounty hunter and findsman.
  - name: Skill Bonus
    text: Blood Carvers have flexible three- sectioned limbs and slender profiles that grant them a +2
      species bonus on Escape Artist checks.
  - name: Free Language Skills
    text: Read/Write and Speak Batorese.
  adventurers: Blood Carvers rarely operate inde- pendently of their tribes. Exiled Blood Carvers will
    sometimes form small groups or individually embark on quests for glory or paths of enlightenment.
    Some Blood Carvers explore the galaxy in search of ways to improve their standing within their tribes.
    Blood Carver heroes can pursue any heroic class, although they are most commonly scouts, soldiers,
    or Force ade
  example_names: Ke Daiy, Pa Gara, Mu Fievy, Va Tosh.
  language: Blood Carvers speak Batorese, a language that uses sounds as well as scents and skin coloration
    to a lesser degree. It is difficult for others, including protocol droids, to understand Batorese
    and impossible for others to speak it. The majority of Blood Carvers learn to speak Basic as well.
  homeworld: Blood Carvers originated on Batorine, a temperate world located in the Colonies region. Although
    many tribes of Blood Carvers relo- cated to Coruscant when their homeworld was attacked, Batorine
    is still home to many Blood Carver fiefdoms.
  physical_description: Triple-jointed humanoids with iridescent gold skin, wide beaklike noses, and beady
    black eyes, Blood Carvers stand about 2 meters tall. They typically wear close-fitting clothing that
    allows them to move quietly, and they sport tribal tattoos along the ridge of their nose flaps.
  personality: Blood Carvers are proud warriors with strong ties to their tribal leaders. They find flattery
    and exorbitant wealth disdainful. Among tribal ranks, obsequiousness and greed are punishable by anything
    from a simple beating to exile.
- name: Bothan
  pdf_page: 27
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Dexterity, -2 Constitution.
  - name: Medium-size
    text: As Medium-size creatures, Bothans have no special modifiers due to their size.
  - name: Speed
    text: Bothan base speed is 10 meters.
  - name: Skill Bonuses
    text: Bothans are skilled at intelligence gathering and gain a +2 species bonus on Gather Information
      and Spot checks. afar” or “trusted stranger” is “caamasi.”
  - name: Free Language Skills
    text: Read/Write and Speak Basic and Bothese.
  adventurers: Bothan adventurers, such as opera- tives in the spynet, engage in daring deeds—even when
    such deeds place them at great personal risk. In addition to intelligence operatives, Bothan heroes
    serve as soldiers and pilots, diplomats and ambassa- dors. Their curiosity leads some to be explorers
    and scouts. Even when a Bothan takes up a noble cause, his or her cultural upbringing makes it hard
    not to co
  example_names: Borsk Fey'lya, Karka Kre'fey, Koth Melan, Tav Breil'lya, Tereb Ab‘lon, Askar Rayl’skar,
    Asyr Sei’lar, Velst Nay’sro, Escra Plo"kre, Oneron Fil'vye, Liska Dan’kre, Tchaw Fenn, Se’lab, Maxeena
    Sov'lya, Drovus.
  language: Bothans speak and read Bothese and Basic.
  homeworld: The industrial world of Bothawui, located in the Mid Rim. Bothans also populate various colony
    worlds throughout the Mid Rim, including Kothlis and Torolis.
  physical_description: Bothans stand 1.6 meters tall on average and are covered with fur that ripples
    in response to their emotional state. They have tapered, pointed ears, and both males and females
    sport beards.
  personality: Bothans are manipulative, crafty, suspicious, and curious by nature. Some might even call
    them paranoid. They are also loyal and brave.
- name: Caamasi
  pdf_page: 28
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Strength, -2 Constitution, +4 Wisdom.
  - name: Medium-size
    text: As Medium-size creatures, Caamasi have no special modifiers due to their size.
  - name: Speed
    text: Caamasi base speed is 10 meters.
  - name: Memory Sharing (Memnii)
    text: Caamasi can create strong, lasting memories and share them with others of their species by using
      a kind of telepa- thy. Among the Caamasi, sharing memnii is an automatic ability, requiring only
      time. Sharing a memory requires as much time as the events remembered. Force-using characters can
      also receive memnii from a willing Caamasi with a successful Telepathy check (DC 15). Experiencing
      memnii is not like having a photographic memory of those events. Instead, the receiving character
      must make an Intelligence check (DC 10) to remember specific details. A character who accesses a
      memnii with Telepathy has a +2 circumstance bonus on Intelligence checks to remember details about
      the events in question.
  - name: Skill Bonus
    text: Caamasi gain a +2 species bonus on Diplomacy checks.
  - name: Free Language Skills
    text: Read/Write and Speak Basic and Caamasi.
  adventurers: Because of their pacifistic nature, Caamasi are never soldiers or thugs. Heroic Caamasi
    tend to be nobles. Caamasi with a strong connection to the Force may become Jedi consulars who use
    their Force powers to help mediate disputes.
  example_names: Elegos A’kla, Ylenic It'kla, Releqy, Tegas Sulkec, Megqli Likarin.
  language: Caamasi speak and read Caamasi and Basic.
  homeworld: The ravaged world of Caamas, located in the Core Worlds region. Following the Empire’s attack
    on Caamas, survivors migrated to other worlds including Kerilt, a Mid Rim jungle world in the Algara
    system.
  physical_description: Caamasi have tall, lean bodies covered with golden down. Regal rings of purplish
    fur surround their eyes, while stripes of purple fur extend around to the backs of their heads and
    shoulders. Caamasi have long, delicate, three- fingered hands. They average 1.8 meters tall.
  personality: Caamasi are thoughtful, contempla- tive pacifists. They enjoy exploration, artistic pursuits,
- name: Caarite
  pdf_page: 28
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Constitution, +2 Charisma.
  - name: Small
    text: As Small creatures, Caarites gain a +1 size bonus to their Defense, a +1 size bonus on attack
      rolls, and a +4 size bonus on Hide checks. They must use smaller weapons than Medium- size beings
      use, and their lifting and carrying limits are three-quarters those of Medium-size characters.
  - name: Speed
    text: Caarite base speed is 6 meters.
  - name: Climate Adaptation
    text: Caarites gain a +2 species bonus on Survival checks in hot climates and suffer a -2 species
      penalty on Survival checks in cald climates.
  - name: Free Language Skills
    text: Read/Write and Speak Basic and Caarimala.
  adventurers: Caarites who become adventurers do so for personal gain. They favor nonviolent tactics
    when face-to-face with an adversary, but they nonetheless carry a number of tools and ranged weapons,
    Caarites favor the scoundrel and fringer classes. Because they are averse to physical combat, they
    do not take up the soldier class. Some Caarites are Force-Sensitive, but their inherent greed prevents
    them from
  example_names: Velin Wir, Thurm Loogg, Belrem Mar, Fiana Jor, Zoda Brell.
  language: Caarites speak Caarimala and Basic. Many Caarites know at least one additional language.
  homeworld: The humid Outer Rim planet of Caarimon.
  physical_description: Caarites stand 1 meter tall (on average), with features that are vaguely porcine.
    They have slightly elongated snouts turned delicately upward at their tips. Their broad, open faces
    make their open smiles look even friendlier. Their flesh is pale pink, and their bodies are hairless.
  personality: Caarites are friendly, entertaining, and opportunistic. They desire to get the better of
    their rivals by any means necessary and demonstrate few scruples at the bargaining table.
- name: Cathar
  pdf_page: 30
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Dexterity, -2 Intelligence.
  - name: Medium-size
    text: As Medium-size creatures, Cathar have no special modifiers due to their size.
  - name: Speed
    text: Cathar base speed is 12 meters.
  - name: Natural Weapons
    text: Cathar have sharp claws and can make a claw attack in place of a normal unarmed attack. The
      claw attack deals 1d6 points of slashing damage plus the Cathar’s Strength modifier. The claw attack
      does not provoke attacks of opportunity.
  - name: Free Language Skills
    text: Read/Write and Speak Basic and Catharese.
  adventurers: Cathar adventurers can belong to any heroic class, although nobles, scouts, and soldiers
    are the most common. Force-sensitive Cathar often hear the call to join the ranks of the Jedi Order
    as Jedi consulars or Jedi guardians. Cathar scoundrels are rare, but those that exist have morals
    and loyalties that they would never violate for personal gain.
  example_names: Crado, Elashi, Feeth, Larducias, Manshara, Nodon, Nonak, Stragos, Sylvar, Tinisho,
  language: Cathar speak and read Catharese and Basic, punctuating their spoken words with the occa- sional
    low growl.
  homeworld: Cathar, a temperate world located in the Expansion Region.
  physical_description: Cathar have leonine features and flowing manes, with males’ manes generally larger
    than those of females. Male Cathar have short beards and two tusks jutting from the lower jaw, while
    females merely have impressive fangs. along the upper jaw. Males average 1.8 meters tall, while females
    average 1.6 meters tall.
  personality: Cathar are proud, passionate beings with strong morals and equally strong ties to tradition
    and family. They also form strong friendships and unshakable loyalties. Cathar generally hate as fiercely
    as they love. Although even-tempered, they are often quick to act. Their ferocity in battle is both
    legendary and terrifying.
- name: Celegian
  pdf_page: 30
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Dexterity, +2 Intelligence, +2 Wisdom, -2 Charisma.
  - name: Large
    text: As Large creatures, Celegians suffer a -1 size penalty on Defense, a —1 size penalty on attack
      rolls, and a —-4 penalty on Hide checks. They have a Face/Reach of 2 m by 2 m/4.m outside of their
      life-support chambers (2 m by 2 m/2 m otherwise). Their lifting and carrying limits are double those
      of Medium-size characters.
  - name: Speed
    text: Celegians use a natural form of levitation to hover and move about. Within a cyanogen atmosphere
      or floating life-support chamber, Celegians fly at a speed of 6 meters (average maneuverability).
      They swim at a speed of 16 meters in the cyanogen seas of their homeworld.
  - name: Telepathy
    text: A Celegian can communicate telepath- ically with any number of sentient beings within 500 meters,
      A being that wishes to resist tele- pathic contact with a Celegian must make a Will save (DC 10
      + the Celegian’s Wisdom modifier). A successful saving throw denies the Celegian tele- pathic contact,
      although the character in question knows that something has attempted to contact him. The Celegian
      can continue to attempt to establish contact for as long as the target is within range. All beings
      that receive tele- pathic communication from a Celegian “hear” the message in their own primary
      language. This abil- ity is primarily used for communication; it cannot “steal” memories or information.
  - name: Cyanogen Breather
    text: Celegians cannot survive without their native cyanogen atmosphere. After being exposed to an
      oxygen atmosphere for | round without a life-support chamber, a Celegian must make a Fortitude save
      (DC 10). The DC increases by +4 each subsequent round. If the save fails, the Celegian suffers 1d6
      points of -~ NA Y ir) saaaar Iii) temporary Constitution damage per round until it is returned to
      a cyanogen atmosphere. Exposure to cyanogen causes a similar reaction in oxygen breathers.
  - name: Expert Swimmer
    text: Celegians gain a +10 species bonus on Swim checks, enabling them to ply the tumultuous cyanogen
      seas of their homeworld.
  adventurers: Celegians are natural explorers and are occasionally found in the company of other species
    with similar interests. Celegians encountered far from their homeworld are usually nobles or scouts,
    Celegian Force adepts and Jedi are extremely rare,
  example_names: Ealu, Jolorr, Ooroo, Ruwaa.
  language: Celegians communicate using a sophis- ticated form of telepathy. They possess no spoken or
    written language.
  physical_description: A Celegian’s body resem- bles a brainlike organism with a mass of tentacles floating
    beneath it. The brain averages 1.2 meters in diameter, and the tentacles vary in length from 1.8 to
    2.2 meters. Away from their homeworld, Celegians are always encountered within some sort of mobile
    life- support chamber, usually made of transparisteel.
  personality: Celegians are wise, thoughtful beings who search for logical solutions to problems. They
    enjoy contemplating riddles, puzzles, and paradoxes. Celegians rarely put themselves in harm's way
    and avoid conflict wherever possible,
- name: Cerean
  pdf_page: 31
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Dexterity, +2 Intelligence, +2 Wisdom.
  - name: Medium-size
    text: As Medium-size creatures, Cereans have no special modifiers due to their size.
  - name: Speed
    text: Cerean base speed is 10 meters.
  - name: Quick Reaction
    text: Despite their general lack of coordination, Cereans’ reaction speed is superior to that of most
      other species. Cereans gain a +2 species bonus on initiative checks.
  - name: Free Language Skills
    text: 'Read/Write and Speak Basic and Cerean. Cerean Commoner; Init +1 (-1 Dex, +2 species); Defense
      9 (-1 Dex); Spd 10 m; VP/WP 0/10; Atk +0 melee (1d3, unarmed strike) or -1 ranged; SQ Species traits;
      SV Fort +0, Ref —1, Will +1; SZ M; FP 0; DSP 0; Rep +0; Str 10, Dex 8, Con 10, Int 12, Wis 12, Cha
      10. Equipment: Variety of personal belongings. Skills: Craft (any one) +3 or Profession (any one)
      +3, Knowledge (any one) +4, Read/Write Basic, Read/Write Cerean, Speak Basic, Speak Cerean. Feats:
      None. Kasha Meditation Crystal Cast: 2,000 (available on Cerea only) Weight: 1 kg Legend has it
      that the ancient founder of Cerea’s planetary leadership, Bi-Dar Tyunda, created the art form of
      etching ornate, intricate patterns into multi- hued kasha crystals found only on the Cerean. homeworld.
      Scribing specific patterns into the crystal’s facets allows the artist to harness the crystal’s
      natural harmonic energy, which helps calm emotions and clear the thoughts. Cerean meditation crystals
      are found in most homes on Cerea. Kasha meditation crystals enable Cereans to focus their natural
      precognitive abilities. One hour of quiet, uninterrupted mediation with a kasha medi- tation crystal
      allows a Cerean character to take 10 on all Diplomacy checks for the next 24 hours (regardless of
      the situation). The character also gains a +4 inherent bonus on any single skill check, provided
      the character has ranks in the skill (the skill may be chosen at any time during the 24-hour post-meditative
      period). Transforming an ordinary, unattuned kasha crystal into a meditative device requires an
      investment of 200 credits for raw materials, 72 hours of work, and a successful Craft (sculpture)
      check (DC 30). The Craft check is made at the end of the 72 hours; if the check fails, the raw materials
      and time are wasted, and the crystal does not function. i During the Galactic Civil War, kasha meditation
      crystals can be found only on Cerea. Shyarn (Gerean Dueling Scimitar) Cost: 900 Stun/Fort DC: —
      Damage: 1d6 Type: Slashing Critical: 18-20 Multifire/Autofire: — Range Increment: — Size: Medium-size
      Weight: 5 kg Group: Exotic The shyarn (an old Cerean word for “dancer”) is a light, curved sword
      favored by Cereans for traditional honor duels. Metalsmiths trained in ancient methods forge the
      silver-hued scimitar using a magnetic bond- ing process and unique metals found on Cerea. Hundreds
      of shvarn-ado schools to train duelists in proper use of the sword, which most agree takes a lifetime
      to master. When one shyarn strikes another, the vibrations and contact can create a powerful temporary
      magnetism that links the blades. This keeps the duelists locked together, dancing and twirling to
      avoid slicing jabs in a deadly ballet until one duelist breaks the lock to maneuver for another
      attack. For reasons known only to Cerean metalsmiths, the alloys in a shyarn are not magnetically
      attracted to any other metals. Shyam wielders must contend with the magnetic properties of the blades.
      When either combatant misses an attack roll by 4 or less, the two shyarn become magnetically joined.
      Neither character may move anywhere except a square adjacent to his opponent without releasing the
      shyarn or using a full-round action to disengage the blades. Characters with linked shyarn may still
      make Tumble checks to move through threatened squares. Because the duelist must also maintain a
      grip on his shyarn, however, he must succeed at a Dexterity check against DC 14 to hold onto his
      sword hilt when attempting to tumble. When either duelist surren- ders, loses his blade, or is killed,
      the honor duel is considered over. Chadra-Fan Chadra-Fan hail from the world of Chad in a rarely
      visited Outer Rim system of the same name. Their culture is technologically primitive by galactic
      stan- dards; a string of natural disasters on their homeworld has forced them to focus on the necessity
      of survival. What high technology they possess has been brought to Chad by scouts and traders and
      subsequently copied or modified by the Chadra-Fan. Chadra-Fan compulsively tinker. Any mechanical
      device left within reach has the potential to be disas- sembled and then reconstructed. As they
      have been subjecting devices to this treatment since early child- hood, Chadra-Fan have gained an
      innate sense of how most technology functions and are often found working as mechanics. Virtually
      all Chadra-Fan that are encountered off their homeworld are either slaves or former slaves. Curiously,
      most Chadra-Fan do not resent being enslaved, as they view it as a grand adventure. Personality:
      In general, Chadra-Fan are exuberant in the extreme and like virtually everyone they meet. It takes
      quite a bit of abuse to curtail or obliterate their cheery disposition. Chadra-Fan do not survive
      well on their own and constantly seek companionship. Physical Description: Chadra-Fan are small
      humanoids with flat faces, round dark eyes, large ears, and flat noses. Chadra-Fan stand | meter
      tall (on average), and their entire bodies are covered in gleam- ing fur, except for their oversized
      hands. Homeworld: Chad, a technologically primitive Outer Rim world known for its vast seas, sprawling
      marshes, and ferocious hurricanes. Language: Chadra-Fan speak and read Chadra-Fan, but those who
      leave their homeworld pick up Basic quickly. Their voices sound squeaky and nasal when they speak
      Basic. Example Names: T’achak, T’andar, T’ar Ta‘avon, Yarbolk Yemm, Kabe, Chan, Fandar, Fugo, Tutti
      Snibit, Trubor. Age in Years: Child 1-11; young adult 12-15; adult 16-40; middle age 41-59; old
      60-79; venerable 80+. Adventurers: Chadra-Fan heroes are typically fringers, scoundrels, and tech
      specialists. Chadra-Fan Jedi, are extremely rare, although at least one is known to exist during
      The New Jedi Order era. h species that developed an ability to withstand the radi- ation survived.
      The Chagrians were among those species, and their skin—which ranges in color from light blue to
      deep indigo—continues to provide them with remarkable natural protection from radiation of all kinds.
      Chagrian civilization arose on the thin coastal bands of Champala’s small, jungle-covered conti-
      nents. Their cities are built in long strips in the tidal zones. At high tide, most buildings are
      completely submerged. When these buildings fill with water during high tide, the Chagrians swim
      from building to building, from floor to floor. All but Champala’s oldest starports are built on
      high plateaus well away from the cities, with aircars ferrying visitors back and forth. Chagrians
      are born with a weak sense of taste and lose it completely shortly after becoming adults. They do
      not celebrate eating the way many other species do. Indeed, they view it as a necessary nuisance;
      food is fuel for the body, nothing more. Modern Chagrian adults consume nutrient capsules to avoid
      wasting time eating. When traveling the galaxy, they carry nutritional analyzers to scan unfamiliar
      food and determine its nutritional worth. i A number of Chagrians joined the Rebel Alliance, and
      several of their number played a major part in Tiberating Mon Calamari and other water worlds from
      Imperial domination. As the New Republic formed, the Chagri system was one of the first to join,
      and the Chagrians remain among its staunchest supporters. Personality: Chagrians are law-abiding
      and even- tempered. The species has always known abundance, so greed and avarice are uncommon traits
      among them. Chagrians prefer to live in cosmopolitan areas, where they can interact with other people
      and species. Physical Description: Chagrians have blue skin. Males and females both have a pair
      of horns, known as “lethorns,” protruding from fleshy growths on the side of their heads. Lethorns
      can become quite large and can be draped over the shoulders. Males have a second pair of horns sprouting
      from the tops of their heads; these sharp horn were once used to battle for mates, but now they
      serve only as a source of vanity, Males and females of the species both stand between 1.7 and 2.2
      meters tall. Homeworld: The water world of Champala in the Chagri system, a favorite vacation spot
      among the Inner Rim worlds. Language: Chagrians speak and read Chagri. Chagrians who leave Champala
      typically learn to speak Basic as well. Example Names: Mas Amedda, Belar Vasseya, Myn . Seda, Shiran
      Vallendri, Ketrias Gorran. Age in Years: Child 1-12; young adult 13- 16; adult 17-42; middle age
      43-56; old 57-75; venerable 76+. Adventurers: Chagrian adventurers can be of any heroic class, although
      Chagrian Jedi are rare.'
  adventurers: Cereans who become adventurers do so in direct contradiction to their traditions and beliefs.
    Even so, when a cause or situation turns a Cerean to this path, he or she tries to approach life with
    as many of the Cerean beliefs intact as possible. Aggression should be the last resort after all peaceful
    solutions are attempted, for example. The binary brain allows a Cerean to constantly weigh both si
  example_names: Ki-Adi, So Leet, Sylvn, Ti-Dal, Maj-Odo, Skeel, Kordren, Bin-Garda.
  language: Cereans speak and read Cerean and Basic.
  homeworld: Cerea, a blissful planet located in the Mid Rim.
  physical_description: Cereans average 2 meters tall and have a similar build to Humans. Their elon-
    gated craniums house complex binary brains that enable them to process information and solve prob-
    lems rapidly. Cereans also have two hearts beating in their chests.
  personality: Cereans tend to be calm, rational, and extremely logical.
