- name: Iktotchi
  pdf_page: 77
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Dexterity, +2 Constitution, -2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Iktotchi have no special modifiers due to their size.
  - name: Speed
    text: Iktotchi base speed is 10 meters.
  - name: Natural Armor
    text: An Iktotchi’s tough skin provides a +1 natural armor bonus to Defense.
  - name: Precognition
    text: All Iktotchi possess limited precog- nition. For most of them, it manifests in prophetic dreams
      that predict events that will shape the lives of millions. Most Iktotchi are unable to control when
      they have precognitive visions, but instead receive them as particularly vivid dreams or daydreams.
      Iktotchi who possess the Force-Sensitive feat and at least one rank in the Farseeing force skill
      can purposefully see into the future with a successful Farseeing check (DC 20, instead of the normal
      DC 25).
  - name: Skill Bonus
    text: Iktotchi receive a +2 species bonus on Pilot checks.
  - name: Bonus Feat
    text: Iktotchi receive the bonus feat Starship Operation (any one).
  - name: Free Language Skills
    text: Read/Write and Speak Iktotchese.
  adventurers: Iktotchi adventurers are typically nobles, scouts, soldiers, tech specialists, and starship
    aces. Iktotchi Jedi consulars and Jedi guardians are most common during the Rise of the Empire era,
    although a few of them are believed to have survived the Jedi Purge as well.
  example_names: Arctan Meeso, Daedar Xiese, Liiren Baelar, Niira Korl, Saesee Tiin, Seer Varree.
  language: Iktotchi speak and read Iktotchese. They can also speak Basic with ease.
  homeworld: Iktotch, a moon orbiting the planet Iktotchon in the Expansion Region.
  physical_description: The Iktotchi have tough, hairless skin that protects them from the fierce winds
    of their homeworld. Adults average 1.8 meters tall and possess sturdy builds. Both males and females
    have downward-curving horns, although the homs of the males are somewhat larger. Their hands are broad,
    and their thick fingers give them a limited manual dexterity.
  personality: Iktotchi are sensitive beings who hide their deep emotions behind a facade of quiet stoicism.
    They respect diversity and adapt quickly to other cultures, but they don’t form friendships with other
    species easily.
- name: Ishi Tib
  pdf_page: 79
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Dexterity, +4 Intelligence.
  - name: Medium-size
    text: As Medium-size creatures, Ishi Tib have no special modifiers due to their size.
  - name: Speed
    text: Ishi Tib base speed is 10 meters.
  - name: Breathe Underwater
    text: As amphibious creatures, Ishi Tib can’t drown in water. They also gain a +4 species bonus on
      Swim checks.
  - name: Natural Weapon
    text: An Ishi Tib can make an unarmed melee attack with its hooked beak, dealing 1d4 points of piercing
      damage (plus Strength modifier). The beak attack does not provoke attacks of opportunity.
  - name: Rage
    text: When an Ishi Tib takes damage from an attack, it can choose to rage. In this state, the Ishi
      Tib gains +4 Strength, +2 vitality points per level (40 for commoners), and a +2 rage bonus on Fortitude
      and Will saves, but suffers a -2 penalty to Defense. While raging, the Ishi Tib cannot use skills
      that require patience and concentration, such as Move Silently, Combat Expertise, or Force-based
      abilities. The rage can last for a number of rounds equal to 5 + the Ishi Tib’s Constitution modifier
      (but see below). At the end of the rage, the Ishi Tib loses the bonus to Strength and the bonus
      vitality points. Furthermore, the Ishi Tib is fatigued (—2 penalty to Strength and Dexterity, can’t
      run or charge) for a number of rounds equal to the rage’s duration. At the start of the rage, the
      Ishi Tib must choose one opponent and continue attacking that opponent until the rage ends or until
      the opponent drops to 0 wound points (at which point the rage ends). The Ishi Tib can only use melee
      weapons (including its beak) while raging.
  - name: Hydration
    text: Ishi Tib must immerse themselves in brine (saltwater solution) for at least 1 minute every day
      or dehydrate. For each standard day that passes without immersion, the Ishi Tib takes 1d4 points
      of temporary Constitution damage. An Ishi Tib cannot regain lost Constitution points by resting
      while dehydrated, and an Ishi Tib reduced to 0 Constitution dies.
  - name: Free Language Skills
    text: Read/Write and Speak Tibranese.
  adventurers: Ishi Tib encountered away from Tibrin are usually biologists, ecologists, and oceanog-
    raphers. In spite of their organizational skills and high intelligence, many corporate sponsors find
    the species difficult to work with. These Ishi Tib usually fall in love with space travel before they
    can make their way back to Tibrin. Ishi Tib heroes are usually fringers, nobles, and tech specialists.
  example_names: Jund Voon, Koth-Mon, Kenjil Mang, Sciltra Rega, Hare Seff, Thilis-Brin, Shasa Tiel, Troc
    Slatter.
  language: Tibranese is a language of squeals, honks, and beak-clacks. Written Tibranese uses hiero-
    glyphs, a throwback to ancient times when only simple pictures could be carved into soft objects in
    Tibrin’s watery environment.
  homeworld: Tibrin, located in the Mid Rim, is a world of shallow oceans dotted with developed coral
    reefs and sandbars that serve as Ishi Tib centers of commerce. Technology is carefully tested before
    it can be implemented on Tibrin to prevent pollution. Structures are often made of coral and other
    organic materials, and beasts perform many tasks usually performed by machines.
  physical_description: Ishi Tib stand about 1.8 meters tall and have green skin. Their four-pointed,
    star-shaped face features a pair of lidless yellow eyes on short stalks and a sharp, hooked beak.
    Their lungs can breathe air or water.
  personality: Ishi Tib are patient, meticulous, highly organized perfectionists. They are quick to correct
    the errors of other school members, and most are strident defenders of the natural environment.
- name: Itharian
  pdf_page: 81
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Dexterity, +2 Wisdom, +2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Ithorians have no special modifiers due to their size.
  - name: Speed
    text: Ithorian base speed is 10 meters.
  - name: Strong-Willed
    text: Ithorians receive a +1 species bonus on Will saves.
  - name: Skill Bonuses
    text: Ithorians are attuned with nature. They receive a +4 species bonus on Knowledge (wilderness
      lore) checks and a +2 species bonus on Survival checks.
  - name: Free Language Skills
    text: Read/Write and Speak Basic and Ithorese.
  adventurers: Ithorians tend to concentrate on peaceful professions. They love to meet new beings and
    see new places. They enjoy negotiating deals and finding peaceful solutions to conflict. They have
    a_ spiritual nature tied to their devotion to the Mother Jungle of their homeworld. Often, wanderlust
    leads them to explore the greater galaxy for a time before they eventually return to Ithor or the
    herd ship tha
  example_names: Chandra Hobat, Deneb Both, Erd Lumas, Fandomar, Momaw Nadon, Oraltor, Phontos, Tendau
    Bendon, Thulls, Tol Ado, Tomla El, Whuvumm, Worlohp, Umwaw Moolis.
  language: Ithorians speak stereophonic Ithorese.
  homeworld: Ithor, a jungle planet located in the
  physical_description: '|thorians are humanoid,'
  personality: Ithorians tend to be calm, peaceful,
- name: Jawa
  pdf_page: 81
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -4 Strength, +2 Dexterity, -2 Charisma.
  - name: Small
    text: As Small creatures, Jawas gain a +1 size bonus to their Defense, a +1 size bonus on attack rolls,
      and a +4 size bonus on Hide checks. They must use smaller weapons than Medium-size beings use, and
      their lifting and carrying limits are three-quarters those of Medium-size characters.
  - name: Speed
    text: Jawa base speed is 6 meters.
  - name: Primitive
    text: 'Jawas with heroic or professional classes receive the bonus feats Weapon Group Proficiency
      (primitive weapons) and Weapon Group Proficiency (simple weapons) instead of the usual Weapon Group
      Proficiency bonus feats. 6 Darkvision: Jawas possess darkvision (20 meters). Darkvision is black
      and white only but otherwise functions as normal sight. 6 Skill Bonus: Jawas receive a +2 species
      bonus on Survival checks.'
  - name: Free Language Skills
    text: Read/Write and Speak Jawa and Speak Jawa Trade Language.
  adventurers: Jawas have little understanding of the galaxy at large. Their fear of the unknown keeps
    them firmly grounded on Tatooine. A Jawa removed from his homeworld might assume the life of a scout,
    scoundrel, or tech specialist.
  example_names: Aved Luun, Dathcha, Eet Ptaa, Jek Nkik, Jik’tal, Het Nkik, Hrar Kkak, Rkik Dnec, Tteel
    Kkak.
  language: Jawas have a complex lanquage incom- prehensible and unteachable to non-Jawas. It consists
    of almost meaningless syllables that only make sense when combined with pheromonally produced empha-
    sis. (Even when a Jawa isn’t actively conversing, his scent can tell others his mood.) When bargaining
    with non-Jawas, they use a simplified form of their native tongue known as Jawa Trade Language.
  homeworld: Tatooine, located in the Outer Rim.
  physical_description: Jawas stand 1 meter tall, on average. They wear dark-hooded robes that cover all
    but their glowing eyes. Xenobiologists spec- ulate that Jawas evolved from cave-dwelling rodents,
    and few other species that have dealt with Jawas would disagree.
  personality: Jawas are opportunistic and cowardly. They have a well-deserved reputation as thieves and
    swindlers, although they would hardly consider these words insults. Jawas are proud of their ability
    to acquire what others obviously no longer need and sell things that require frequent maintenance
    and costly replacement parts.
- name: Jenet
  pdf_page: 82
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Strength, +2 Dexterity, +2 Intelligence, —4 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Jenets have no special modifiers due to their size.
  - name: Speed
    text: Jenet base speed is 12 meters.
  - name: Photographic Memory
    text: Jenets remember every- thing they experience. The GM can allow a Jenet to make a Wisdom check
      to determine whether he's heard of or seen (as appropriate) someone or something before. The DC
      depends on how likely it is that the Jenet was paying attention and how noticeable the detail might
      have seemed at the time. If there’s no chance of the Jenet remember- ing, the check fails automatically.
  - name: Low-light Vision
    text: Jenets can see twice as far as normal in dim light. They retain the ability to see colors under
      these conditions.
  - name: Skill Bonuses
    text: Nimble and swift, Jenets are capa- ble climbers and swimmers. They gain a +2 species bonus on
      Climb, Escape Artist, Jump, and Swim checks.
  - name: Bonus Feats
    text: Jenets gain the bonus feats Alertness and Run,
  - name: Free Language Skill
    text: Speak Jenet.
  adventurers: Jenets rarely travel alone and prefer the company of other Jenets. Jenets who leave their
    homeworld or colonies typically find jobs with less discriminating employers who take advantage of
    their incredible memories. Jenet heroes are usually fringers or scoundrels, although they can belong
    to any class.
  example_names: Channik Who Built a Starfighter and Flew to Ryloth, Lezarn Who Deals in Spice, Rish Who
    Slew Vahgar the Drunken Houk.
  language: Jenets communicate using squeaks, squeals, chatters, and high-pitched barks. They have no
    written language, instead relying completely on an oral history even for mundane details.
  homeworld: Garban is a temperate world in the Outer Rim’s Tau Sakar system. The Jenets primarily live
    in vast subterranean warrens deep below the planet’s surface.
  physical_description: Jenets are 1.5-meter-tall humanoids with pale pink skin, beady red eyes, tufts
    of white fur, and stiff whiskers.
  personality: Many species find Jenets petulant and insufferable. They are tactless, barely able to contain
    themselves when faced with ignorance or lies, and obsessed with trivial details. Jenet think nothing
    of berating someone they've never met for a distant acquaintance’s transgression.
- name: Kaminoan
  pdf_page: 83
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Constitution, -2 Wisdom.
  - name: Medium-size
    text: As Medium-size creatures, Kaminoans have no special modifiers due to their size.
  - name: Speed
    text: Kaminoan base speed is 10 meters.
  - name: Adaptable
    text: Kaminoans receive a +2 species bonus on Survival checks.
  - name: Free Language Skills
    text: Read/Write and Speak Basic and Kaminoan.
  adventurers: Kaminoans are genetically bred to fill various niches. A Kaminoan might become a noble
    just as easily as a tech specialist or a soldier, Scouts are rare, scoundrels even more so, and Force-using
  example_names: Aya Lim, Lama Su, Maru Lan, Tau Shel, Taga Sai, Seva Ke, Taun We.
  language: Kaminoans speak and read Kaminoan
  homeworld: The stormy ocean world of Kamino, located on the edge of Wild Space.
  physical_description: Kaminoans are slim, bipedal beings with pale skin and dark eyes. They stand 2.1
    to 2.7 meters tall and are thin to the point of being gaunt. They have long, graceful necks and slender
    fingers. Their mouths are somewhat smaller than those of Humans, but seem smaller yet because of
  personality: Kaminoans are outwardly polite, yet behind this lurks an intolerance of physical imperfec-
    tion. They present an aspect of quiet curiosity and aloofness, but are generally pleasant and approach-
    able. Their voices are as soft and soothing as their manner.
- name: Kel Dor
  pdf_page: 84
  canon: legends
  traits:
  - name: Ability Modifiers
    text: '+2 Dexterity, -2 Constitution, +2 Wisdom, 6 Medium-size: As Medium-size creatures, Kel Dor
      have no special modifiers due to their size.'
  - name: Speed
    text: Kel Dor base speed is 10 meters.
  - name: Gas Breather
    text: Kel Dor cannot survive without their native atmosphere, specifically a gas unique to their homeworld.
      Without protective goggles, a Kel Dor is considered blinded (see the Character Condition Summary
      in Chapter Twelve of the Star Wars Roleplaying Game). A Kel Dor with- out a suitable breath mask
      can hold his breath for a number of rounds equal to his Constitution score before he needs to make
      Constitution checks to avoid suffocation (see Suffocation and Drowning in Chapter Twelve of the
      Star Wars Roleplaving Game).
  - name: Low-Light Vision
    text: Away from their homeworld, Kel Dor gain low-light vision. They can see twice as far as normal
      in dim light, and they retain the ability to distinguish color and detail under these conditions.
  - name: Free Language Skills
    text: Read/Write and Speak Basic and Kel Dor.
  adventurers: Kel Dor who decide to brave the dangers of living outside their homeworld tend to be nobles,
    diplomats, traders, bounty hunters, and Jedi. Their willingness to help others often mixes with their
    innate sense of justice, leading many into some form of law enforcement.
  example_names: Dorn Tlo, Eorin Zal, Plo Koon, Roor Trevol, Torin Dol, Xol Kenyak, Yem Nemnin.
  language: Kel Dor speak and read Kel Dor and Basic.
  homeworld: Dorin, an Outer Rim world with an atmosphere toxic to non-natives.
  physical_description: The average Kel Dor stands between 1.4 and 2 meters tall, with males being taller
    and somewhat more sturdy of build than the females. Their skin ranges in color from peach to deep
    red. Most have black eyes, though a few are bom with silver irises that some believe mark them as
    strong in the Force.
  personality: The Kel Dor are kind-hearted and even-tempered, and the average Kel Dor never ignores or
    refuses another being in need. At the same time, Kel Dor believe in quick, simple justice and aren't
    averse to taking the law into their own hands.
- name: Kerestian
  pdf_page: 85
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, —2 Intelligence, -2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Kerestians have no special modifiers due to their size.
  - name: Speed
    text: Kerestian base speed is 10 meters.
  - name: Resilient
    text: Kerestians receive a +1 species bonus on Fortitude saving throws.
  - name: Skill Bonus
    text: Kerestians gain a +2 species bonus on Survival checks,
  - name: Bonus Feats
    text: Kerestians gain the bonus feat Toughness.
  - name: Free Language Skills
    text: Read/Write and Speak Kerestese.
  adventurers: Kerestians who tire of languishing in the frigid wastelands of Kerest usually find work
    offworld as soldiers-of-fortune, mercenaries, and bounty hunters. “Lost” Kerestians are more interested
    in art, diplomacy, and exploration. Kerestian heroes can be either and may belong to any heroic class.
  example_names: Anzella, Galasett, Meergolo, Milacass, Ossune, Sallabas, Andov Syn.
  language: Kerestese is an intricate language, having many unique rules and exceptions. The written form
    uses an equally complex alphabet.
  homeworld: Kerest, located in the Outer Rim. A thick sheet of glacial ice covers all but a strip of
    land near the planet's equator.
  physical_description: Kerestians are tall, broad- shouldered humanoids with pale skin, slit-pupilled
    eyes (usually emerald-green), and twin manes of long, thick hair. Other notable facial features include
    a series of air holes running along each cheekbone, a single nostn] that joins with the mouth, and
    low, featureless ear holes. Kerestians stand about 2.15 meters tall.
  personality: Kerestians from present-day Kerest are brutal, uncivilized beings who do whatever is required
    to survive. They live for the hunt and slay anyone who stands in their way. In sharp contrast, “lost”
    Kerestians are civilized and compassionate beings who are saddened by the near-destruction and regression
    of their society.
- name: Khommite
  pdf_page: 87
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Constitution, +2 Intelligence, -2 Wisdom.
  - name: Medium-size
    text: Khommites have no special modi- fiers due to their size. Khommites who stand 1.2 to 1.4 meters
      tall are considered Small and should have their game Statistics adjusted accordingly.
  - name: Speed
    text: Khommite base speed is 10 meters.
  - name: Clone
    text: 'Each Khommite represents generations of perfection in one particular field. Each one is the
      end of a long chain of identical Khommite clones that share the same character class. A Khommite
      may choose from the following list of heroic and professional classes: noble, scout, soldier, commoner,
      diplomat, expert, or thug. Using the multiclass rules, a Khommite can take levels of Force adept,
      Jedi consular, or Jedi guardian; however, Force-using Khommites are exceedingly rare (and the GM
      may disallow them as heroic characters). If the Khommite takes any class other than his chosen class,
      he loses 10% of all experience gained from that point on.'
  - name: Free Language Skills
    text: Read/Write and Speak Basic.
  adventurers: Few Khommites manifest a desire to leave their structured, orderly society. Those who heed
    the call of adventure begin as nobles, scouts, or soldiers.
  example_names: Brell 142, Dorsk 81, Edor 76, Kaell 116, Kiros 65, Rosk 102, Sestra 49, Telsa 89.
  language: Khommites speak and read Basic.
  homeworld: Khomm, a pale green planet in the Deep Core.
  physical_description: Khommites are a hairless species of near-Humans that stand between 1.2 meters
    and 2 meters tall. Small ridges run across the top of a Khommite’s head.
  personality: Among Khommites, conformity is more important than creativity. Consequently, Khommites
    are usually intelligent yet narrow-minded; most of them are set in their ways and not very inno- vative
    or imaginative.
- name: Kitonak
  pdf_page: 89
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Dexterity, +2 Constitution, +2 Wisdom, —2 Charisma.
  - name: Small
    text: As Small creatures, Kitonak gain a +1 size bonus to their Defense, a +1 size bonus on attack
      rolls, and a +4 size bonus on Hide checks. They must use smaller weapons than Medium-size beings
      use, and their lifting and carrying limits are three-quarters those of Medium-size characters.
  - name: Speed
    text: Kitonak base speed is 6 meters.
  - name: Natural Armor
    text: A Kitonak’s thick leathery skin provides a +2 natural armor bonus to Defense.
  - name: Slow Reaction
    text: Kitonak react slowly, even in combat. They suffer a -2 penalty on initiative checks.
  - name: Resistant to Persuasion
    text: Other species take a -4 penalty on Bluff, Diplomacy, and Intimidate checks when dealing with
      a Kitonak.
  - name: Free Language Skills
    text: Speak Kitonese.
  adventurers: 'Kitonak adventurers are usually fringers or scouts. Before the Jedi Purge, more than one
    Jedi Master wondered whether members of the Kitonak species would be suitable for training as Jedi:
    however, no record of any Jedi Master training one exists. Kitonak Force-users are usually Force adepts
    who spend most of their time in deep meditation.'
  example_names: Anarin, Enkor, Gorlak, Nert, Norzek, Rufar, Runk, Snit, Terno, Werg.
  language: Kitonak speak Kitonese and can learn to speak Basic with ease, albeit slowly. They know that
    other beings become irritated when they speak with them, so most Kitonak only speak to non-Kitonak
    when addressed directly or when they feel they have something important to say.
  homeworld: Kirdo Ill, an arid planet in the Outer Rim. Winds whip sand clouds across the planet's surface
    at speeds that often exceed 400 kilometers per hour.
  physical_description: Kitonak are humanoids with sturdy legs and thick arms that end in pudgy fingers.
    Their eyes, ears, mouth, and other bodily orifices are all nearly invisible within the folds of their
    tough, leathery hides. Kitonak possess an extra set of lungs that enables them to store oxygen for
    up to 4 hours.
  personality: Kitonak are beings of exceptional patience. They do everything with slow deliberation,
    including breathing and eating. Every decision is. weighed with great care, even if it's something
    as triv-
- name: Klatooinian
  pdf_page: 90
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Constitution, -2 Intelligence.
  - name: Medium-size
    text: As Medium-size creatures, Klatooinians have no special modifiers due to their size.
  - name: Speed
    text: Klatooinian base speed is 10 meters.
  - name: Strong-Willed
    text: Klatooinians receive a +2 species bonus on Will saves.
  - name: Free Language Skills
    text: Speak Huttese.
  adventurers: Klatooinian adventurers are typically fringers, scouts, or soldiers. Klatooinian Force-users
    are extremely rare.
  example_names: Barada, Bekure, Chokk, Drekk, Jarakar, Kuuvat, Massa, Rokar, Sovara.
  language: Most Klatooinians speak Huttese and are illiterate. The original Klatooinian language exists
    only in ancient texts and is known to but a few Klatooinians.
  homeworld: Klatooine, a desert world located in the Outer Rim.
  physical_description: Klatooinians have coarse skin that ranges from olive green to dark brown. They
    have flat, vaguely canine muzzles and dark eyes set beneath pronounced brows. As adults, they stand
    between 1.6 and 2 meters tall with no difference in height between males and females, although males
    are usually slightly heavier in build.
  personality: Klatooinians are best known for their fierce determination and loyalty. Although not terribly
    bright, they make stalwart companions and are not easily offended or discouraged.
- name: Koorivar
  pdf_page: 92
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Constitution, +2 Intelligence, +2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Koorivar have no special modifiers due to their size.
  - name: Speed
    text: Koorivar base speed is 10 meters.
  - name: Wealthy
    text: Koorivar characters toll an extra die when determining starting credits. For example, a 1st-level
      Koorivar noble starts play with 2d4 x 1,000 credits instead of the standard 1d4 1,000.
  - name: Strong-Willed
    text: 'Koorivar have focused minds, giving them a +1 species bonus on Will saves. 6 Skill Bonus: Koorivar''are
      keen observers of behav- ior and body language. They gain a +2 species bonus on Sense Motive checks.'
  - name: Free Language Skills
    text: Read/Write and Speak Koorivar.
  adventurers: Koorivar adventurers explore the galaxy in search of glory and profit. Many spacefaring
    Koorivar are nobles with their own space transports who like to employ crews of mixed species, calling
    pon the various talents that each species has to offer. Koorivar merchants will often work together
    in small fleets, pooling their efforts and resources.
  example_names: Passel Argente, Shand Essil, Terrem Jesond, Denaria Kee, Menas Neyrr, Leosa Vantare.
  language: Koorivar speak their own language, which combines whispers and soft sibilants with subtle
    hand gestures. They also speak Basic with ease.
  homeworld: Kooriva, a tropical Inner Rim world with vast oceans and sprawling rain forests.
  physical_description: Koorivar adults stand approximately 1.9 meters tall. Their skin varies in hue
    from rich magenta and mauve to dark green and black, and their eyes are a sickly shade of yellow.
    Banded ridges cover a Koorivar's forehead and extend down the bridge of the nose. A brightly colored,
    almost leaflike spiraling horn rises from the top of a Koorivar’s head.
  personality: Koorivar are astute, opportunistic, and cautious beings. They prefer not to put them- selves
    in harm's way and always try to bargain or trick their way out of a tough predicament before resorting
    to violence.
- name: Krevaaki
  pdf_page: 92
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Wisdom, -2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Krevaaki have no special modifiers due to their size.
  - name: Speed
    text: Krevaaki base speed is 10 meters.
  - name: Natural Armor
    text: A Krevaaki's shell provides a +2 natural armor bonus to Defense.
  - name: Tentacles
    text: Krevaaki use their tentacles as bipeds use arms and legs. Krevaaki receive a +2 species bonus
      on Climb checks. In addition, Krevaaki who select the Martial Arts feat gain a +2 species bonus
      on grapple checks. The Krevaaki’s tentacles are less dexterous than a humanoid hand, making some
      tasks difficult to perform. At the GM’s discretion, Krevaaki take a —4 penalty on checks to manipulate
      small items such as coins or pebbles. Affected skills include Craft, Disable Device, and Repair.
      An appropriate set of tools for performing affected skills negates this penalty (in addition to
      providing its normal bonus).
  - name: Stoic
    text: A Krevaaki’s face is a series of shifting, chitinous plates with a limited range of expres-
      sion. The sliding of these plates is noticeable but meaningless to non-Krevaaki. Other species take
      a -4 penalty on Sense Motive checks against Krevaaki during face-to-face communication.
  - name: Resilient
    text: Krevaaki receive a +1 species bonus on Fortitude saves.
  - name: Free Language Skills
    text: Read/Write and Speak Kreva.
  adventurers: Krevaaki travel the galaxy for many reasons. Some seek greater understanding of the Force.
    Others seek peaceful coexistence with other species. A few are drawn to the stars for reasons beyond
    their grasp—they leave the homeworld know- ing only that their destinies lie elsewhere.
  example_names: Chal-Vosa, Craasadi, Jo] Kion- Tas, Visto Skaasad, Vodo-Siosk Baas.
  language: Krevaaki speak and read Kreva.
  homeworld: Krevas, a swampy world located in the Outer Rim.
  physical_description: An adult Krevaaki stands 2 meters tall and has eight segmented tentacles, some
    with protrusions that work like opposable thumbs.
  personality: Krevaaki are wise, spiritual beings with a deep understanding of the Force. Through meditation,
    they learn to refocus their negative emotions and are rarely moved to anger or violence. They prefer
    to resolve conflicts peacefully—and with- out drawing too much attention to themselves. They seek
    wisdom through exploration and show little interest in money, glory, or personal power.
- name: Krish
  pdf_page: 93
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, -2 Intelligence, -2 Wisdom.
  - name: Medium-size
    text: As Medium-size creatures, Krish have no special modifiers due to their size.
  - name: Speed
    text: Krish base speed is 10 meters.
  - name: Easily Distracted
    text: Krish must succeed at a Will save (DC 10) to stay focused on the task at hand when the opportunity
      to solve a puzzle, play a game, or observe a contest presents itself. The GM can modify the DC depending
      on the urgency of the Krish’s current business and the allure of the new prospect or distraction.
      If the Krish fails the save, he is dazed for | round (can't take actions but can defend normally).
      After that, the Krish can act normally but only participates in combat if threatened or attacked.
  - name: Skill Bonus
    text: Krish gain a +2 species bonus on Gamble checks.
  - name: Bonus Feat
    text: 'Krish gain one of the following feats as a bonus feat: Athletic, Gearhead, Headstrong, Stealthy,
      Toughness, Track, Weapon Group Proficiency (any one).'
  - name: Free Language Skills
    text: Read/Write and Speak Krish.
  adventurers: Krish adore new challenges, and their short attention spans make them notoriously unreliable
    as cohorts and business partners. Krish heroes usually begin as soldiers and scouts. Bounty hunters,
    crime lords, and starship aces are also common. Force-users among the Krish are exceed- ingly rare,
    and even fewer have the disposition to become Jedi.
  example_names: Endelor Darvat, Gargalon, Tyro Viveca, Ligg Panat.
  language: The Krish language consists of grunts, bellows, and gruff vocalizations. Written Krish is
    a puzzling hodge-podge of alphabets combined into words with as few syllables as possible.
  homeworld: Sanza, a temperate Mid Rim world. Any habitable land that is not needed to grow food, manufacture
    necessary goods, or otherwise support the indigenous population plays host to arenas, race tracks,
    casinos, and other entertainment-driven enterprises.
  physical_description: Krish have muscular bodies, flat noses, stringy black hair, and wide mouths filled
    with rows of small, pointy teeth. The average Krish stands about 1.75 meters tall.
  personality: Krish look for ways to focus their natural aggression. They love to play games and solve
    convoluted puzzles, and they watch just about every sport in the galaxy. Highly competitive, they
    prefer a challenge to “an easy kill” (a common Krish metaphor for any sort of mismatch). For instance,
    a Krish bounty hunter will give weak quarry every conceivable advantage to keep the hunt challenging.
- name: Kubaz
  pdf_page: 94
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Strength, +2 Dexterity.
  - name: Medium-size
    text: As Medium-size creatures, Kubaz have no special modifiers due to their size.
  - name: Speed
    text: Kubaz base speed is 10 meters.
  - name: Light Sensitivity
    text: Kubaz suffer a penalty on attack rolls, skill checks, and ability checks made when not wearing
      protective eye goggles. The penalty is —4 in normal light (such as daylight) and —2 in dim light
      (such as candlelight). A Kubaz exposed to intense light without protective eye goggles is blinded
      for 2d6 hours (see the Character Condition Summary in Chapter Twelve of the Star Wars Roleplaying
      Game).
  - name: Skill Bonus
    text: Kubaz build elaborate networks of contacts to help them gather intelligence and acquire other
      useful information. They gain a +2 species bonus on Gather Information checks.
  - name: Free Language Skills
    text: 'Read/Write and Speak Kubazi. Kubaz Gommoner:; Init +1; Defense 11 (+1 Dex); Spd 10 m: VP/WP
      0/10; Atk -1 melee (1d3-1, unarmed strike) or +1 ranged; SQ Species traits; SV Fort +0, Ref +1,
      Will +0; SZ M; FP 0: DSP 0; Rep +0; Str 8, Dex 12, Con 10, Int 10, Wis 10, Cha 10. Challenge Code
      A. Equipment: Protective eye goggles, variety of personal belongings. Skills: Gather Information
      +2, Knowledge (any one) +2, Profession (any one) +1, Read/Write Kubazi, ‘Speak Basic, Speak Kubazi.
      Feats: None. Kushiban Kushibans are often mistaken for pets or vermin, when in fact they are an
      intelligent race with a complex, peaceful society. Kushibans have little need for tools or technology
      on their homeworld, where they manage to live in almost complete harmony with their natural environ-
      ment. Although preyed upon by large predators, Kushibans typically use fire to keep them at bay.
      As herbivores, they do not need tools for hunting or preparing food. As they eat most of their food
      uncooked, they have little use for cooking utensils or similar items. When Kushibans need shelter
      from the elements, simple caves or tree hollows suffice. Consequently, Kushibans have little value
      to a spacefaring economy and little desire to leave their homeworld. Kushibans have a unique method
      of expressing their feelings: Their normally white fur changes color with their emotional state.
      This “mood fur” can go completely black when the creature is in deep despair. Personality: Kushibans
      are generous, gentle beings with a playful (usually wry) sense of humor. However, they can be vindictive
      and downright vicious when angered or betrayed. They have a low tolerance for bullies, simpletons,
      and misanthropes. Physical Description: Kushibans are 0.5-meter- long lagomorphic creatures with
      soft white fur, floppy ears, front paws that can be used as hands, small keen noses, and large,
      innocent-looking eyes. They can move as either quadrupeds or bipeds, though they must drop to all
      fours to charge or run. Homeworld: Kushibah, a lush and unindustrialized planet in the Outer Rim.
      Language: Kushibans speak and read Kushiban. Example Names: Asani, Cerlyk, Etyk, Ikrit, Mabbik,
      Mirax, Pritsi, Sibble, Tieko, Widdimur. Age in Years: Child 1-5; young adult 6-12; adult 13-59;
      middle age 60-84; old 85-109; venerable 110+. Adventurers: Most Kushibans are content to remain
      on their homeworld. Only a few Kushiban scholars, explorers, and Jedi make prolonged trips across
      the galaxy.'
  adventurers: Kubaz adventurers are usually fringers, nobles, scoundrels, and scouts. Kubaz Force- users
    are exceedingly rare.
  example_names: Garindan, Lorindan, Shuzz, Tawar Va'ran, Thwim, Totolaya, Zubindi Ebsuk.
  language: Kubaz speak and read Kubazi, but they learn other languages quickly. When they speak Basic,
    they do so with a curious nasal sound.
  homeworld: Kubindi, a planet in the Ku'Bakai system, located in the Outter Rim.
  physical_description: The Kubaz have rough- textured green-black skin and bristly hair that grows from
    the top of their heads. Their eyes are very sensi- tive to red wavelengths of light; when away from
    their homeworld, they must wear protective lenses. The most striking feature of a Kubaz’s face is
    its short prehensile trunk. Adult Kubaz stand between 1.7 and 2 meters tall.
  personality: Kubaz are social beings who like to Know everything that’s happening around them. They
    are honest, forthright, persistent, and tenacious in their dealings with other species, sometimes
    to a fault. Due to their interest in art and information gathering, Kubaz occasionally become embroiled
    in shady operations such as art smuggling and spying. Like their mistreatment of insectoid beings,
    the Kubaz do
