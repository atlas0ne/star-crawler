- name: Clawdite
  pdf_page: 40
  canon: legends
  traits:
  - name: Speed
    text: Clawdite base speed is 10 meters.
  - name: Shapeshift
    text: A Clawdite can alter his or her appearance to appear as a member of another Medium-size humanoid
      species. Changing appearance is a full-round action and grants a +10 species bonus on Disguise checks.
      A Clawdite gains none of the special qualities or species traits of the mimicked species, but the
      effect lasts as long as the Clawdite wishes. Whenever a Clawdite changes form to appear as any species
      other than Clawdite, he or she must succeed at a Fortitude save (DC 12) or suffer 1 point of temporary
      Constitution damage immediately after the transformation. A Clawdite can reduce the. transformation
      time to a move action, but doing so raises the save DC to 18. A Clawdite cannot create or conceal
      heavy clothing as part of the transformation and immediately reverts to his or her natural form
      when stunned, fatigued, exhausted, unconscious, dying. or dead. ;
  - name: Free Language Skills
    text: Read/Write and Speak Clawdite.
  adventurers: Clawdite adventurers can be members of any class, though their outsider natures are best
    suited for fringer, scoundrel, scout, or bounty hunter classes. A Clawdite Jedi is possible but unlikely.
    Clawdites strong in the Force are more likely to become Force adepts.
  example_names: Zam Wesell, Eru Massest, Prit Kesso, Pessk Maseel, Zapes Orn.
  language: Clawdites speak and read their own language. The spoken language consists of hissing sibilants
    punctuated by guttural croaks.
  homeworld: Zolan, a nondescript planet | located in the Mid Rim.
  physical_description: Clawdites are reptilian humanoids with rough skin that varies in color from yellow
    to green. Adults stand 1.5 to 2 meters tall.
  personality: Clawdites are quiet loners who avoid others except when it serves to advance their own
    agendas. Clawdites view the universe with detached pragmatism. Driven by self-interest and wary of
    betrayal, they do not form friendships easily and have trouble understanding the concepts of loyalty
    and devotion.
