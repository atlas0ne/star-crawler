    which serves them well enough when they travel throughout the galaxy.
  homeworld: Glee Anselm, a planet of vast swamps, lakes, and seas located in the Mid Rim.
  physical_description: Nautolans are amphibious humanoids with mottled green skin and sharklike eyes.
    Instead of hair, a Nautolan sports a crown of long green tendrils. The Nautolan skeletal structure
