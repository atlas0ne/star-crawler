    The latter is a bonus language for Toydarians, who have a long tradition of commerce with the Hutts,
  homeworld: The murky Mid Rim world of Toydaria, located within the borders of Hutt Space.
  physical_description: A Toydarian is a short, pot- bellied humanoid with large eyes, a broad mouth flanked
    by small tusks, thin arms, and spindly legs that end in webbed feet. Skin tones range from blue to
    green to pink. Small, rapidly fluttering wings sprout from the Toydarian’s back. Toydarian males often
    grow sparse beards. Adults stand between 0.9 meters and 1.5 meters tall.
  personality: Shrewd bargainers, Toydarians like to socialize and strike deals. The best of them is proud,
    loyal, and business-savvy; the worst of them is greedy, deceitful, and sycophantic. Toydarians like
    to gamble, and more daring Toydarian traders will make difficult business decisions based on the roll
    of a chance cube.
- name: Trandoshan
  pdf_page: 168
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, -2 Dexterity.
  - name: Medium-size
    text: As Medium-size creatures, Trandoshans have no special modifiers due to their size.
  - name: Speed
    text: Trandoshan base speed is 10 meters.
  - name: Natural Armor
