- name: Ortolan
  pdf_page: 119
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Dexterity, +2 Constitution.
  - name: Small
    text: As Small creatures, Ortolans gain a +1 size bonus to their Defense, a +1 size bonus on attack
      rolls, and a +4 size bonus on Hide checks. They must use smaller weapons than Medium- size beings
      use, and their lifting and carrying limits are three-quarters those of Medium-size characters.
  - name: Speed
    text: Ortolan base speed is 6 meters.
  - name: Keen Smell
    text: Ortolans have a keen sense of smell. An Ortolan with the Track feat receives a +4 species bonus
      on Survival checks when tracking a subject within 2 kilometers of his current location.
  - name: Intestinal Fortitude
    text: Ortolans gain a +2 bonus on Fortitude saves against ingested poisons.
  - name: Skill Bonus
    text: Ortolans receive a +4 species bonus on Survival checks when foraging for food.
  - name: Free Language Skills
    text: Read/Write and Speak Ortolan.
  adventurers: Ortolans are quite happy to leave their homeworld when the opportunity presents itself.
    Ortolan adventurers gravitate toward the fringer and scoundrel classes, although they are not restricted
  example_names: Bedo, Eembek, Miebar, Nabkess, Ooben, Rebo, Ruznee, Ydde.
  language: Ortolans speak their own language, the spoken form of which consists of grunts, hoots, and
    words comprised of one hard and one soft syllable. Ortolans also speak Basic with ease.
  homeworld: Orto, a frozen wasteland located in the Outer Rim. The planet has a short and unpre- dictable
    growing season, and famines are common.
  physical_description: Ortolans have floppy ears, beady black eyes, long trunklike noses, and small mouths.
    Each hand ends in four stubby fingers tipped with suction pads, and their short legs have poorly articulated
    joints that cause them to waddle when they walk. A thick, baggy hide covered with short, velvetlike
    blue fur hangs off their chubby bodies. Ortolan adults stand between 1.1 and 1.7 meters tall.
  personality: Ortolans are generally happy if they are well fed. They also take great joy in music of
    all sorts, as their highly developed sense of hearing can pick up sounds that few other beings can
    hear, making every live performance or different recording of even the most familiar tunes a new experience
    for an Ortolan.
