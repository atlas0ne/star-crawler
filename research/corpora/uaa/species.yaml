  - name: Bonus Feats
    text: Ubese gain the bonus feats Armor Proficiency (light) and Gearhead.
  - name: Free Language Skills
    text: Read/Write and Speak Ubese, and Speak Ubeninal (Ubese sign language).
  adventurers: “True” Ubese adventurers are fringers, scouts, or soldiers. Yrak pootzck adventurers can
    belong to any non-Jedi class. Force adepts exist among both kinds of Ubese.
  example_names: Arcuse, Boushh, Dusorra, Jorsu’un, Ourulos, Savax, Su’Suv, Wurran, Zo”’Tannath.
  language: Ubese have their own language (Ubese); however, their vocal cords do not produce speech above
    a rasping whisper sound, so they use a highly refined form of sign language (Ubeninal) when communicating
    with other Ubese. Although most Ubese understand Basic, they rarely deign to speak it.
  homeworld: Uba Ill, located in the Mid Rim Territories, Following the destruction of Uba Ill during
    the time of the Old Republic, Ubese can be found on Uba IV (a radioactive and inhospitable world)
    or scat- tered throughout other star systems.
  physical_description: Ubese have slight builds, appearing almost frail. They tend to have fair skin
    and dark hair, with eye colors of brilliant green or blue. They have no body or facial hair. Their
    facial structure tends to be narrow, with high cheekbones and eyes that appear much too large for
    their faces. Males and females of the species both stand roughly the same height, with males being
    only slightly heavier of b
  personality: The hatred that the yrak pootzck and “true” Ubese share for other species unites them.
    They typically make their living as mercenaries, bounty hunters, slavers, or assassins—professions
    where they get to vent their hatred without fear of retribution. Although they take great pains to
    conceal their true appearance, the Ubese do not bother to hide their vindictive dispositions.
