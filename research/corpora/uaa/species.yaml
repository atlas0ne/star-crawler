  - name: Medium-size
    text: As Medium-size creatures, Vratix have no special modifiers due to their size.
  - name: Speed
    text: Vratix base speed is 10 meters.
  - name: Natural Armor
    text: A Vratix’s carapace provides a +2 natural armor bonus to Defense.
  - name: Quadrupedal
    text: 'A Vratix has four legs and gains a +4 stability bonus to resist bantha rushes: and trip attacks.'
  - name: Produce Bacta
    text: Vratix are intimately familiar wie the process | for Ge) bact sing the plant
  - name: Skill Bonus
    text: Vratix gain a +4 species bonus on Jump checks and Listen checks.
  - name: Free Language Skills
    text: Read/Write and Speak Vratix.
  adventurers: Vratix adventurers are usually tech specialists who earn their keep as engineers or medics,
    although members of the species are = Hot restricted from any heroic class.
  example_names: All Vratix have two names. The first is their hive name, the second a given name.
  language: Vratix speak their own high-pitched language, which is punctuated with clicking sounds and
    skin color changes. Other species can learn to understand the Vratix language (by spending a skill
    point on the Speak Vratix skill) but cannot speak it. Since the Vratix trade extensively with other
    species, many Vratix learn to speak Basic as well,
  homeworld: Thyferra, a temperate world with two moons located in the Inner Rim. Mast Vratix live in
    modest rain-forest villages consisting of high towers with circular terraces and arching bridges connecting
    them.
  physical_description: 'A Vratix has large compound eyes, a stalklike neck, and six limbs sprout- ing
    from a cylindrical thorax and abdomen. Two triple-jointed arms extend from the shoulders, ending in
    long, three-fingered hands. Vratix stand upright on four legs. The rearmost pair are well muscled
    and used for jumping. Their triangular heads sport two floppy antennae. Small, thin hairs cover a
    Vratix’s body and exude a '
  personality: Practical and analytical, Vratix have trouble understanding art, music, and other forms
    of creative expression. They act cautiously, never rushing into situations without due consideration
    of the consequences. Because of their knowledge of bacta, Vratix are natural healers. However, most
    lack the compassion to view the healing process as anything more than a biological exercise.
- name: Vuvrian
  pdf_page: 182
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Strength, +2 Intelligence, +2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Vuvrians have no special modifiers due to their size.
  - name: Speed
    text: Vuvrian base speed is 10 meters.
  - name: Pain Sensitivity
    text: 'Vuvrians do not deal well with pain. They suffer a -1 penalty on all Fortitude saves. Whenever
      they take wound damage, they must succeed at a Will save (DC 12) or be stunned for | round. Middle-aged
      Vuvrians gain a +2 bonus on the Will save, while old and venerable Vuvrians gain a +4 bonus on the
