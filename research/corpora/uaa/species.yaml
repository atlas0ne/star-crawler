      and Stun/Fart DC: — Multifire /Autofire: M UW SOUWU Li ie —-, ~~ iii Dug The Dugs are a species
      of small arboreal creatures with a well-deserved reputation for unnecessary brutality and extreme
      mean-spiritedness. Evolving in the tops of trees on their high-gravity world of Malastare has made
      them both agile and strong. Few Dugs have any desire to leave Malastare, preferring instead to remain
      on their home planet, where they struggle to keep control of their native lands on the world’s western
      continent. Dugs view themselves as embattled warriors, always fighting for what is rightfully theirs,
      but always being beaten back by just about everyone else in the galaxy. Their first contact with
      aliens occurred when the Gran established a colony on Malastare, triggering a long and brutal war.
      The Republic settled the dispute in favor of the Gran, pushing the Dugs to the political and economic
      fringes of their own world. This was but the first in a long string of clashes with aliens. The
      Dugs responded by pitying themselves, yet in return, the rest of the galaxy just felt more disgust
      and disappointment. Knowing that no one else wants to have anything to do with them, the Dugs have
      developed an openly self-congratulatory culture. Every Dug claims an ancestry that includes legendary
      heroes and patriots. Personality: Dugs are adversarial, derogatory, self- ish, bullying, and temperamental—especially
