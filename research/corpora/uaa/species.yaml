    Toong stand between 1.6 and 2.4 meters tall.
  personality: Toong exhibit extreme nervousness in social situations. They invariably give in whenever
    challenged vocally or physically, particularly when facing non-Toong. A typical Toong feels safe only
    with his or her immediate family. This has caused most other species to view the Toong as cowards,
    but they do not fear combat and other dangerous situa- tions. Rather, they dread face-to-face interaction
    with
- name: Toydarian
  pdf_page: 166
  canon: legends
  traits:
  - name: Ability Modifiers
    text: —4 Strength, +4 Dexterity, ~2 Constitution.
