  - name: Damage Reduction
    text: Psadans have thick, lumpy, shell-like plates covering their bodies. A Psadan’s armored shell
      provides DR 3, which stacks with damage reduction provided by manufactured armor.
  - name: Obstinate
    text: Psadans receive a +1 species bonus on Will saving throws.
  - name: Primitive
    text: Psadans with heroic or professional classes receive the bonus feat Weapon Group Proficiency
      (primitive weapons) instead of the usual Weapon Group Proficiency bonus feats.
  - name: Free Language Skills
