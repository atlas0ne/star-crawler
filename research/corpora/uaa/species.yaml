  - name: Xenophobic
    text: Shistavanens have trouble maintain- ing civil dealings with other species. They take a -4 penalty
      on Diplomacy or Charisma checks made to improve the attitudes of members of other species. Likewise,
      they impose a -4 penalty on other species’ attempts to improve Shistavanen attitudes toward them.
  - name: Low-Light Vision
    text: Shistavanens can see twice as far as normal in dim light (such as moonlight or underwater).
      They retain the ability to distinguish color and detail under these conditions.
  - name: Bonus Feats
    text: Shistavanens gain the bonus feats Alertness and Improved Initiative.
  - name: Free Language Skills
    text: 'Read/Write and Speak Shistavanien. Shistavanen Gommoner: Init +5 (+1 Dex, +4 Im- proved Initiative);
      Defense 11 (+1 Dex); Spd 10 m; VP/WP. 0/10; Atk +0 melee (1d3, unarmed strike) or +1 ranged; SQ
      Species traits; SV Fort +0, Ref +1, Will +0; SZ Mi; FP 0; DSP. 0; Rep +0; Str 10, Dex 12, Con 10,
      Int 8, Wis 10, Cha 8. Challenge Code A. Equipment: Variety of personal belongings. Skills: Craft
      (any one) +1 or Knowledge (any one) +1 or Profession (any one) +2, Listen +2, Read/Write Shistavanen,
      Speak Basic, Speak Shistavanen, Spot +2. Feats: Alertness, Improved Initiative. Skakoan Skakoans
      are a technologically advanced species that specializes in microelectronics, starship engineering,
      and cutting-edge manufacturing techniques. During the time of the Old Republic, Skakoans were among
      the most influential species in the Techno Union, a galaxy-spanning consortium of megacorpo- rations
      with representation in the Galactic Senate. Despite the misgivings of other high-ranking members
      of the Techno Union, Skakoan foreman Wat Tambor pledged to support the Separatists under Count Dooku.
      The Senate responded by expelling their Techno Union representatives. This contributed to the Skakoan
      homeworld breaking away from the Republic and joining the Separatist Movement. The Skakoans were
      central to the Techno Union’s success throughout the Clone Wars. However, the days of the Techno
      Union were numbered. From the ashes of the Old Republic emerged the Empire and with it, the Emperor''s
      New Order. Gluttonous, self-serving bureaucracies like the Techno Union, the Commerce Guild, and
      the Trade Federation had outlived their usefulness, and their non-Human overseers were not to be
      trusted under the new regime. Humans forcibly displaced the Techno Union’s Skakoan membership. The
      Skakoan people could do nothing except with- draw to their homeworld and watch helplessly as the
      Empire dismantled the Techno Union and placed its constituent companies {among them Baktoid Armor
      Workshop, Hoersch-Kessel Driveworks Inc., and Balmorran Arms) under Imperial supervision. The fall
      of the Empire and the birth of the New Republic failed to overcome the Skakoans’ growing sense of
      isolation. Their dislike for humanity clouded their infrequent dealings with the New Republic, and
      they are less inclined to share their technological advances. During The New Jedi Order era, the
      Skakoans are viewed by most other species as secretive, manipulative xenophobes best left to their
      own devices. The Skakoan homeworld has a unique and highly pressurized atmosphere. For this reason,
      Skakoans can only survive in standard atmospheres with the aid of a special pressure suit. The Skakoan
      pressure suit completely hides the wearer’s face and figure. If the suit is ruptured or destroyed,
      its Skakoan occupant cannot survive for long. Personality: Skakoans are cool, calculating, and humorless
      beings with a strong sense of self-preserva- tion. Few have the courage to leave their homeworld.
      They rely on logic to solve problems, regardless of whether they are plotting a galactic war or
      designing an efficient hyperdrive. Skakoans are usually encoun- tered wearing their pressure suits,
      which they use to hide their emotions, leading many other species to presume that Skakoans are heartless
      automatons. In truth, they possess a full range of emotions. Physical Description: Visitors are
      generally not welcome on the Skakoan homeworld; consequently, non-Skakoans have yet to learn what
      a Skakoan looks like beneath the full-body pressure suit. Without the pressure suit, a Skakoan resembles
      a gaunt Human with folds of sickly gray-white skin draped over a narrow, skeletal frame. A Skakoan''s
      leering visage features dark, sunken eyes, a flat nose, and a tooth- less, slitlike mouth set in
      a perpetual frown. Skakoan pressure suits come equipped with synthe- sized vocalizers that deliberately
      distort their wearers’ speech patterns, adding to the species’ mystique. Skakoan adults stand 1.4
      to 2.1 meters tall. Homeworld: Located in the Core Worlds region, Skako is a planetwide metropolis
      comparable to Coruscant in scale and population, but without the charm or aesthetically pleasing
      architecture. Species accustomed to standard atmospheric pressure can only withstand the dense pressure
      of Skako’s atmos- phere for a short time before suffering permanent injury. The same holds true
      for Skakoans who find themselves on standard-pressure worlds without a special pressure suit to
      protect them. Language: Skakoverbal is a complex machine language similar to Bocce, with traces
      of Binary. Skakoform, the written language of the Skakoan people, is often mistaken for technical
      schematics or circuit diagrams. Example Names: Zona Dreon, Pel Karmek, Girt Marko, Orna Meng, Vol
      Meybor, Madeca Rex, Wat Tambor, Gegon Valt, Taron Von. Age in Years: Child 1-11; young adult 12-15;
      adult 16-44; middle age 45-59; old 60-69; venerable 70+. Adventurers: Skakoans are deathly afraid
      of suffering a horrible death by asphyxiation or explo- sive decompression. They rarely leave Skako
      for this reason. When they do, they always wear pressure suits that fully conceal their features
      and use vocaliz- ers that distort their voices. Skakoans encountered away from their homeworld are
      usually nobles and tech specialists. No Skakoan Force-users are known to exist.'
  adventurers: Some Shistavanens overcome their xenophobia and strike out into the galaxy at large to
    engage in a wide range of professions. Many take advantage of their superior speed and reflexes and
    become pilots, bodyguards, mercenaries, bounty hunters, crime lords, or even big-game hunters. While
    they favor the scoundrel, scout, and soldier classes, Shistavanens can belong to any non-Jedi heroic
    class.
  example_names: Mar Balayan, Mal Biron, Kal Lup, Tar Lup, Shaalir Resh, Sirul Rosk, Riv Shiel, Caet Shrovl,
    Lak Sivrak.
  language: Shistavanens speak their own language, which consists mostly of loud barks and growls. Since
    the rise of the Empire, many Shistavanens have also leamed to speak Basic.
  physical_description: Adult Shistavanens stand between 1.3 and 1.9 meters tall, and males tend to be
    taller and more powerfully built than females. Their _ bodies are covered with thick brown or black
    fur, their ears are set high on their heads, and they have pronounced snouts with large fangs.
  personality: Shistavanens are aggressive and forthright. They prefer the company of their own kind to
    other species and are known (and often feared) for their surly demeanor, domineering behavior, and
    ill temperament. Some Shistavanens are more outgoing and sociable, although few are capable of shedding
    all of their cultural prejudices.
