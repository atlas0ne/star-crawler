  - name: Telepathy
    text: As a move action, a Shi'ido can broad- cast a telepathic impression to any number of intelligent
      creatures up to 100 meters away each round. Each creature that fails a Will save (DC =5 + one-half
      the Shi'ido’s character level + the Shi'ido's Charisma modifier) suffers a -4 penalty on Spot checks
      to penetrate the Shi'ido’s disquise.
  - name: Shapeshift
    text: Shi'ido can change the shape, texture, and coloration of their bodies to mimic other Medium-sized
      humanoid species (and any cloth- ing worn). A Shi'ido gains none of the special qualities or species
      traits of the mimicked species, but the effect lasts as long as the Shi'ido wishes. A $Shi'ide does
      not immediately revert to its natu- tal form if stunned, fatiqued, exhausted, unconscious, dying,
      or dead. The “skinshifting” ability of a Shi’ido improves with age. Middle-aged and older Shi'ido
      can assume the form of any Small to Large alien species or creature. They can even make themselves
      look like Medium-size or Large inanimate objects. > SHISTAVANEN Changing appearance is a full-round
      action and grants a +10 species bonus on Disguise checks.
