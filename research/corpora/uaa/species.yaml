      All Temolaks gain a +2 species bonus on Fortitude saves,
  - name: Free Language Skills
    text: Read/Write and Speak Temolish.
  adventurers: Temolak adventurers can belong to any heroic class but are typically fringers, scouts,
    or tech specialists.
  example_names: Chaiza, Durakas, Eskavon, Kurun, Luzura, Orborus, Shalunask, Unkave,
