- name: Lepi
  pdf_page: 97
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Strength, +2 Dexterity.
  - name: Medium-size
    text: As Medium-size creatures, Lepi have no special modifiers due to their size.
  - name: Speed
    text: Lepi base speed is 10 meters.
  - name: Natural Weapon
    text: A Lepi can kick as many times in a round as he has attacks. The kick deals 1d4 points of bludgeoning
      damage plus the Lepi’s Strength modifier. The Lepi’s kick attack does not provoke attacks of opportunity.
  - name: Skill Bonuses
    text: Lepi gain a +8 species bonus on Jump checks and a +2 species bonus on Listen checks.
  - name: Bonus Feat
    text: Lepi receive the bonus feat Weapon Finesse (kick).
  - name: Free Language Skills
    text: Read/Write and Speak Lepi.
  adventurers: Lepi adventurers tend to be fringers, scouts, and tech specialists. More aggressive and
    dominant Lepi can be soldiers, and a few even have the wherewithal to become Jedi.
  example_names: Augdon, Gagen, Javilla, Jaxxon, Lupher, Maximort, Nevlin, Roonis, Saper, Zylo.
  language: Lepi speak and read Lepese.
  homeworld: Coachelle Prime, located in the Mid Rim system of Coachelle.
  physical_description: Lepi are bipedal lago- morphs with large incisors, long ears, lanky frames, and
    big feet. Lepi are covered in short fur that varies in color from green to dark blue. Adult males
    aver- age 1.9 meters tall, while adult females average 1.6 meters tall.
  personality: Lepi are proud and closely tied to their large families. They are quick-witted, gregari-
    ous, and often quite humorous, but they anger easily and do not abide insults to their families or
    to their species.
- name: Menahuun
  pdf_page: 97
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Strength, +2 Dexterity, -2 Constitution, +2 Wisdom, —2 Charisma.
  - name: Small
    text: As Small creatures, Menahuun gain a +1 size bonus to their Defense, a +1 size bonus on attack
      rolls, and a +4 size bonus on Hide checks. They must use smaller weapons than Medium- size beings
      use, and their lifting and carrying limits are three-quarters those of Medium-size characters.
  - name: Speed
    text: Menahuun base speed is 6 meters.
  - name: Primitive
    text: 'Menahuun with heroic or professional classes receive the bonus feat Weapon Group Proficiency
      (primitive weapons) instead of the usual Weapon Group Proficiency bonus feats. 6 Skill Bonuses:
      Menahuun gain a +4 species bonus on Climb checks and a +2 species bonus on Survival checks.'
  - name: Bonus Feat
    text: Menahuun receive the bonus feat Alertness.
  - name: Free Language Skills
    text: Read/Write and Speak Menahu.
  adventurers: Some Menahuun express the desire to explore the stars. Menahuun adventurers are typi- cally
    fringers, nobles, scouts, soldiers, or Force adepts. Few Menahuun have the technical expertise to
    be tech specialists. There are no examples of Menahuun becoming Jedi.
  example_names: Chylla, Eeytch, Henecho, Keychu, Suka, Teetch, T’kol, Uucheyek.
  language: Menahuun speak and read Menahu.
  homeworld: Lamaredd, a largely untamed world in the Lamaro system in the Outer Rim.
  physical_description: The typical Menahuun stands 1.2 meters tall on wiry legs made for running and
    climbing. Like many arboreal mammals, the Menahuun have feet with opposable digits. Large black eyes
    give the Menahuun keen vision. Menahuun are covered with short, wiry fur ranging in color from rust
    to olive green.
  personality: Menahuun are brave and cunning, capable of setting complex traps. They regard other sentient
    species visiting Lamaredd as unwanted tres- passers and have taken a liking to resolving conflicts
    by force—either through duels or all-out war.
- name: Miraluka
  pdf_page: 98
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Dexterity, +2 Intelligence.
  - name: Medium-size
    text: As Medium-size creatures, Miraluka have no special modifiers due to their size.
  - name: Speed
    text: Miraluka base speed is 10 meters.
  - name: Quick Reaction
    text: Despite their general lack of coordination, a Miraluka’s reaction speed is supe- rior to that
      of most other species. Miraluka gain a +2 species bonus on initiative checks.
  - name: Force Sight
    text: Miraluka are blind to all wavelengths of light. However, their ability to see through the Force
      allows them to sense their surroundings as though they could see normally, allowing them to attack
      and make skill checks without suffering penalties for blindness. Using Force sight is a free action
      and costs a Miraluka no vitality points.
  - name: Bonus Feats
    text: Miraluka gain the bonus feat Force- Sensitive. A Miraluka who takes his or her first level in
      a Force-using class (Force adept, Jedi consular, or Jedi guardian) also gains the bonus feat Sense.
  - name: Free Language Skills
    text: Read/Write and Speak Miralukese.
  adventurers: Miraluka adventurers suffer no class restrictions but are usually nobles, Force adepts,
    Jedi consulars, and Jedi guardians.
  example_names: Damaya Guru, Eloun Kooladi, Embrul Joff, Shoaneb Culu, Zebron Tadro.
