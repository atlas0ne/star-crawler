      gain a +4 species bonus on Spot checks.'
  - name: Bonus Feats
    text: Vuvrians gain the bonus feat Trustworthy. Vuvrians with the Force-Sensitive and Sense feats
      gain the bonus feat Aware.
  - name: Free Language Skills
    text: Read/Write and Speak Vuvrian.
  adventurers: Vuvrian adventurers are typically nobles, scoundrels, or scouts. Given the species’ low
    pain threshold, Vuvrians make poor soldiers. Force- strong Vuvrians often become Force adepts or Jedi
    consulars.
  example_names: Cimilak, Gwent, Kirrewa, Mylthea, Nilzilun, Scrin, Swiegel, Weelax, Wioslea.
  language: Vuvrians have their own language, and most learn to speak Basic as well.
  homeworld: Vurdon Ka, a pleasant Inner Rim world covered in mosses and primitive plants, The wind is
    hardly ever stronger than a breeze, the temperatures remain within a 15-degree band, no biting insects
    exist, and the light of the sun is filtered by a heavy could layer that casts the world in a state
    of perpetual twilight.
  physical_description: Vuvrians are a humanoid species with oblong-shaped insectoid heads, twelve eyes,
    and two antennae. Male and female Vuvrians both stand around 2 meters tall, with females of the species
    displaying slightly lighter builds and somewhat more oblong-shaped heads. They often wear thick, hooded
    robes to minimize their exposure to alien environments and forestall the lack of sensation that comes
    upon them
  personality: 'Vuvrians are cordial, inquisitive, and diplomatic. Although many beings find the physical
    appearance of Vuvrians disturbing, many of their kind have been counted among the greatest sales-beings,
    negotiators, peace brokers, and first-contact special- ists in the galaxy. It is hard to resist the
    outgoing personality of Vuvrians, and when they couple it with skilled oratory and logical arguments,
    it '
- name: Weequay
  pdf_page: 183
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, +2 Constitution, -2 Intelligence, -2 Wisdom, -4 Charisma.
  - name: Medium-size
    text: 'As Medium-size creatures, Weequay have no special modifiers due to their size. :'
  - name: Speed
    text: Weequay base speed is 10 meters.
  - name: Pheromonal Communication
    text: Weequay can communicate silently with other members of their tribe by creating a scent that
      other Weequay (and any creature or being with the scent ability, such as a Whiphid or Yuzzem) can
      detect, though only members of the “speaker's” clan can understand it. This communication scent
      can be detected from 20 meters away (40 meters upwind or 10 meters downwind).
  - name: Free Language Skills
    text: Read/Write and Speak Sriluurian.
  adventurers: Individual Weequay who leave Sriluur find work hard to come by. Groups of Weequay are often
    sought after for their tight-lipped attitude and excellent teamwork; the Hutts employ them for these
    reasons.
  example_names: Weequay lack individual names. Other species sometimes give them names (or nick- names).
    Sample names include Adazian Liebke, Ak-buz, Ak-rev, Diergu-Rea Duhnes’rd, Fyg, Grimorg, Labansat,
    Nort Toom, Plaan, Que-Mars Redath-Gom, Solum’ke, Sora Bulg, and Tas Kee,
  language: Weequay mainly communicate through a complex series of pheromones. Only members of the same
    tribe can understand each other's pheromones. To communicate between tribes, Weequay speak Sriluurian,
    a language of subdued whispers and guttural mumbles. Written Srituurian uses hieroglyph- ics to communicate
    simple ideas.
  homeworld: Sriluur, a semi-arid world on the periphery of Hutt Space in the Outer Rim. Weequay originally
    roamed the deserts of Sriluur to avoid predators. As their technology advanced to an indus- trial
    level, makeshift cities began to form near the ocean shores. These cities provided much-needed protection
    from Sriluur’s predators and access to its bountiful seas.
  physical_description: Humanoid, with leathery skin, a flat nose, lipless mouth and a bony frill along
    each jowl, the average Weequay stands about 1.7 meters tall. Male Weequay have one or more long dark
    braids of hair collected into a topknot. Female Weequay are completely bald.
  personality: Weequay are brooding, superstitious beings prone to violence. Weequay lack individual names,
    referring to themselves simply as “Weequay,” though they will answer to names given to them by others
    they trust. They rarely talk, even among their own kind,
- name: Whiphid
  pdf_page: 184
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, +2 Constitution, ~2 Intelligence, -2 Charisma.
  - name: Large
    text: As Large creatures, Whiphids take a ~1 size penalty to their Defense, a -1 size penalty on attack
      rolls, and a —4 size penalty on Hide checks. They have a Face/Reach of 2m by 2 m/4 m. Their lifting
      and carrying limits are triple those of Medium-size characters (see Carrying Capacity in the Star
      Wars Roleplaying Game).
  - name: Speed
    text: Whiphid base speed is 10 meters.
  - name: Natural Weapons
    text: A Whiphid can choose to attack with a claw instead of a normal unarmed strike. The claw attack
      deals 1d6 points of slashing damage (plus the Whiphid’s Strength modifier) and does not provoke
      attacks of opportunity.
  - name: Scent
    text: Whiphids can detect creatures within 10 meters by sense of smell, If the source of the scent
      is upwind, the range increases to 20 meters; downwind, it decreases to 6 meters. Strong scents double
      the range, and overpowering scents triple it. See Special Qualities in Chapter Fourteen of the Star
      Wars Roleplaying Game for more infor- mation on the scent ability.
  - name: Insulating Fur
    text: Thanks to their thick fur, Whiphids gain a +4 species bonus on Fortitude saves to resist the
      effects of extreme cold (see Heat and Cold in Chapter Twelve of the Star Wars Roleplaying Game).
  - name: Primitive
    text: Whiphids with professional or heroic classes receive the bonus feats Weapon Group Proficiency
      (primitive weapons) and Weapon Group Proficiency (simple weapons) instead of the usual Weapon Group
      Proficiency feats.
  - name: Free Language Skill
    text: Speak Whiphid.
  adventurers: Once Whiphids learned about the galaxy, they were eager to see it first hand. Although
    primitive, Whiphids quickly learn to use standard items such as blasters and starships. Spacefaring
    Whiphids can be genial but often become criminals, bounty hunters, and high-priced mercenaries.
  example_names: Aiks Fwa, Ch’unkk, D'Whopp, Fillin Ta, Jempa, J’Quille, Jun Seros, K’Kruhk, Mubbin, Nuron
    Gep, Polrowl, Valarian, Waroopa.
  language: Whiphids speak a language of the same name that consists of snorts, growls, and bellowing
    barks. They have no written language.
  homeworld: Toola, located in the Outer Rim’s Kaelta system, has a thin atmosphere and is far from its
    sun for most of its year. It is a frigid tundra world, except during the brief summer when the snow
    melts, vegetation grows, and creatures adapt to the warmer weather.
  physical_description: Whiphids are bulky bipeds with shaggy yellow-white or golden fur. The average
    Whiphid stands 2.5 meters tall and has an elongated snout, two large tusks jutting from the lower
    jaw, and rending claws. (Females tend to be slightly shorter and heavier than the males.) In warmer
    climates, Whiphids look considerably slimmer. Their bodies reduce their fat stores and shed much of
    their coat to avoid over
  personality: Whiphids are natural predators who enjoy the sport of the hunt nearly as much as the thrill
    of making a kill. When dealing with offworlders, Whiphids exhibit pleasant, outgoing personalities.
    They generally know the difference between “friend” and “food,” though some Whiphids have had to leam
    the hard way. Whiphids have few scruples and often let their greed and gluttony get the better of
    them. Ma
- name: Wookiee
  pdf_page: 185
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +4 Strength, -2 Dexterity, —2 Wisdom, —2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Wookiees have ge no special a modifiers due to their size. WHIPHID
      WOOKIEE
  - name: Speed
    text: Wookiee base speed is 10 meters.
  - name: Rage
    text: When necessary, a Wookiee can fly into a rage. In a rage, a Wookiee gains phenomenal strength
      and durability, but becomes reckless and less able to defend himself. A raging Wookiee temporarily
      gains +4 Strength, +2 vitality points per level (+0 for commoners), and a +2 rage bonus on Fortitude
      and Will saves, but suffers a ~2 penalty to Defense. A raging Wookiee cannot use skills or feats
      that require patience and concentration (such as the Climb skill, the Combat Expertise feat, or
      any Force-based skill). The fit of rage lasts for a number of rounds equal to 5 + the Wookiee's
      Constitution modifier, When the rage ends, the Wookiee loses the bonus vitality points gained from
      the rage and is fatiqued (-2 penalty to effective Strength and Dexterity, cannot run or charge)
      for a number of rounds equal to the rage’s duration.
  - name: Extraordinary Recuperation
    text: A Wookiee regains vitality and wound points at twice the normal rate (2 vitality points per
      character level per hour, 2 wound points per day of rest).
  - name: Skill Bonuses
    text: Wookiees gain a +2 species bonus on Climb checks and a +4 species bonus on Intimidate checks.
  - name: Free Language Skills
    text: Read/Write and Speak Shyriiwook, and Speak Basic (understand only). woosTolp
  adventurers: Wookices usually begin their adven- turing careers as wanderers or explorers. They tend
    to bond with fellow adventurers, forming extended honor families. Some even pledge life debts to individuals
    who perform a great service (such as saving a Wookiee's life),
  example_names: Arrikabukk, Attichitcuk, Busurra, Chenlambec, Chewbacca, Dryanta, Frorral, Gaartatha,
  language: Wookiees speak Shyriiwook, which consists of grunts and growls. They can understand Basic
    but cannot speak it due to vocal limitations.
  homeworld: The jungle world of Kashyyyk, located in the Mid Rim. Wookiees build their communities amid
    the crowns and boughs of Kashyyyk’s enormous wroshyr trees.
  physical_description: Large, arboreal humanoids covered in thick fur, Wookiees stand between 2 and 2.3
    meters tall.
  personality: While Wookiees have a well-deserved reputation for hostility (such as pulling arms off
    droids and ears off gundarks), they also possess a great capacity for kindness. Wookiees tend to be
    honorable, rash, loyal, and short-tempered.
- name: Woostoid
  pdf_page: 186
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Strength, +4 Intelligence. G Medium-size; As Medium-size creatures, Woostoids have no special
      modifiers due to their size.
  - name: Speed
    text: Woostoid base speed is 10 meters,
  - name: Pacifism
    text: When faced with a violent encounter, a Woostoid must succeed at a Will save (DC 15) before rolling
      initiative. If the saving throw fails, the character suffers a —1 penalty to Defense and a -1 penalty
      on attack rolls because he or she finds the situation extremely disconcerting. The penalties last
      for the duration of the combat.
  - name: Skill Bonus
    text: Woostoids gain a +2 species bonus on Computer Use checks.
  - name: Free Language Skills
    text: Read/Write and Speak Woostese.
  adventurers: Woostoid adventurers are nobles, scouts, or scoundrels. Woostoids were also common among
    the ranks of Jedi consulars before the Jedi Purge.
  example_names: Wan Akida, Nizu Didarri, Cham Eklou, Bzan Jopol, Shiendi Lomu, Dria Shiko,
  language: Woostoids speak Woostese, a precise language with many different dialects that incorpo- rate
    local idioms. Woostoids dislike abbreviations, contractions, and similar shorthand—their “perfect”
    language has no need for such simplification.
  homeworld: Woostri, an advanced industrial world located in the Expansion Region.
  physical_description: Woostoids have dark orange skin and thick red hair. They have large, bulbous black
    eyes that rarely blink. Traditionally, they wear long flowing robes of shiny, bright-colored materials.
    Adult Woostoids stand between 1.5 and 2 meters tall.
  personality: Woostoids are a peaceful species in the extreme—they find even the concept of warfare frightening.
    Their minds work in such a way that they always think of situations in an orderly manner, trying to
    create logical ties between events. When presented with chaotic situations or facts that have no logical
    pattern, they become confused and disoriented.
- name: Xexto
  pdf_page: 187
  canon: legends
  traits:
  - name: Ability Modifiers
    text: —2 Strength, +4 Dexterity, -2 Constitution.
  - name: Small
    text: As Small creatures, Xexto gain a +1 size bonus to their Defense, a +1 size bonus on attack rolls,
      and a +4 size bonus on Hide checks. They must use smaller weapons than Medium-size beings use, and
      their lifting and carrying limits are three-quarters those of Medium-size characters.
  - name: Speed
    text: Xexto base speed is 6 meters.
  - name: Extra Limbs
    text: Xexto have four arms. The extra limbs give them a +4 species bonus on Climb checks and grapple
      checks {although they take a ~4 size penalty on grapple checks), and they can hold items in each
      of their four hands. A Xexto has one primary hand and three off hands. A Xexto can wield up to four
      weapons, but the normal penalties for fighting with multi- ple weapons apply (see the Multiweapon
      Fighting feat description in the New Feats appendix).
  - name: Bonus Feat
    text: Xexto receive the bonus feat Multidexterity, which reduces the penalties they suffer when wielding
      weapons in both their primary and off hands (see the Multidexterity feat description in the New
      Feats appendix). They ignore the 15 Dexterity prerequisite for this feat.
  - name: Free Language Skills
    text: Read/Write and Speak Xextese.
  adventurers: Xexto adventurers can belong to
  example_names: Billibango, Freon Drevon, Gasgano, Medeon Holovar, Olot Aleego.
  language: Xexto have their own lanquage (Xextese) and typically learn to speak Basic as well.
  homeworld: Troiken, a largely untamed world located in the Outer Rim. Outside of the Xexto cities and
    the few meager starports that stand near the Podracing tracks, Troiken is covered with carnivorous
    flora through which fearsome predators prowl and clouds of meat-eating insects swarm.
  physical_description: Xexto have four arms with six fingers each and two legs with ten toes. Their skin
  personality: The difficult terrain and dangerous predators found on their homeworld have led many Xexto
    to admire and encourage risk-taking. Despite their thrillseeking nature and willingness to take risks,
    Xexto are generally well mannered and even- tempered. Questioning a Xexto’s bravery is one way to
    make him or her angry.
- name: Yarkora
  pdf_page: 188
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Dexterity, +2 Wisdom, +2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Yarkora have no special modifiers due to their size.
  - name: Speed
    text: Yarkora base speed is 10 meters.
  - name: Skill Bonus
    text: Yarkora gain a +4 species bonus on Gather Information checks.
  - name: Bonus Feat
    text: Yarkora gain the bonus feat Persuasive.
  - name: Free Language Skills
    text: Read/Write and Speak Yarkora.
  adventurers: Yarkora have built a reputation as petty thieves and information brokers. So far, no Yarkora
    has come forward to dispel the myths about their species’ behavior or provide even the most basic
    information about their culture. Until one does, or explorers discover their secret homeworld, others
    will continue to perceive the Yarkora as a species of galac- tic scoundrels.
  example_names: Adaka-Vanae, Haesh-Rulan, Nemor-Jelak, Rault-Sanik, Saelt-Marae.
  language: The Yarkora have their own language, although they never speak it in the presence of others.
    All Yarkora encountered in the galaxy speak fluent Basic.
  homeworld: The Yarkora homeworld remains a mystery. Xenoscientists speculate that Yarkora origi- nated
    in an arid climate, evolving to become their homeworld’s dominant sentient species.
  physical_description: Humanoid, with large three-fingered hands, a long snout, wide nostrils, bushy
    tufts of hair, and short smooth fur, the average Yarkora stands about 2 meters tall. Despite their
    stature, Yarkora somehow manage to get around without attracting too much attention.
  personality: 'Yarkora have a well-deserved reputa- tion as sly con artists. They masterfully pry. information
    from others while refusing to divulge information about their past, their culture, or their interests.
    Their unassuming manner belies a presence that sometimes discomforts and intimidates others. Friendships
    mean little to them: Yarkora are interested only in people they can manipulate or exploit.'
- name: Yevetha
  pdf_page: 189
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, —2 Intelligence, ~2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Yevetha have no special modifiers due to their size.
  - name: Speed
    text: Yevetha base speed is 10 meters.
  - name: Natural Weapons
    text: 'Yevetha have retractable dewclaws that they use to make unarmed attacks without provoking attacks
      of opportunity. A Yevetha can strike with both claws in a single round but takes the normal penalties
      for fighting with two weapons (see Table 8-3: Two-Weapon Fighting Penalties in the Star Wars Roleplaying
      Game). Each claw deals 1d4 points of piercing damage plus the Yevetha’s Strength modifier. Extending
      or retracting the claws is a free action.'
  - name: Xenophobic
    text: Yevetha despise all other species and ruthlessly hunt down trespassers in their space. They
      suffer a -8 penalty on Diplomacy or Charisma checks made to improve the attitudes of members of
      other species. Likewise, they impose a -8 penalty on other species’ attempts to improve Yevetha
      attitudes toward them.
  - name: Skill Bonus
    text: Yevetha are mechanically inclined and gain a +2 species bonus on Repair checks.
  - name: Bonus Feat
    text: Yevetha gain the bonus feat Ambidexterity.
  - name: Free Language Skills
    text: Read/Write and Speak Yevethan.
  adventurers: Yevetha adventurers are typically soldiers, although fringers, nobles, and tech specialists
    also exist. No known Force traditions exist among the Yevetha.
  example_names: Dar Bille, Eri Palle, Kez Haarl, Nil Spaar, Vol Noort, Vor Duull, Zar Braan.
  language: Yevetha speak their own language {Yevethan). While they can speak Basic with ease, few of
    them know it due to their isolation from the rest of the galaxy.
  homeworld: N’zoth Ill, a dry gray-green world located in the system of the same name, in the Core Worlds
    region.
  physical_description: Yevetha are tall, gaunt humanoids with wide-set black eyes, six-fingered hands,
    and retractable dewclaws in each wrist. Their necks and backs are scaled—an evolutionary vestige of
    natural body armor once possessed by their species. The males of the species have scarlet facial crests
    along their cheeks and jaws, with a larger crest running across the top and down the back of their
    heads. A male's f
  personality: Yevetha are proud, dutiful, attentive, violent, and fatalistic beings who adhere to a strict
    societal hierarchy and remain unswervingly loyal to their religious beliefs.
- name: Yinchorri
  pdf_page: 191
  canon: legends
  traits:
  - name: Ability Modifiers
    text: None.
  - name: Medium-size
    text: As Medium-size creatures, Yinchorti have no special modifiers due to their size.
  - name: Speed
    text: Yinchorri base speed is 10 meters.
  - name: Force Resistance
    text: Yinchorri gain a +8 species bonus on Will saves to resist the Force skills Affect Mind, Friendship,
      Mlusion, Telepathy, and any other mind-influencing Force skill that allows the target a Will save.
  - name: Cold-Blooded
    text: Yincharri gain a +4 species bonus on Fortitude saves against heat hazards (see Heat and Cold
      in Chapter Twelve of the Star Wars Roleplaying Game).
  - name: Bonus Feat
    text: Yinchorri gain the bonus feat Great Fortitude.
  - name: Free Language Skills
    text: Read/Write and Speak Yinchorti.
  adventurers: Yinchorri have taken to the stars with verve, earning their keep as mercenaries, body-
  example_names: Denrak, Emterrk, Jetar, Jorek, Kardek, Merzok, Qayayir, Solhek, Varuk, Vooma.
  language: Yinchorri speak their own language, and many learn to speak Basic as well.
  homeworld: Yinchorr, a rocky desert world located in the Outer Rim system of the same name.
  physical_description: The Yinchorri are solidly built reptilian humanoids, Adults stand between 2.4
    and 2.7 meters tall, with no significant differences in build between males and females. Their bodies
    are covered in tough skin that is either brown or dark green and provides them protection from the
    harsh environment of their homeworld.
  personality: Yinchorri are resolute, pragmatic, and possessive. They believe that if they're strong
    enough to take something and hold on to it, it is, by right, theirs. They turn fierce and obstinate
    when faced with adversity.
- name: Yuuzhan Vong
  pdf_page: 193
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, +2 Constitution, -2 Wisdom.
  - name: Medium-sized
    text: As Medium-size creatures, Yuuzhan Vong have no special modifiers due to their size.
  - name: Speed
    text: Yuuzhan Vong base speed is 10 meters.
  - name: Force Absence
    text: Yuuzhan Vong are “absent” in the Force. Attempting to use Farseeing, Force Grip, Force Lightning,
      Force Strike. or Move Object against a Yuuzhan Vong or their vessels and equipment imparts a -10
      penalty to the Force- user's skill check. All other Force skills have no effect on Yuuzhan Vong.
      Yuuzhan Vong can never gain the Force- Sensitive feat (which precludes them from taking any other
      Force skills or Force feats), and they never gain Force Points. Yuuzhan Vong can accu- mulate Dark
      Side Points just as non-Force-sensitive characters do,
  - name: Technophobic
    text: A Yuuzhan Vong character suffers a —4 penalty on ability checks, attack rolls, and skill checks
      when using unfamiliar pieces of tech- nology such as blaster pistols, blaster rifles, slugthrowers,
      vibro weapons, heavy weapons, non-Yuuzhan Vong exotic weapons, standard starships, vehicles, and
      equipment. A Yuuzhan Vong character negates this penalty if he or she has 5 or more ranks in the
      Knowledge (technol- ogy) skill. The GM can waive this penalty if the character has spent a great
      deal of time in the known galaxy and uses standard technology on a regular basis.
  - name: Resistant to Stun
    text: Yuuzhan Vong gain a +4 species bonus on Fortitude saves against stun attacks from energy weapons.
  - name: Free Language Skills
    text: Read/Write and Speak Yuuzhan Vong.
  adventurers: If a Yuuzhan Vong serves her superiors well, she may be given a great deal of leeway in
    how she performs her duties, or even be permitted to formulate and execute her own plans, However,
    Shamed Ones are the only members of Yuuzhan Vong society who might consider forsaking their gods by
    joining forces with non-Yuuzhan Vong characters, although such aberrant representa- tives of the species
    are usua
  example_names: Nom Anor, Dooje Brolo, Malik Carr, Yomin Carr, Chine-kal, Nas Choka, Da’Gara, Elan, Kae
    Kwaad, Mezhan Kwaad, Kahlee Lah, Qurang Lah, Tsavong Lah, Ma’Shraid, Vua Rapuung, Shedao Shai, Taan,
    Tu Shoolb, Nen Yim.
  language: Yuuzhan Vong speak their own language. Few learn to speak other languages, instead relying
    on tizowyrms (small creatures that crawl into the user’s ear) to translate for them.
  homeworld: Yuuzhan Vong originated on an unknown planet far outside the known galaxy. During The New
    Jedi Order era, they live in enormous bioengineered worldships. i
  physical_description: Yuuzhan Vong have slop- ing foreheads, pale skin (often scarred and tattooed),
    and dark, coarse hair. High-ranking Yuuzhan Vong often sacrifice parts of their bodies to honor their
    gods, then replace them with new, improved ones. The average Yuuzhan Vong stands about 1.9 meters
    tall.
  personality: Fearless, cruel, and ambitious, the Yuuzhan Vong believe that pain is the most important
    sensation in life and death. To die honorably in the service of their gods is a Yuuzhan Vong's greatest
    aspiration. They find the use of “dead” machines repugnant and consider beings who use them infidels.
    All other beings are weak, and those who cannot serve as slaves are destroyed. Yuuzhan Vong hate the
    “Jee
- name: Yuzzem
  pdf_page: 195
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +4 Strength, +2 Constitution, ~2 Dexterity, -4 Wisdom, -2 Charisma.
  - name: Large
    text: As Large creatures, Yuzzem take a -1 size penalty to their Defense, a -1 size penalty on attack
      rolls, and a —4 size penalty on Hide checks. They have a Face/Reach of 2 m by 2 m/4 m. Their lifting
      and carrying limits are triple those of Medium-size characters (see Carrying Capacity in the Star
      Wars Roleplaying Game).
  - name: Speed
    text: Yuzzem base speed is 10 meters.
  - name: Natural Weapons
    text: A Yuzzem can make a claw or bite attack instead of an unarmed strike. A claw attack deals 1d8
      points of slashing damage plus the Yuzzem’s Strength modifier. The bite attack deals 1d8 points
      of piercing damage plus the Yuzzem’s Strength modifier. Neither of these attacks provokes an attack
      of opportunity.
  - name: Scent
    text: Yuzzem can detect opponents within 10 meters by sense of smell. If the source is upwind, the
      range increases to 20 meters; if the source is downwind, the range decreases to 6 meters. Strong
      scents double the range, and overpower- ing scents triple it. See Special Qualities in Chapter Fourteen
      of the Star Wars Roleplaying Game for more information on the scent ability.
  - name: Physical Intimidation
    text: Yuzzem may use their Strength modifier instead of their Charisma modi- fer for Intimidate checks.
  - name: Fearless
    text: Yuzzem don’t frighten easily and gain a +4 species bonus on Will saves to resist fear effects
      (such as the Frightful Presence feat).
  - name: Skill Bonuses
    text: Yuzzem use their sharp claws to aid in climbing and gain a +2 species bonus on Climb checks.
  - name: Free Language Skills
    text: Read/Write and Speak Yuzz.
  adventurers: The first Yuzzem left Ragna Ill as Imperial slaves. Once freed, they found work as mercenaries,
    enforcers, and mechanics. Many returned
  example_names: Dek, Gor, Hin, Kee, Pok,
  language: Yuzz is a language of growls, roars, and mewls. There is no written form of Yuzz. Yuzz is
    largely unpronounceable by most other species. Other species, with the exception of Wookiees, must
    spend 2 skill paints (instead of the normal 1) to gain the Speak Yuzz skill. Unlike Wookiees, Yuzzem
    are capable of speaking Basic.
  homeworld: Ragna Ill, an arboreal planet located in the Mid Rim.
  physical_description: Humanoids with long snouts, thick brown fur, and long powerful arms that end in
    sharp claws, Yuzzem stands about 2.5 meters tall. A Yuzzem’s prominent lower jaw has two tusks that
    jut upward,
  personality: Although rash and volatile, the Yuzzem follow a strict code of honor and insist on paying
    their debts. Their fierce presence often over- shadows their generous dispositions and strong sense
    of fair play.
- name: Zabrak
  pdf_page: 196
  canon: legends
  traits:
  - name: Ability Modifiers
    text: None.
  - name: Medium-size
    text: As Medium-size creatures, Zabrak have no special modifiers due to their size.
  - name: Speed
    text: Zabrak base speed is 10 meters.
  - name: Resilient and Resolute
    text: Zabrak are hardy and possess above-average willpower. They gain a +2 species bonus on Fortitude
      and Will saving throws.
  - name: Free Language Skills
    text: Read/Write and Speak Basic and Zabrak.
  adventurers: Zabrak adventurers love to explore
  example_names: Aagh Odok, Agen Kolar, Eeth Koth, Eryl Jeth, Kaz Lo, Kooth Aan, Orth Maag, Ro Vira, Sayla
    Voth, Shad Raal, Tiran Vos, Zag Leer,
  language: Zabrak speak their own language © (Zabrak) and Basic.
  homeworld: 'lridonia, located in the Mid Rim. Deep canyons scar the planet''s landscape. Great winds
    tip through these canyons, sometimes reaching over 200 kilometers per hour. Seas of frothing acid
    swirl up into “acid spouts” that soar hundreds of kilometers into the sky. Worse still, these acid
    seas are home to gigantic predators. :'
  physical_description: Zabrak resemble Humans except for the patterns of vestigial horns that adorn their
    heads. Several races of Zabrak exist, each with different horn patterns. Female Zabrak have slighter
    builds than the males, but both stand between 1.6 and 2.1 meters tall as adults.
  personality: Zabrak tend to be dedicated, intense, and focused. They are sometimes considered single-minded.
- name: Zehethbra
  pdf_page: 197
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, -2 Wisdom, —2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Zehethbra have no special modifiers due to their size.
  - name: Speed
    text: Zehethbra base speed is 10 meters.
  - name: Spray
    text: Once per day, a Zehethbra can emit a stinging biochemical spray in a 4-meter radius. Any living
      creature caught in the cloud must succeed at a Fortitude save (DC 15) or be nause- ated for 2d6
      rounds. A nauseated creature can take no actions other than a single move action each tum. Although
      the spray carries pheromones unique to the sprayer, all Zehethbra are immune to the spray’s effect.
  - name: Free Language Skills
    text: Read/Write and Speak Zehethbra, and Speak Basic.
  adventurers: Most Zehethbra adventurers are fringers and soldiers. A few Zehethbra have explored the
    Jedi traditions, becoming Jedi guardians or, more rarely, Jedi consulars.
  example_names: Clyngunn, Fyntarr, Rygulan, Sarnizak.
  language: The Zehethbra language incorporates snarls, growls, chitters, and angry shrieks. Zehethbra
    also speak Basic with ease.
  homeworld: Zeheth, a temperate planet located in the Mid Rim. The Zehethbra live either in urban sprawls
    or in rural dens built amid the roots of Zeheth’s great trees.
  physical_description: Zehethbra are furry, muscu- lar bipeds with fangs. Their fur ranges in color from
    black to speckled brown. A broad white stripe runs from their noses, up over their heads, and down
    their backs. Their pawlike hands have claws that add to their fierce appearance but are too small
    to deal significant damage in combat. A Zehethbra adult stands 1.9 to 2.3 meters tall.
  personality: Zehethbra are moody and tempera- mental. When angered, a Zehethbra will growl, snarl, and
    spit at the source of discomfort, hurling terrible epithets at enemies. Despite their irritable attitude,
    Zehethbra are fiercely protective of their families and clans. They are territorial and do not like
    having their personal space violated.
- name: Zeltron
  pdf_page: 198
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Constitution, —2 Wisdom, +4 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Zeltrons have no special modifiers due to their size.
  - name: Speed
    text: Zeltron base speed is 10 meters.
  - name: Quick Reaction
    text: Zeltrons gain a +1 species bonus on initiative checks.
  - name: Empathy
    text: As a free action, a Zeltron can sense the general mood, attitude, and emotional state of another
      sentient being within 10 meters. The Zeltron can only read a single being’s emotions in any given
      round, and the target cannot tell that his or her emotions are being read. Beings with 1 or more
      Dark Side Points who succeed at a Will save (DC 12) can resist the empathic probe, although the
      save is a reaction that the target isn’t even aware of. The Zeltron gains a +2 species bonus on
      Diplomacy, Gather Information, and Sense Motive checks made against the target as long as the Zeltron
      continues to sense his or her emotions.
  - name: Pheromones
    text: Zeltrons can project their emotions onto other living beings within a 10-meter radius. They
      gain a +2 inherent bonus on Bluff, Diplomacy, Entertain, Handle Animal, and Intimidate checks made
      against all targets within range. This ability does not affect a creature or individual with 1 or
      more Dark Side Points. In the case of Diplomacy checks, the inherent bonus granted by this ability
      stacks with the species bonus granted by the empathy ability, above.
  - name: Entertainer
    text: All Zeltrons gain Entertain as a class skill.
  - name: Free Language Skills
    text: Read/Write and Speak Basic.
  adventurers: Zeltron adventurers are found among all the classes. Force-sensitive Zeltrons find Jedi
    training difficult, as the tenets of the Jedi Order generally discourage the indulgence of strong
    emotions. Still, Zeltron Jedi do exist.
  example_names: Adriav, Arno, Bahb, Dani, Froedi, Heigren, Impella, Jahn, Jahz, Jakira, Joi, Kainae,
    Kieral, Leonie, Maeve, Mahd, Marruc, Nerus, Opalica, Rahuhl, Rhajani, Sian, Soleil, Spenori, Tamair,
    Tanai, Trix, Welarem, Yahja.
  language: Zeltrons have many ancient languages, all of which have faded into obscurity. Zeltrons prefer
    to speak Basic and dedicate time to master the many idioms that other cultures infuse into the language.
  homeworld: Zeltros, an idyllic planet located on the edge of the Outer Rim and the Unknown Regions.
  physical_description: Zeltrons are near-Humans with skin colors ranging from pink to crimson. Nearly
    all are considered (by Human standards) shock- ingly beautiful and handsome. Zeltrons average 1.8
    meters tall.
  personality: 'Gregarious, warm, lustful, and merry, Zeltrons love parties and people. Zeltrons who reach
    old age or endure great travails or suffering often manifest different personality traits: a deep
    melan- choly, a fervent passion for justice or a cause, or an intense loneliness and desire for a
    lasting bond.'
