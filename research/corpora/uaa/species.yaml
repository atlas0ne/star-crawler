    cannot be effectively “spoken” by other species. Many Twi'leks learn to speak Huttese as well.
  homeworld: Ryloth, a storm-swept Outer Rim planet.
  physical_description: Humanoid, with long tapered head-tails, the average Twilek stands between 1.6
    and 2.1 meters tall. Skin tones include shades of blue, white, and green.
  personality: Twi'leks are calculating, pragmatic, and charismatic people. Generally speaking, they try
    to avoid being swept up in other beings’ troubles, preferring instead to duck into the shadows and
    wait out large conflicts. From a safe hiding place, they can observe, plan, and prepare to profit
    from the outcome.
