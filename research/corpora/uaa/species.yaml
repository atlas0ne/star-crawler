- name: Pa'lowick
  pdf_page: 121
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Strength, +2 Dexterity, +2 Wisdom.
  - name: Medium-size
    text: As Medium-size creatures, Pa’lowicks have no special modifiers due to their size.
  - name: Speed
    text: Pa'lowick base speed is 10 meters.
  - name: Primitive
    text: Pa'lowicks with heroic or professional classes receive the bonus feat Weapon Group Proficiency
      (primitive weapons) instead of the usual Weapon Group Proficiency bonus feats.
  - name: Breathe Underwater
    text: Pa‘lowicks are amphibious and can't drown in water. They also gain a +4 species bonus on Swim
      checks.
  - name: Natural Weapon
    text: A Pa’lowick young adult or adult has two long, sharp tusks that protrude from the lower jaw
      of her second mouth. These tusks deal 1d4 points of piercing damage (plus Strength modifier), and
      an attack made with the tusks does not provoke attacks of opportunity. When a Pa'lowick reaches
      middle age, her tusks fall off and her lower mouth completely grows OVET.
  - name: Skill Bonuses
    text: Pa‘lowicks gain a +4 species bonus on Hide and Survival checks in swamp environments.
  - name: Free Language Skills
    text: Read/Write and Speak Lowickese.
  adventurers: Pa lowicks rarely leave Lowick. Those who do are dazzled by traders’ tales about the rest
    of the galaxy. Once they're offworld for a few weeks, they often run out of credits and end up as
    vagabonds, criminals, or slaves. Heroes can belong to any class, although most Pa’lawicks encountered
    away from their homeworld are either fringers or nobles.
  example_names: Larisselle Chatrunis, Aneeda Desha, Meep Erdles, Sal Orbego, Sy Snootles, Roopak Weelak.
  language: Pa'lowick speak Lowickese. With the recent introduction of technology to their world, they've
    adapted the Basic alphabet to create written Lowickese. To the uneducated, it looks like gibberish
    written in Basic.
  homeworld: Lowick, a swampy planet in the Outer Rim.
  physical_description: 'A Pa''lowick has a round torso, long spindly arms and legs, mottled skin (usually
    yellow, green, and brown), and two mouths: one at the end ofa long snout, the other located below
    the base of the snout. Two sharp tusks jut. upward from the Pa''lowick’s lower mouth, which completely
    grows over at middle age. The average Pa‘lowick stands about 1.6 meters tall.'
  personality: Pa'lowicks are natural scavengers who exhibit incredible patience. They display ritualis-
    tic tendencies, rarely changing the way they do things. Pa'lowicks strive to preserve the traditions
    of the past while embracing technology that is useful. Singing and storytelling are among a Pa’lowick’s
    favorite pastimes.
- name: Pho Ph'eshian
  pdf_page: 123
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Intelligence, -2 Wisdom.
  - name: Medium-size
    text: As Medium-size creatures, Pho Ph’eahians have no special modifiers due to their size.
  - name: Speed
    text: Pho Ph’eahian base speed is 10 meters.
  - name: Extra Limbs
    text: Pho Ph’eahians have four arms. The extra limbs give them a +4 species bonus on Climb checks
      and grapple checks. They can hold items in each of their four hands. A Pho Ph’eahian has one primary
      hand and three off hands. A Pho Ph’eahian can wield up to four weapons, but the normal penalties
      for fight- ing with multiple weapons apply (see the Multiweapon Fighting feat description in the
      New Feats appendix).
  - name: Thermal Fur
    text: Pho Ph’eahians gain a +4 species bonus on Fortitude saves to resist the effects of extreme cold
      (see Heat and Cold in Chapter Twelve of the Star Wars Roleplaying Game).
  - name: Skill Bonus
    text: Pho Ph’eahians gain a +4 species bonus on Survival checks in mountainous environments.
  - name: Free Language Skills
    text: Read/Write and Speak Pho Ph’eahese.
  adventurers: Pho Ph’eahians prefer to remain on their homeworld, though they have been attracted by
    lucrative jobs as engineers and mechanics, especially throughout the Corporate Sector. Pho Ph’eahian
    heroes are usually fringers or tech specialists, although they can belong to any class.
  example_names: Cho'ree, Darshev, Fe’heon, Gary, Le’shar, Lo’pho’r, Rova, Shey, Veerzan, Vo'ray.
  language: Pho Ph’eahese is a sophisticated language of squeaks, squeals, and high-pitched barks. Written
    Pho Ph’eahese uses an intricate set of charac- ters that represent single spoken syllables.
  homeworld: Pho Ph’eah, an Outer Rim world near the Corporate Sector. The planet's distant elliptical
    orbit keeps it far from its native sun most of the time. During these “dark” periods, the sun appears
    as a distant speck in Pho Ph’eah’s sky, and the Pho Ph’eahians must rely on their thermal layer of
    fur to keep them warm.
  physical_description: Pho Ph’eahians are a bipedal, four-armed humanoid species with bright blue fur
    and large fanlike ears. The average Pho Ph’eahian stands about 1.7 meters tall.
  personality: Most Pho Ph’eahians are outgoing and cheerful. They enjoy being the center of atten- tion.
    They view their bodies as “sacred manifestations of the spirit” and clean themselves religiously to
    ensure that stains on their bodies do not become stains on their souls. Aside from their cheery disposi-
    tions and obsession with cleanliness, Pho Ph’eahians are best known for their technical skills.
