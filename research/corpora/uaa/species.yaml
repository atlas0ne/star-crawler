meta:
  corpus: Ultimate Alien Anthology species (WotC 2003, d20 Revised)
  source: OCR sidecars from d20_star_wars-ultimate_alien_anthology.pdf (see paths.py)
  extracted_by: research/tools/extract_uaa.py
  canon: legends
  extracted: 161
  note: OCR text; spelling faults possible. Ability Modifiers use an OCR em-dash for minus.
species:
- name: Abyssin
  pdf_page: 9
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, +2 Constitution, -4 Intelligence, -2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Abyssins have no special modifiers due to their size.
  - name: Speed
    text: Abyssin base speed is 10 meters.
  - name: Extraordinary Recuperation
    text: Abyssins regain vital- ity and wound points at twice the normal rate (2 vitality points per
      character level per hour, 2 wound points per day. of rest).
  - name: Limb Regeneration
    text: With three days of rest, an Abyssin can completely regrow a lost limb or organ.
  - name: Poor Depth Perception
    text: Because of their singular eye, Abyssins have poor depth perception and suffer a —1 penalty on
      all ranged attacks.
  - name: Primitive
    text: Abyssins with heroic or professional classes receive the bonus feats Weapon Group Proficiency
      (primitive weapons) and Weapon Group Proficiency (simple weapons) instead of the usual Weapon Group
      Proficiency bonus feats.
  - name: Skill Bonus
    text: Abyssin gain a +4 species bonus on Survival checks in arid environments.
  - name: Free Language Skills
    text: Read/Write and Speak Abyssin.
  adventurers: Abyssins rarely leave Byss, as they are quite satisfied with their lot in life. Those who
    do are usually taken as slaves by representatives of more technologically advanced cultures. A few
    Abyssins who venture offworld end up as laborers, thugs, or prize brawlers. Particularly resourceful
  example_names: Anami, Easym, Mador, Myo, Poleye, Vomak.
  language: Abyssins have their own spoken and written language (Abyssin). The spoken language consists
    of primitive-sounding grunts and growls, and the written language is based on a simple set of hieroglyphs.
  homeworld: The planet Byss, located in the Outer Rim Territories, is a mostly arid sphere that orbits
    twin suns in a figure-eight pattern. The Burning—the leg of Byss’s orbit that carries it between the
    twin suns—is a grueling time when temperatures rise, weather is unpredictable, and sunlight scorches
    the entire planet.
  physical_description: Abyssins are slightly hunched, hulking humanoids with long limbs, lank
  personality: Abyssins are quick to anger, especially when taunted or otherwise insulted. They hardly
    ever need to show restraint and are well known for their quarrelsome nature. Abyssin society is primitive,
    and individuals show little interest in anything other than basic comforts. All Abyssins dislike space
    battles and blaster fire.
- name: Adarian
  pdf_page: 9
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Constitution, +4 Intelligence.
  - name: Medium-size
    text: As Medium-size creatures, Adarians have no special modifiers due to their size.
  - name: Speed
    text: Adarian base speed is 10 meters.
  - name: Long Call
    text: An Adarian can emit a subsonic call by inflating his throat pouch and vibrating the air- filled
      sac as a full-round action. This call can be heard up to 20 kilometers away by other Adarians. Members
      of other species within 4 meters take 2d4 points of sonic damage, or half damage with a successful
      Fortitude save (DC = 10 + the Adarian’s Constitution modifier). On a failed save, a character is
      also stunned for | round. Other Adarians take no damage from a long call, but an Adarian can only
      use this ability 3 times per day without injuring himself. Each time he uses long call beyond 3
      times per day, the Adarian takes 2d4 points of sonic damage (no saving throw allowed), but is not
      stunned.
  - name: Skill Bonuses
    text: Adarians gain a +2 species bonus on Listen, Search, and Spot checks.
  - name: Free Language Skills
    text: Read/Write and Speak Adarese.
  adventurers: Adarian explorers are always search- ing for new resources to exploit and are given free
    reign by the ruling caste to indulge this pursuit. Occasionally, a member of a lower caste will leave
    Adari in search of a better life or success among the stars. Adarian heroes can belong to any class.
  example_names: Ador Beldune, Denka Melru, Luur Tenefor, Yeeru Meekel.
  language: Adarians speak Adarese, a language that uses largely tonal inflections. Their rigid mouths
    make languages such as Basic difficult to speak without a heavy accent.
  homeworld: Archaeologists believe that Adarians did not originate on Adari (located in the Inner Rim),
    but rather migrated to the planet thousands of years before the Battle of Yavin. The planet is now
    the seat of the Adarian government, which operates like a corporation.
  physical_description: Adarians are hairless humanoids with elongated heads that have a hole clear through
    from one side to the other. Adults stand about 1.7 meters tall and come in a variety of vibrant skin
    colors (commonly blue or yellow). Members of the same caste tend to have a similar coloration.
  personality: Adarians carefully weigh their options before reaching any decision, but once the decision
    is made, they are rarely moved to change their minds. Adarians implicitly trust the judgment of those
    of higher status, and only the most flippant and rebel- lious Adarian would disregard orders or advice
    from a member of a higher caste. Adarians have keen minds for business and a natural drive to succeed.
    T
- name: Advozse
  pdf_page: 10
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Dexterity, +2 Constitution, +2 Wisdom.
  - name: Medium-size
    text: As Medium-size creatures, Advozsec have no special modifiers due to their size.
  - name: Speed
    text: Advozse base speed is 10 meters.
  - name: Herbivorous
    text: The Advozsec evolved from plant- eating reptile-analogs on Riflor. They cannot digest animal
      protein, and any Advozse who consumes such matter (knowingly or not) imme- diately suffers 1d6 points
      of temporary Constitution damage.
  - name: Natural Armor
    text: Their proximity to geothermal hotsprings has given Advozsec thick skin that provides a +2 natural
      armor bonus to Defense.
  - name: Pessimistic
    text: Advozsec are antisocial beings who generally expect the worst. They suffer a -4 species penalty
      on Diplomacy checks.
  - name: Low-Light Vision
    text: The perpetually dim lighting conditions on Riflor allow the Advozsec to see particularly well
      in low light. They can see twice as far as normal in dim light, and they retain the ability to distinguish
      color and detail under these conditions.
  - name: Skill Bonuses
    text: Advozsec are perceptive and gain a +2 species bonus on Search and Spot checks.
  - name: Free Language Skills
    text: Read/Write and Speak Advb.
  adventurers: Advozsec who take to a life of adventure are typically fringers or tech specialists. Advozsec
    have a slightly lower than average number of Force-users. Those who can move beyond their gloomy outlook
    on life can become Jedi, however.
  example_names: Bom Vindim, Gjeel Dhantra, Kol Nurn, Roda Lem, Vel Ramdro.
  language: Advozsec speak and read Advb.
  homeworld: The tectonically unstable planet of Riflor, located in the Mid Rim.
  physical_description: Advozsec are roughly humanoid and average about 1.5 meters tall. They are hairless,
    pug-faced beings with thick skin that ranges from muddy yellow to ruddy brown. An Advozse’s eyes are
    large and black due to millennia of evolution in caves, with ears that come to a point to better resolve
    location underground. A prominent black horn protrudes from the top of the Advozse’s head.
  personality: Advozsec do not trust easily, and they don’t trust that anything—anything—is permanent.
    They prepare for the worst, yet for all their supposed pessimism, they do hope and strive for the
    best realis- tic possible outcome. Advozsec are notoriously indifferent to possessions save money.
    While objects, homes, and cities may be destroyed during the next calamity season, monetary power
    can rebuild a soc
- name: Amanin
  pdf_page: 11
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, -2 Intelligence, ~2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Amanin have no special modifiers due to their size.
  - name: Speed
    text: Amanin base speed is 10 meters.
  - name: Primitive
    text: Amanin with heroic or professional classes receive the bonus feat Weapon Group Proficiency (primitive
      weapons) instead of the usual Weapon Group Proficiency bonus feats.
  - name: Roll
    text: Amanin can curl their bodies into a wheel- like shape and roll for long periods. Amanin double
      their normal speed while rolling but can only move in a straight line and suffer a -4 circumstance
      penalty on Listen and Spot checks. Amanin can also use this ability with overland movement, as described
      in Chapter Six of the Star Wars Roleplaying Game.
  - name: Resilient
    text: Amanin have redundant internal organs that provide a +1 species bonus on Fortitude Saves.
  - name: Skill Bonus
    text: Amanin are arboreal and gain a +4 species bonus on Climb checks.
  - name: Free Language Skill
    text: Speak Amanese.
  adventurers: Amanin are relatively new to the civilized galaxy. After the dissolution of the Galactic
    Senate, many have begun living in the spaceports of Maridun and traveling offworld. Each new generation
    of Amanin is more integrated into galactic society than the previous one. Amanin heroes are usually
    fringers or scouts, with the occasional Force adept.
  example_names: Aja, Brenjandor, Jorodus, Jott, Ojat Wan, Tonjon, Trijit, Unjor.
  language: Amanin have no written language of their own, relying instead on a tradition of oral history
    carried on by each tribe’s loremaster.
  homeworld: Maridun, located in the Outer Rim, is temperate world of long, flat plains dotted with small
    forests. During the Galactic Civil War, the Empire constructed several spaceports on Maridun to support
    their mining operations. These spaceports have been co-opted by smugglers, slavers, and pirates as
    bases of operation since the Empire’s defeat.
  physical_description: Hooded humanoids with long, spindly arms, big hands, and stocky legs, Amanin stand
    about 2.5 meters tall. They have yellow and green skin and often wear little or no clothing.
  personality: Traditionally, Amanin are fearless hunters due to their dominant station in Maridun’s food
    chain and their natural resilience. Beyond their homeworld, Amanin tend to keep a low profile
- name: Anomid
  pdf_page: 12
  canon: legends
  traits:
  - name: Ability Modifiers
    text: -2 Strength, +2 Intelligence, +2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Anomids have no special modifiers due to their size.
  - name: Speed
    text: Anomid base speed is 10 meters.
  - name: Technical Aptitude
    text: When working with items of a technical nature (such as computers, droids, and repulsorlift engines),
      Anomids receive a +2 species bonus on Craft checks and Repair checks.
  - name: Wealthy
    text: Anomid characters roll an extra die when determining starting credits. For example, a ist-level
      Anomid noble starts play with 2d4 x 1,000 credits instead of the standard 1d4 x 1,000.
  - name: Skill Bonuses
    text: Anomids are curious about all other species and gain a +4 species bonus on Knowledge (alien
      species) checks. They also use their broad knowledge of sentient alien behavior to find peaceful
      solutions to conflicts, giving them a +2 species bonus on Diplomacy checks.
  - name: Free Language Skill
    text: Speak Anomid.
  adventurers: Anomids that leave their homeworld are usually nonconformists who disagree with the laws
    and philosophies of their peers, wanderlusting youngsters, technology hunters, or corporate travelers.
    Anomids can belong to any hero class but are most commonly nobles, scouts, and tech specialists. Anomid
    Force-users are also possible, while Anomid soldiers are extremely rare.
  example_names: Zadan Isp, Vap Killif, Magris Quill. Wif Sissk, Yin Vocta, Drezzim Zar.
  language: With the aid of their vocalizer masks, Anomids speak Basic. Anomids also employ an
  homeworld: Yablari, located in the Outer Rim, is an agrarian world with some the best food-processing
    technology in the galaxy. There’s no evidence or record of any civil wars in the planet's history,
    not surprising given the agreeable nature of the species. A global drought forced the Anomids to employ
    centuries-old hyperdrive principles for the first time. The first suitable world they discovered already
    h
  physical_description: A typical Anomid is frail- looking, with translucent skin, large opalescent eyes,
    a bald pate surrounded by dark wispy hair, six-fingered hands, and fanlike ears, Adult Anomids average
    1.75 meters tall.
  personality: Anomids are peaceful intellectuals. They are intensely curious about cultures across the
    galaxy. They often seize the opportunity to meet beings of species they've never encountered before,
    taking care to learn their customs and etiquette. Anomids usually avoid physical confrontations.
- name: Anx
  pdf_page: 13
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, -2 Wisdom.
  - name: Large
    text: As Large creatures, Anx suffer a -1 size penalty on Defense, a -1 size penalty on attack rolls,
      and a —4 penalty on Hide checks. They have a Face/Reach of 2 m by 2 m/4 m. Their lifting and carrying
      limits are double those of Medium- size characters.
  - name: Speed
    text: Anx base speed is 12 meters.
  - name: Communicate at Distance
    text: An Anx can communi- cate with other Anx within 5 kilometers. Adverse weather conditions (high
      winds, for example) can reduce this distance at the GM's discretion. ANOMID AQUALISH
  - name: Revealing Coloration
    text: Anx have trouble hiding their emotions. An Anx not wearing a fin cloak suffers a -4 penalty
      on Bluff checks.
  - name: Anatomical Awareness
    text: An Anx who takes the Martial Arts feat deals 1d6 points of damage with an unarmed strike and
      threatens a critical hit on a natural roll of 18-20.
  - name: Bonus Feat
    text: Anx gain the bonus feat Run.
  - name: Free Language Skills
    text: Read/Write and Speak Anx.
  adventurers: Anx adventurers can be any class, though they are rarely encountered as Jedi or scouts.
    Anx fringers and scouts are more common in a Rebellion era campaign.
  example_names: Graxol Kelvyyn, Horox Ryyder, Theen Fida, Drexol Ryyd.
  language: Anx speak and read Anx. Their head- crests contain enormous sinuses that generate booming,
    low-frequency tones that other Anx can hear from several kilometers away. Offworld Anx often speak
    Basic, and descendants of Anx who survived the Shusugaunt invasion also speak Shusugaunt.
  homeworld: Graviex Mex, a low-gravity world located in the Mid Rim.
  physical_description: Anx average 4 meters tall and would seem taller if they didn’t walk with their
    shoulders stooped and their long, crested heads held out in front of them. Their skins—and particularly
    the fins beneath their crests—change color to reflect their emotions. When traveling among aliens,
    Anx often wear cowled cloaks that hide their crests. Their slow, hunched way of walking, together
    with their small, cl
  personality: Anx are serene beings. They are highly sociable, given to large families and complex clan
    structures. They fear isolation.
- name: Anzat
  pdf_page: 14
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, -4 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Anzati have no special modifiers due to their size.
  - name: Speed
    text: Anzati base speed is 10 meters.
  - name: Anzati Tracking
    text: When using the Track feat, an Anzat may use the See Force skill, rather than the Survival skill,
      to locate and follow quarry (provided he has ranks in the See Force skill). Though an Anzat can
      track using Survival, the Anzat gains a bonus on his See Force check equal to the target's character
      level. The stronger the target’s presence, the more the target stands out to the Anzat’s senses.
  - name: Hypnosis
    text: An Anzat uses a crude form of telepathy to hypnotize prey. If a sentient being within 2 meters
      is flat-footed or unaware of the Anzat’'s presence (such as when denied its Dexterity bonus to Defense
      against the Anzat), the Anzat can attempt to hypnotize the target as a full-round action. The target
      is stunned on a failed Will save (DC = Anzat’s character level + Anzat’s Intelligence modifier).
      The subject remains stunned until the Anzat’s next attack. If the Anzat is attacked, interrupted,
      or otherwise distracted before he can insert his proboscises into his victim, the hypnosis effect
      ends immediately and the victim can act normally.
  - name: Proboscises
    text: A successful unarmed melee attack against a grappled, stunned, or helpless creature allows the
      Anzat to insert his proboscises into the creature's brain (usually through its sinus cavities) and
      drain its “soup.” (The Anzat can furl and unfurl the proboscises as a free action.) A successful
      attack stuns the victim, and the stun effect remains until the Anzat withdraws its proboscises or
      dies. Only a victim who is not already stunned (such as by the Anzat’s hypnosis ability) is entitled
      to a Fortitude save to negate the stun effect of the proboscises (DC = Anzat’s character level +
      Anzat’s Intelligence modifier). Each round of feeding deals 1 point of temporary Constitution damage
      to the target creature, The target dies when reduced to / . r q C € G a ¢ ti 0 Constitution points.
      Once an Anzat begins feeding, he is compelled to consume all he can. Only the risk of death will
      cause him to leave a meal unfinished,
  - name: Bonus Feats
    text: Anzati gain the bonus feats Force- Sensitive, Infamy, and Stealthy.
  - name: Free Language Skills
    text: Read/Write and Speak Anzat and Basic.
  adventurers: Anzati heroes are rare, given their predatory nature. The few who care to interact with
    other species on a social level are usually fringers, nobles, scoundrels, or (rarely) Force adepts.
  example_names: Allexi Jabbra, Tav Ezellan, Dannik Jerriko, Ketren Noor, Nikkos Tyris, Volfe Karkko.
  language: Anzati speak Anzat, an ancient language known only to them. The written form of Anzat is equally
    archaic, and no known samples exist in any institution. Anzati speak Basic with ease.
  homeworld: The location of Anzat, the Anzati homeworld, is unknown. Anzati go there only to reproduce,
    then inexorably roam the galaxy in search of food or diversion,
  physical_description: Humanoids with large, bulbous noses, Anzati stand about 1.7 meters tall. They
    have a pair of hidden pockets in their cheeks, each concealing a thin, tubelike proboscis. Anzati
    are easily mistaken for any of a multitude of Human and near-Human species, only revealing their true
    nature when their proboscises are unfurled.
  personality: Anzati are stealthy, patient hunters. They rarely keep the company of others and tend to
    travel alone, mingling with their own kind rarely, and usually only on the Anzati homeworld. Anonymity
    is an Anzat’s only friend.
- name: Aqualish
  pdf_page: 15
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Constitution, -2 Wisdom, —2 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Aqualish have no special modifiers due to their size.
  - name: Speed
    text: Aqualish base speed is 10 meters.
  - name: Breathe Underwater
    text: As amphibious creatures, Aqualish can’t drown in water. Aquala gain a +4 species bonus on Swim
      checks, while Quara and Ualaq receive a +2 bonus on Swim checks.
  - name: Fins (Aquala only)
    text: Aquala take a -4 penalty on skill checks that involve the use of equipment not specifically
      designed for use with their fins, such as most weapons, computers, and control panels.
  - name: Free Language Skills
    text: Read/Write and Speak Aqualish.
  adventurers: Aqualish heroes are typically scoundrels or soldiers. Force-using Aqualish are rare.
  example_names: Calfta Bongi, Carn‘ar, Gondara, Gunda Mabin, Koral-tae, Po Nudo, Ponda Baba, Undra Lagor,
    Yada Munda.
  language: Aqualish speak and read Aqualish. The Quara, Ualaq, and Aquala have slightly different
  homeworld: Ando, a Mid Rim water planet dotted with swampy islands and rocky outcroppings on which the
    Quara, Ualag, and Aquala make their homes.
  physical_description: Aqualish are tusked, walrus- faced humanoids with skin ranging in color from dark
    green or blue to deep russet or black. Members of the Ualag subspecies have four eyes instead of two.
    Adult Aqualish stand between 1.8 and 2 meters tall.
  personality: The Aqualish admire strength and are openly contemptuous and hostile toward the weak. It
    is customary and accepted social behavior for an Aqualish to be pushy and belligerent toward people
    he or she is interacting with for the first time. If the other individual does not stand up to them,
    the Aqualish assumes the other being is weak and contin- ues to bully him or her.
- name: Arcona
  pdf_page: 16
  canon: legends
  traits:
  - name: Ability Modifiers
    text: None.
  - name: Medium-size
    text: As Medium-size creatures, Arcona have no special modifiers due to their size.
  - name: Speed
    text: Arcona base speed is 10 meters.
  - name: Natural Armor
    text: Arcona have thick skin that provides a +1 natural armor bonus to Defense.
  - name: Salt Addiction
    text: 'An Arcona who imbibes sodium chloride must succeed at a Fortitude save (DC 22) or suffer the
      effects of salt poisoning: 1d4 points of temporary Constitution damage and a -2 penalty on all attack
      rolls, ability checks, skill checks, and saving throws. After 24 hours of suffering the effects
      of salt poisoning, an afflicted Arcona gets a Will save (DC 20) to resist addiction. A failed save
      can be re-rolled every 24 hours. The effects of salt poisoning last for 1d3 days after the addiction
      is broken.'
  - name: Free Language Skills
    text: 'Read/Write and Speak Arconese, Arcona Gommoner: Init +0; Defense 11 (+1 natu- ral); Spd 10
      m; VP/WP 0/10; Atk +0 melee (13, unarmed strike) or +0 ranged; SQ Species traits; SV Fort +0, Ref
      +0, Will +0; SZ M; FP 0; DSP 0; Rep +0; Str 10, Dex 10, Con 10, Int 10, Wis 10, Cha 10. Challenge
      Code A. Equipment: Variety of personal belongings. Skills: Craft +1 (any one) or Profession +1 (any
      one), Knowledge +2 (any one), Read/Write Arconese, Speak Arconese, Speak Basic. Feats: None. Arkanian
      At one time, Arkania was an important part of the Sith Empire. The world was one of the main reposi-
      tories of that long-lost civilization’s historical records. During the three main eras of play,
      Arkania is known for its elaborately constructed trade cities and rich gem mines. A number of highly
      sought- Arkanians are known for zealous exploration of the galaxy, innavations in microcircuitry,
      and contribu- tions to medical technology. Arkanian scientists have long been expert practitioners
      of genetic manipula- tion, displaying a particular fascination with the genetic make-up of species
      other than their own. Some of the results of their research have led to great advances in medical
      techniques, while others are considered among the greatest atrocities the galaxy has ever known.
      The combination of vast wealth generated by huge gem mines and near-boundless arrogance has led
      the Arkanian scientific community to launch research projects on a scale matched only by such Imperial
      endeavors as the Death Star and the Emperor''s hidden stronghold in the Deep Core. The most elaborate
      Arkanian scientific projects take generations to unfold, often resulting in the total reshaping
      of entire planets and species. While Arkanian interaction with the galaxy at large has been characterized
      by the actions of their scientists, many Arkanians are horrified and greatly embarrassed by the
      excesses individuals have perpe- trated in the name of science. The most conscientious Arkanians
      are allies of the Jedi Order. In fact, one of the most famous Jedi academies in history stood on
      Arkania. Personality: Arkanians exhibit a distinctive arro- gance. They consider themselves the
      pinnacle of evolution, an attitude that has remained with them throughout millennia of interacting
      with the rest of the galaxy. Their representatives in the Galactic Senate were among the most vocal
      prior to the rise of the Empire, but after Emperor Palpatine’s defeat, their beliefs kept them from
      joining the New Republic. Physical Description: Arkanians are a robust near-Human species with solid
      white eyes and clawed, four-fingered hands. Adults average 1.8 meters tall. Homeworld: Arkania,
      a frigid, inhospitable world located in the Perave system in the Colonies region. Language: Arkanians
      speak and read two languages: their native Arkanian and Basic. Example Names: Dolvan Genarik, Jaro
      Salaban, Kalor Nelprin, Marael Korvata, Sulan Bek. Age in Years: Child 1-11; young adult 12-16;
      adult 17-52; middle age 53-84; old 85-102; venerable 103+. Adventurers: Arkanian heroes are often
      nobles, scouts, or scoundrels. Adventuring Arkanians often devote their careers to erasing their
      people''s image as the galaxy’s “mad scientists,” a difficult task in any of the main eras. Whenever
      Arkanians venture beyond their home system and nearby colonies, they must overcome considerable
      resentment.'
  adventurers: Arcona do not favor any particular class and are nearly as diverse in their pursuits as
    Humans. During the Rise of the Empire era, many Arcona follow the path of the Jedi.
  example_names: Kodu Terrafin, Vegath Tist, Dutan Kelliv, Dutana Leara, Hem Dazon, Illist Mandrep, Kal
    Nkai, Shlith-Dan.
  language: Arcona have a native tongue {Arconese) that is rarely spoken by those who have heen raised
    in off-Cona colonies, but the species has little difficulty learning and speaking Basic.
  physical_description: Arcona have thick skin that tanges in color from mahogany to ebony, and trian-
    gular heads with large multi-faceted eyes that seem. to sparkle. Their hands feature three prehensile
    talons, They average 1.7 to 2 meters tall.
  personality: An individual Arcona almost always uses the plural pronoun “we” instead of “1.” Male Arcona
    raise the young, since Arcona females are typi- cally impulsive thrill-seekers. As such, females are
    particularly prone to risking salt addiction, while males go to great lengths to keep the substance
    out of their communities. In fact, male Arcona are renowned for their conservative outlooks and strong
    comm
