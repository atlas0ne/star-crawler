      ing one skill of his or her choice. The Thakwaash must have at least one rank in the chosen skill
      and takes a -2 penalty on all other skill checks while manifesting the desired person- ality. These
      modifiers persist until the Thakwaash manifests another personality or is stunned, dazed, or knocked
      unconscious, A stunned, dazed, or unconscious Thakwaash adopts a “neutral” personality that applies
      no bonus or penalties to skills. A Thakwaash who manifests the same person- ality for longer than
      | hour must make a Will save (DC 20 + the Thakwaash’s Charisma modi- fier). A failed save means
      that a random personality takes hold (possibly a “neutral” one, as described above). Even if the
