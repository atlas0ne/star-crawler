  canon: legends
  traits:
  - name: Ability Modifiers
    text: +4 Strength, -2 Dexterity, +2 Constitution, -2 Intelligence, -2 Wisdom, —4 Charisma.
  - name: Medium-size
    text: As Medium-size creatures, Houk have no special modifiers due to their size.
  - name: Speed
    text: Houk base speed is 10 meters.
  - name: Natural Armor
    text: Houk are thick-boned and thick- skinned. They get a +2 natural armor bonus to Defense.
  - name: Physical Intimidation
    text: Houk use their Strength modifier instead of their Charisma modifier for Intimidate checks.
  - name: Free Language Skills
    text: 'Read/Write and Speak Houk, Speak Basic. Houk Gammaner: Init -1: Defense 11 (-1 Dex, +2 natural);
      Spd 10 m; VP/WP 0/12; Atk +2 melee (1d3+2, punch) or -1 ranged; SQ Species traits; SV Fort +1, Ref
      -1, Will -1; SZ M; FP 0; DSP 0; Rep +0; Str 14, Dex 8, Con 12, Int 8, Wis 8, Cha 6. Challenge Code
      A. Equipment: Variety of personal belongings. Skills: Craft (any one) +0 or Knowledge (any one)
      +0, Intimidate +3, Profession (any one) +0, Read/Write Houk, Speak Basic, Speak Houk. Feats: None.
      Hutt Hutts are long-lived gastropods who occupy a region known as Hutt Space. They are powerful,
      ruthless beings who continually seek to expand the bound- aries of their dominion and the holdings
      of their individual clans, or Rajidics. Their appetite for power is as insatiable as their appetite
      for food. Hutts are often found at the center of business and criminal enterprises, Legality (or
      lack thereof) does not affect whether a Hutt will pursue a venture. All that matters is how much
      of a benefit—and a profit—one can get from it. Like worms, Hutts are hermaphroditic, with both male
      and female reproductive organs. Hutts bear their young one at a time and nourish them for a time
      in a brood pouch. Their large lungs enable them to stay underwater for hours at a time. Xenobiologists
      often classify Hutts as gastropods because of their sluglike appearance and movements. A council
      of elders oversees Hutt Space. Comprised of Hutts representing the oldest and most influential kajidics,
      they decide the fate of everyone who lives in Hutt Space, and all other Hutts are answerable to
      them. Personality: Most Hutts are vicious megalomani- acs who consider their kind to be beyond morality
      as perceived by lesser beings. They have a talent for manipulating other beings and enjoy accumulating
      and exerting power over others. A Hutt’''s strongest loyalty is always to his kajidic, without which
      a Hutt is nothing but a lowly commoner. Physical Description: A Hutt is an immense, slug- like creature
      with a thick body, muscular tail, and small arms protruding from its upper body. A Hutt’s bulbous
      head features catlike eyes, wide nostrils, and a broad lipless mouth. An adult Hutt averages 4 meters
      long and weighs 1,500 kilograms. Homeworld: Hutts evolved on the temperate forest world of Varl.
      When a natural calamity left Varl a blasted wasteland, the Hutts fled and adopted a new homeworld:
      Nal Hutta, in the Y’''Toub system on the border of the Mid Rim and Outer Rim. The Hutts have spent
      centuries polluting and ruining Nal Hutta’s ecosystem, as well as that of Nar Shaddaa, a heavily
      industrialized moon orbiting Nal Hutta. Language: Hutts speak and read Huttese and Basic. They consider
      their own language superior to Basic and usually demand that lesser beings address them in their
      native tongue, Example Names: Borga, Churabba, Dalla, Durga, Gardulla, Grelb, Grondo, Issulla, Jabba,
      Krova, Mardoc, Mika, Nullada, Popara, Shala, Yarella, Zonnos, Zordo. Age in Years: Child 1-70; young
      adult 71-90; adult 91-650; middle age 651-844; old 845-925; venerable 926+. Adventurers: Very few
      Hutts manifest any desire to explore space or place themselves in harm''s way. They prefer to travel
      the stars on space yachts or command their mini-empires from heavily fortified estates. Hutt crime
      lords are common, while exiled or disgraced Hutts sometimes become scoundrels or bounty hunters.
      At least one Hutt of repute has trained as a Jedi, although Hutt Force-users are exceedingly rare.'
  adventurers: Houk who travel the galaxy take full advantage of the reputation that precedes them. They
    often work for crime syndicates and pirates. The select few who rise above the vile corruption that
    passes for Houk society occasionally join independent bands of adventurers for profit or glory. Houk
    heroes tend to be soldiers, but fringers, scoundrels, and bounty hunters are possible as well. Force-using
    Ho
  example_names: Gorb Drig, Egome Fass, Agamor Krin, Morg Nar, Roath Vogog, Krelba Voss.
  language: Houk speak Houkese, a language of grunts marked with subtle tonal inflections that differentiate
    words that otherwise sound the same. Written Houkese uses a simple primitive alphabet in which each
    letter represents a simple verb and intr- cate pictograms represent nouns.
  homeworld: Lijuter, an arid and inhospitable
  physical_description: Houk are hulking bipeds with thick skin (usually dark blue or violet), hairless
    heads marked with bony ridges and a pronounced brow, flabby jowls, beady yellow eyes, and no visible
    ears or nose. The average Houk stands about 2.2 Meters tall.
  personality: Houk are humorless, short-tempered beings who use their strength to antagonize weaker beings.
    Their propensity for deceit and skullduggery is matched only by the Hutts. These qualities are wflected
    both in their combat techniques and their political dealings. Although Houk descend from a culture
    where violence, corruption, and treachery are rampant, a few are actually hard workers who have learned
