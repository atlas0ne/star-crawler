  - name: Bonus Feat
    text: 'Ranth have keen senses and gain the bonus feat Alertness. 6 Free Language Skills: Read/Write
      and Speak Ranth, and Speak Basic (civilized Ranth only). f Commoner: Init +1; Defense 11 (+1 Dex);
      Spd 10 m; VP/WP 0/10; Atk +0 melee (1d3, claw) or +1 ranged; SQ Species traits; SV Fort +0, Ref
      +1, Will -1; SZ M; FP 0; DSP 0; Rep +0; Str 10, Dex 12, fon 10, Int 8, Wis 8, Cha 10. Challenge
