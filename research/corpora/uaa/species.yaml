      their level of technology does not meet the galactic stan- dard, T’surr capably use technology scavenged
      from the ships of their victims. T''surr are not represented on the Galactic Senate during the Old
      Republic or New Republic because they are widely regarded as nothing more than dangerous, marauding
      killers. The harsh living condi- tions on the T’surr homeworld have created a species of survivors
      who care little for others. The wealth of a T’surr is rated by the number and quality of slaves
      he owns. A T’surr without slaves is worth as much as a freighter captain without a starship. Female
      T’surr are never seen—males indicate that they are small, feeble creatures that never leave the
      safety of the home. Personality: T’surr male are violent, avaricious predators who treat weaker
      species as chattel. They use their brute strength and ruthless cunning to rule their T’surr and
      non-T’surr subordinates, climinating potential rivals. They like to keep trophies as reminders of
      their conquests, often wearing these stolen trinkets on their belts. Whereas T’surr males rule the
      stars, T’surr females rule the homes. For this reason, T’surr males anxiously leave their homeworld,
      leaving their mates to raise the children. Physical Description: Hulking brutes, T’surr males stand
      between 2.3 and 2.6 meters tall. They are strong and solidly built, with blue skin that has the
      sheen of marble. Their huge heads sport numerous horns, large, sensitive ears, a mouth filled with
      razor sharp teeth, and four gleaming red eyes. T’surr females are physically smaller and leaner
      than the males, standing about 2 meters tall. They also lack the mane of homs that contributes to
      the males’ fierce appearance. Homeworld: T''surr, a cold and windblown desert planet located in
      the Expansion Region. A distant and feeble sun provides little light, and other species find the
      planet''s high gravity daunting and oppressive. Language: T’surr speak and read T’surrese. They
      also speak Basic with ease. Example Names: Datynask, Dyrago, Feyr, Jeneyd, Krayn, Reythan, Shyntak,
      Treykon. Age in Years: Child 1-10; young adult 11-15; adult 16-45; middle age 46-75; old 76-99;
      venerable 100+. Adventurers: A solitary T’surr will often join forces with a powerful band of pirates,
      privateers, or smugglers. These rare T’surr don’t automatically regard all other species as their
      lessers, but they are still drawn to violent, predatory professions. T’surr scoundrels and soldiers
      are common, and the galaxy has yet to face a T’surr Force-user.'
  adventurers: Trianii are curious by nature, prefer- ting to explore uncharted regions of space instead
    of joining galactic society. When encountered away from Trianii space, they are often mistaken for
    Cathar and Togorians. Although they can belong to any heroic class, most Trianii begin their adventuring
    careers as nobles, scoundrels, or scouts.
  language: Trianii speak a language of the same name, consisting of purrs, growls, and rolling vocal-
    izations. Written Trianii is a series of characters that represent syllable sounds.
  homeworld: Trian lies on the outskirts of the Corporate Sector in the Outer Rim. It acts as a trading
    hub and central government for over a half dozen outlying Trianii colonies.
  physical_description: Humanoid, slender, with short colorful fur, feline facial features, sharp claws,
    and a prehensile tail, the average Trianii stands about 2 meters tall. Trianii fur comes in a variety
    of colors and patterns.
  personality: Trianii are fiercely independent, adventurous, and deeply spiritual. Most members of the
    species adhere to the moral codes of Trian’s official religion, as well as their family’s traditional
    religion.
- name: T'surr
  pdf_page: 170
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, -2 Dexterity.
  - name: Large (males)
    text: As Large creatures, T’surr males take a -1 size penalty to their Defense, a —1 size penalty
      on attack rolls, and a —4 size penalty on Hide checks. They have a Face/Reach of 2 m by 2 m/4 m.
      Their lifting and carrying limits are triple those of Medium-size characters (see Carrying Capacity
      in the Star Wars Roleplaying Game).
  - name: Medium-size (females)
    text: As Medium-size creatures, T’surr females have no special modifiers due to their size.
  - name: Speed
    text: T’surr base speed is 10 meters.
