    text: H’nemthe females have razor-edged tongues. The tongue deals 1d6 points of slashing damage (plus
      Strength modifier) and threatens a critical hit on a 19-20. The female H’nemthe's tongue attack
      does not provoke attacks of opportunity.
  - name: Skill Bonuses
    text: H'nemthe have keen senses and gain a +2 species bonus on Search and Spot checks. They also receive
      a +2 species bonus on Diplomacy and Sense Motive checks made against warm-blooded sentients within
      20 meters.
  - name: Free Language Skills
    text: Read/Write and Speak H’nemthe.
  adventurers: H’nemthe males seldom seek glory or adventure, but if they are repeatedly rejected as mates,
    they may roam the galaxy instead of taking their own lives. H'nemthe heroes are typically male and
    can belong to any class, although fringers and
  example_names: Garriel, H’rassh, Liakkor, S’basso, Vir'roe, Vishki.
  language: H’nemthe speak a language comprised primarily of squeaks, squeals, and other noises that other
    sentients find irritating. The written form of H'nemthe uses a wispy, contiguous line to make letters
    that string together to form words.
  homeworld: H’nemthe, an Outer Rim world with three moons. The moons’ collective gravitational force
    creates unsettled weather conditions across the entire planet. Scientists believe that the H’nemthe
    evolved their heat-sensing cones to help them forage for food in the inclement weather.
  physical_description: A H'nemthe has blue-gray skin, a double set of cheekbones, a gently curved nose,
    three fingers on each hand, and a head crowned with four short cones. The average adult stands about
    1.7 meters tall. The majority of H’nemthe encoun- tered are male.
  personality: H’nemthe males are timid beings who spend most of their adult lives searching for true
    love. They also believe that death is an impor- tant part of life, and that one’s own death paves
    the way for future generations. H’nemthe females lead a sheltered life until they begin to mate, and
    conse- quently they tend to be naive about matters outside the home.
- name: Ho'Din
  pdf_page: 73
  canon: legends
  traits:
  - name: Ability Modifiers
    text: +2 Strength, -2 Dexterity.
  - name: Large
    text: As Large creatures, Ho’Din suffer a -1 size penalty to Defense, a -1 size penalty on attack
      tolls, and a —4 size penalty on Hide checks. They have a Face/Reach of 2 m by 2 m/4 m. Their lift-
      ing and carrying limits are double those of Medium-size characters.
  - name: Speed
    text: Ho'Din base speed is 12 meters.
  - name: Cold-Blooded
    text: Ho'Din cannot abide cold temper- atures. They suffer a —4 penalty on Fortitude saves to resist
      the adverse effects of extreme cold (see Heat and Cold in Chapter Twelve of the Star Wars Roleplaying
      Game),
  - name: Skill Bonuses
    text: Ho'Din gain a +2 species bonus on Climb checks and a +4 species bonus on Knowledge (wilderness
      lore) checks. They gain a +4 species bonus on Survival checks made in forests.
  - name: Free Language Skills
    text: Read/Write and Speak Ho’Din.
  adventurers: Ho'Din who leave Moltok are usually botanists whose skills are in demand, self- absorbed
    prima donnas, or radical dissidents. Ho’Din heroes are usually nobles, scouts, or Force adepts. Jedi
    consulars are also possible. Ho'Din tech specialists are unheard of,
  example_names: Baji, sm Oolos, Kutu, Par’tah, Plett, Spero, Usta.
  language: Ho'Din speak a language of the same name that has many hisses and croaks. The written language
    uses characters derived from the shapes of different plants native to Moltok. The Ho’Din vocab- ulary
    includes thousands of plant-based metaphors and idioms.
  homeworld: Moltok, a world of rain forests and volcanoes, is located in the Outer Rim. Technology is
    closely monitored and restricted on Moltok, for fear that it might somehow be used to harm the planet’s
    delicate ecosystem,
  physical_description: Ho’Din are slender humanoids with brightly colored scales, a crown of snakelike
    stalks for hair, large black eyes, and natu- rally webbed fingers and toes with suction cups. Their
    anemone hair can sense even the slightest variation or change in temperature. The average Ho’Din stands
    about 2.75 meters tall.
  personality: Ho'Din are self-conscious and vain. Their concern with beauty is usually centered either
    on their personal appearance or that of their floral and arboreal creations. They do not take insults
    or criticism well and use moder technological devices only when necessary.
- name: Houk
