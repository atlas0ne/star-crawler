  - name: Quadrupedal
    text: Charon gain a +4 stability bonus against bantha rushes and trip attacks.
  - name: Extra Limbs
    text: 'Charon have four arms. The extra limbs give them a +4 species bonus on Climb checks and grapple
      checks. Charon can hold items in each of their four hands but can only attack with their slightly
      larger, uppermost pair. A Charon has one primary hand and one off hand. A Charon can wield two weapons,
      but the normal penalties for fighting with two weapons apply (see Table 8-3: Two-Weapon Fighting
      Penalties in the Star Wars Roleplaying Game).'
  - name: Natural Weapons
    text: A Charon can make a claw attack without provoking attacks of opportunity. The claw attack deals
      1d6 points of slashing damage plus the Charon’s Strength modifier.
  - name: Web
    text: A Charon can shoot strands of sticky webbing from spinnerets in its abdomen; it can do this
      a number of times per day equal to 3 + the Charon’s Constitution bonus (minimum 3 times per day).
      As an attack action, the Charon can make a ranged touch attack to entangle an opponent within 12
      meters (see the Character Condition Summary in the Star Wars Roleplaying Game for the effects of
      being entan- gled). As a full-round action, the Charon can cover an adjacent 2-meter-by-2-meter-by-2-
      meter volume with impassible webbing. The webbing has a hardness of 0, 15 wound points per 2-meter
      cube, and a break DC of 30. Fire and lightsabers deal double damage to the webs.
  - name: Free Language Skills
    text: Read/Write and Speak Charon.
  adventurers: Those who are aware of the Charon believe the entire species is trapped in otherspace,
    but some signs of Charon activity in the known galaxy surface occasionally. Charon heroes only exist
    within the Cult of Light, though a few have made allies among non-Charon. Most Charon heroes are tech
    specialists (called bioscientists) or soldiers (called warriors). No Charon Force-users are known
    to exist.
  example_names: Charon who serve the Prophet of the Void do not have personal names. Charon belong- ing
    to the Cult of Light sometimes adopt names, usually after meeting other species in the known galaxy;
    possible Charon names include Fa’chak, H’zish, Ry’shyrr, Sya’kalla, and Tin’soth.
  language: Charon speak a bizarre language full of clicks, squeals, and scratching sounds made by rubbing
    their mandibles together. This language can only be duplicated by other insectoid species. The Charon
    written language is a series of intricate web shapes indistinguishable from a decorative pattern.
  homeworld: Otherspace is actually a pocket dimension formed by a series of black holes. Only the Charon
    know the exact location of their homeworld— a bleak, cold, and barely habitable globe.
  physical_description: Charon possess both humanoid and arachnoid qualities. A Charon four arms and four
    legs, giant slit-pupil eyes, and a large trailing abdomen capable of spinning webs. A thick, mottled
    carapace encases its body. The average Charon stands about 2.25 meters tall.
  personality: Charon who serve the Prophet of the Void believe in entropy, and they strive relentlessly
    to destroy all life. Charon who follow the Illuminated One desire to escape otherspace and build a
    new and thriving society somewhere in the known galaxy. All Charon, regardless of allegiance, pursue
    their desires with single-minded determination if not ruthlessness. Although they prefer bioorganic
    technology
