    Tarrese is equally similar to written Basic, with a
  homeworld: Tililix was a technologically advanced world deep within the Unknown Regions. Fewer than
  personality: The Tarro are a stubbom, independent species. They have little patience for others and
    are obstinate and abrupt even with others of their own species. Despite their self-centered attitude,
    they have a knack for making it clear that if you're not with them, you're in the way. Some Tarro
    have purportedly leamed to overcome their “loner” attitude.
