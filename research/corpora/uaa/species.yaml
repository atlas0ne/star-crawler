    text: A Toydarian’s base speed on land is 6 meters. They move 18 meters while flying and have poor
      maneuverability.
  - name: Guarded Mind
    text: Toydarians gain a +8 species bonus on Will saves to resist the Force skills Affect Mind, Friendship,
      Illusion, Telepathy, and any other mind-influencing Force skill that allows the target a Will save.
