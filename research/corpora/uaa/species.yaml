    text: Read/Write and Speak Nautila.
  adventurers: Nautolans crave adventure. Nobles, scouts, scoundrels, and soldiers are common. Nautolans
    can also be Force adepts, Jedi consulars, and Jedi guardians.
  example_names: Garn, Hiskar Dorset, Kit Fisto, Ploss Niklos, Renko Losa, Setel Yast.
  language: Nautolans speak and read Nautila, but their language is pronounceable only underwater. On
    land, Nautila loses a great deal of detail, which most Nautolans find annoying. When out of water,
