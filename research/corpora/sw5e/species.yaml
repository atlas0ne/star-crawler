      their affiliation, or quirks of their owner. They are noteworthy for their slow, shuffling gait
      and typically overly talkative nature. UTILITY Class III droids are programmed to interact with
      humans. They are said to be the most advanced droids ever invented. Protocol, servant, tutor, and
      child care droids are all class III droids. They are usually equipped with protocol chips which
      give them the cognitive functionality to engage socially. NAMES Droids are typically called by their
      designation, given to them when they are created, or some affectation given to them by their owner.
      Often this affectation is a play on their designation. Occasionally, noteworthy droids will earn
      monikers based on their accomplishments. Designations (Names). K-OHN (Kone), I-5YQ (I-Five), O-MR1
      (Omri), TC-14 (Teesee Fourteen)
