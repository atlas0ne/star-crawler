  - name: Languages
    text: 'You can speak, read, and write Galactic Basic and Cerean. Cerean is characterized by its gravelly
      sounds. CHISS VISUAL CHARACTERISTICS Skin Color Blue or silver Hair Color Black, blue, or silver
      Eye Color Red Distinctions Glowing red eyes, above-average night vision PHYSICAL CHARACTERISTICS
      Height 4''11" Weight 110 lb. +2d10" x(2d4) lb. SOCIOCULTURAL CHARACTERISTICS Homeworld Csilla Language
      Cheunh BIOLOGY AND APPEARANCE The chiss are a near-human species distinguished by their blue skin
      and glowing red eyes. Genetic analysis indicate that they are an offshoot of humanity, and it is
      believed that moving underground led to a divergence between them and baseline Humans. Their blue
      skin, jet black hair and red eyes generally command attention; these features make them physically
      striking and instantly recognizable. SOCIETY AND CULTURE Chiss society is highly structured and
      ordered with the rule of law being enforced by a group of four affiliations known as the Ruling
      Families: the Csapla, Nuruodo, Inrokini and Sabosen. These are not biological family groupings but
      instead different branches of their government. Every chiss claims affiliation to one of the four
      families, as determined by both tradition and place of birth. The family names are more of a cultural
      holdover; the bloodlines had grown so co-meddled that any chiss could claim affiliation to any of
      the ruling families. In spite of the outward impression of calm and order that the chiss like to
      project to outsiders, there were evidently tensions within the Families; political assassinations
      are a real part of chiss political life for the Ruling Families. NAMES A chiss true-name has 3 parts,
      each separated by an apostrophe. The first part is their family name, the second part is their root
      name, and the third part is their occupation. Chiss rarely share their true-name with non-chiss,
      and usually go by their root name. Male and female names do not significantly deviate.'
  - name: Names
    text: Crorcu'ecuk'unist, Dash'esoru'ishur, Jerd'ecer'lonii, Kisk'egauw'eqhi, Marag'aliphil'eduo, Pommo'icuote'nlerme,
      Vornu'wuzi'lerdim
