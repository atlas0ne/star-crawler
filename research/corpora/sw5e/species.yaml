  - name: Curiosity
    text: You have proficiency with Survival or Investigation (your choice).
  - name: Heat Adaptation
    text: You have advantage on Constitution saving throws made to avoid exhaustion due to extreme heat.
  - name: Jungle Dweller
    text: Growing up in the jungles of Devaron has left an impact. You don't treat jungle terrain as difficult
      terrain.
  - name: Silver Tongue
    text: You have proficiency with Deception or Persuasion (your choice).
  - name: Tech Resistance
    text: Growing up around technology leaves an impact on devaronians. You have advantage on Dexterity
      and Intelligence saving throws against tech powers.
  - name: Two Livered
    text: Devaronians have two livers, which makes them adept at filtering toxins. You have advantage
      on saving throws against poison, and you have resistance against poison damage (explained in chapter
      9).
  - name: Languages
    text: You can speak, read, and write Galactic Basic and Devaronese. Devaronese is characterized by
      grunts and grumbles. It is rare to hear a Devaronian speak it anywhere other than their homeworld
      of Devaron. DROID, CLASS I VISUAL CHARACTERISTICS Color Scheme Typically metallic Distinctions Human-like
      size, slow speed, specialized knowledge PHYSICAL CHARACTERISTICS Height 4'5 Weight 115 lb. +2d10"
      x(2d4) lb. CREATION CHARACTERISTICS Manufacturer Cybot Galactica, Industrial Automaton Primary Language
      Varies based on location PLAYERS AS DROIDS Work with your GM to determine if playing as a droid
      is appropriate for your campaign. Droids are impervious to many effects and vulnerable to others.
      If your GM approves this choice of species, Work with them to determine your droids designation,
      name, and appearance. If you want to play a different type of droid, work with your GM to find suitable
      traits to realize your character. APPEARANCE Class I droids are typically vaguely human-like in
      both shape and size, standing at around 6 feet, although some are smaller. They are usually a polished
      metallic color, though this can vary based on tasks for which they are created, their affiliation,
      or quirks of their owner. UTILITY Class I droids are programmed for the mathematical, medical, or
      physical sciences. Subcategories of the first degree are medical droids, biological science droids,
      physical science droids, and mathematics droids. Medical droids, also known as meddroids, med droids,
      medical units or surgical droids are a type of droid designed to heal living beings, and are the
      most commonly found Class I droids. NAMES Droids are typically called by their designation, given
      to them when they are created, or some affectation given to them by their owner. Often this affectation
      is a play on their designation. Occasionally, noteworthy droids will earn monikers based on their
      accomplishments. Designations (Names). 2MED2 (Toomedtoo), GH-7 (Geeaych-Seven), TX-20 (Tee-Ex Twenty)
      CLASS I
- name: Droid, Class I
  pdf_page: 24
  canon: both
  traits:
  - name: Ability Score Increase
    text: Your Intelligence score increases by 2, and your Wisdom or Charisma score increases by 1.
  - name: Age
    text: Droids don't age, though they require maintenance to retain functionality.
  - name: Alignment
    text: Droids tend toward no particular alignment. The best and worst are found among them.
  - name: Size
    text: Class I droids stand between 5 and 6 feet tall and weigh about 170 lbs. Regardless of your position
      in that range, your size is Medium.
  - name: Speed
    text: Your base walking speed is 25 feet.
  - name: Type
    text: Your creature type is droid.
  - name: Armor Integration
    text: You can not wear armor, but you can have the armor professionally integrated into your chassis
      over the course of a long rest. This work must be done by someone proficient with astrotech's implements.
      You must be proficient in armor in order to have it integrated.
  - name: Droid Resistances
    text: You are resistant to necrotic, poison, and psychic damage, and are immune to poison and disease.
  - name: Droid Systems
    text: You do not need to eat, drink, or breathe. Additionally, you no longer require a tech focus
      to cast tech powers.
  - name: Droid Vulnerabilities
    text: You are vulnerable to ion damage. Additionally, you have disadvantage on saving throws against
      effects that would deal ion or lightning damage.
  - name: Force-Insensitive
    text: While droids can be manipulated by many force powers, they can not sense the Force. You can
      not use force powers or take levels in forcecasting classes.
  - name: Knowledge Protocol
    text: You have proficiency in two Intelligence, Wisdom, or Charisma skills of your choice.
  - name: Maintenance Mode
    text: Rather than sleep, you must spend 3 hours performing routine maintenance during a long rest
      to gain its benefits, during which you have disadvantage on Wisdom (Perception) checks. Additionally,
      if your long rest would be interrupted, you only need to complete the long rest instead of restarting
      it.
  - name: Rapid Reconstruction
    text: You are built with internal repair mechanisms. As a bonus action, you can choose to spend one
      of your Hit Dice to recover hit points.
  - name: Languages
    text: You can speak, read, and write Galactic Basic and one language of your choice. You can understand
      spoken and written Binary, but you can not speak it.
