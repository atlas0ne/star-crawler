      to exist. Twi'leks are omnivores; this diet is essential given that food is scarce on their homeworld,
      Ryloth. Twi'leks possess multiple stomachs, an unusual trait that enables them to eat almost any
      food. When traveling off their homeworld, twi'leks rarely refuse food, which frequently leads to
      obesity among starfarers. Twi'lek society also considers obesity as a sign of influence and success.
