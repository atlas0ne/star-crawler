  - name: Speed
    text: Your base walking speed is 30 feet.
  - name: Cat's Claws
    text: Your unarmed strikes deal 1d6 kinetic damage and have the finesse property.
  - name: Darkvision
    text: Your vision can easily cut through darkness. You can see in dim light within 60 feet of you
      as if it were bright light, and in darkness as if it were dim light. You can't discern color in
      darkness, only shades of gray.
  - name: Leonine Agility
    text: Your reflexes and agility allow you to move with a burst of speed. When you move on your turn
      in combat, you can double your speed until the end of the turn. Once you use this trait, you can't
      use it again until you move 0 feet on one of your turns.
  - name: Silent Step
    text: You have proficiency in the Stealth skill.
  - name: Treeclimber
    text: You have a climbing speed of 30 feet. You have advantage on Strength saving throws and Strength
      (Athletics) checks that involve climbing.
  - name: Languages
    text: You can speak, read, and write Galactic Basic and Catharese.
