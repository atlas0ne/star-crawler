    text: You can speak, read, and write Galactic Basic and Togruti. Togruti is an ornate language characterized
      by trills and long vowel sounds which are modified by subtle tremors in the togruta's head-tails.
      This language is heavily influenced by Basic, but also incorporates some native idioms, which cause
      Basicspeaking togruta to use seemingly strange expressions. TRANDOSHAN VISUAL CHARACTERISTICS Skin
      Color Green, yellow, brown, orange, red Hair Color None Eye Color Yellow, orange Distinctions Reptilian,
      scaly skin, regenerative properties PHYSICAL CHARACTERISTICS Height 5'5" Weight 130 lb. +2d12" x(2d6)
