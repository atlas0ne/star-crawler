      Homeworld Forest Moon of Endor Language Ewokese BIOLOGY AND APPEARANCE Ewoks are sentient humanoid
      mammals, averaging about one meter in height, which can provide an advantage when trying to hide.
      They are covered in fur from head to toe, with brown and black the most common colors. Other Ewoks
      have near-white or reddish fur, but red fur is supposedly the rarest shade an Ewok can get. Most
      Ewoks have solid-colored fur, though a few sport stripes. Ewoks have large, bright eyes, small humanoid
