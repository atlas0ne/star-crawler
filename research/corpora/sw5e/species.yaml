species:
- name: Bith
  pdf_page: 17
  canon: both
  traits:
  - name: Ability Score Increase
    text: Your Intelligence score increases by 2, and your Dexterity score increases by 1.
  - name: Age
    text: Bith reach adulthood in their late teens and live less than a century.
  - name: Alignment
    text: Biths' benevolent nature causes them to tend toward the light side, though there are exceptions.
  - name: Size
    text: Bith typically stand 5 to 6 feet tall and generally weigh about 120 lbs. Regardless of your
      position in that range, your size is Medium.
  - name: Speed
    text: Your base walking speed is 30 feet.
  - name: Detail Oriented
    text: You are practiced at scouring for details. You have advantage on Intelligence (Investigation)
      checks within 5 feet.
  - name: Keen Hearing and Smell
    text: You have advantage on Wisdom (Perception) checks that involve hearing or smell.
  - name: Musician
    text: You are proficient in one musical instrument of your choice.
  - name: Programmer
    text: Whenever you make an Intelligence (Technology) check related to computers, you are considered
      to have expertise in the Technology skill.
  - name: Sonic Sensitivity
    text: Your powerful sense of hearing makes you especially vulnerable to deafening sounds. You have
      disadvantage on saving throws against effects that would deal sonic damage (explained in chapter
      9).
  - name: Trance
    text: You only need 3 hours of sleep during a long rest to gain its benefits, instead of 6. Additionally,
      if your long rest would be interrupted, you only need to complete the long rest instead of restarting
      it to gain its benefits.
  - name: Languages
    text: You can speak, read, and write Galactic Basic, Bith, and one more language of your choice.
- name: Bothan
  pdf_page: 19
  canon: both
  traits:
  - name: Ability Score Increase
    text: Your Intelligence score increases by 2, and your Dexterity score increases by 1.
  - name: Age
    text: Bothans reach adulthood in their late teens and live less than a century.
  - name: Alignment
    text: Bothans' duplicitous nature causes them to tend toward the dark side, though there are exceptions.
  - name: Size
    text: Bothans stand 4-5 feet tall and weigh under 100 pounds. Regardless of your position in that
      range, your size is Medium.
  - name: Speed
    text: Your base walking speed is 30 feet.
  - name: Naturally Stealthy
    text: You can attempt to hide even when you are obscured only by a creature that is your size or larger
      than you.
  - name: Nimble Escape
    text: 'You can take the Disengage or Hide action as a bonus action on each of your turns. While bothans
      are suitable for many classes, they most iconically fit as operatives. The Nimble Escape special
      trait heavily overlaps with the operative''s Cunning Action feature, however, making this species/class
      combination counterintuitive. If, during the character creation part of your game, a player decides
      to make a bothan operative, consider letting them use the following feature instead:'
  - name: Versatile Expertise
    text: You gain proficiency in one skill of your choice. You gain expertise in one skill of your choice
      in which you are proficient.
  - name: Shrewd
    text: You are proficient in the Insight and Deception skills.
  - name: Languages
    text: You can speak, read, and write Galactic Basic and Bothese. Bothese had a great influence on
      the forming of Galactic Basic; the two languages share many cognates. CATHAR VISUAL CHARACTERISTICS
      Skin Color Gold to yellow-brown with dark stripes Hair Color Brown, black, or grey Eye Color Yellow
      or brown Distinctions Lion-like features PHYSICAL CHARACTERISTICS Height 4'9" Weight 130 lb. +2d12"
      x(2d4) lb. SOCIOCULTURAL CHARACTERISTICS Homeworld Cathar Language Catharese BIOLOGY AND APPEARANCE
      The Cathar have fur-covered bodies with thick manes as well as prominent, retractable claws that
      can deliver powerful killing attacks on foes and prey. Their bodies also possess rapid healing abilities.
      These traits make them the perfect hand-to-hand specialists. The Cathar species also has two subspecies,
      known as the Juhani and the Myr Rho. Both of these are notably less catlike than mainline Cathar.
      Cathar are born into a litter. The Cathar species is biologically similar to the Bothan species.
      SOCIETY AND CULTURE On their homeworld, Cathar live in cities built into giant trees, and are organized
      into clans governed by elders. Stories of their great heroes were often carved into the trunks of
      these tree-homes for following generations to see. The Cathar mate for life, to the extent that
      when one mate dies, the survivor never has a relationship with another. Cathar clan society includes
      great pageants and celebrations, especially for their heroes. Their religion includes a ritual known
      as the "Blood Hunt," in which Cathar warriors individually engaged in combat against entire nests
      of Kiltik in order to gain honor and purge themselves of inner darkness. The native language of
      the Cathar is Catharese, which included the emphasis of some spoken words with a growl. NAMES Cathar
      names can sound both melodic and fairly gutteral, but they almost always sound strong and fierce.
      Female names are typically longer than male names. Surnames are usually one syllable.
  - name: Male Names
    text: Crurbirr, Isyrr, Nynorr, Suro, Tukarr Female Names. Cuwin, Jyvohr, Mulahr, Solyri Surnames.
      Jin, Ki, Mak, Rhir, Ta
- name: Cathar
  pdf_page: 20
  canon: legends
  traits:
  - name: Ability Score Increase
    text: Your Dexterity score increases by 2, and your Charisma score increases by 1.
  - name: Age
    text: Cathar reach adulthood in their late teens and live less than a century.
  - name: Alignment
    text: Cathar tend toward no particular alignment. The best and worst are found among them.
  - name: Size
    text: Cathar range from 5 to 7 feet tall, and can weigh up to 300 lbs. Regardless of your position
