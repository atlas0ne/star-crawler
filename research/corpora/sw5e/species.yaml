      Color Scheme Typically metallic Distinctions Human-like size, shuffling gait, typically talkative
      PHYSICAL CHARACTERISTICS Height 5'6" Weight 120 lb. +2d4" x(2d6) lb. CREATION CHARACTERISTICS Manufacturer
