      to "little bears," though they are sometimes referred to as "mini Wookiees." SOCIETY AND CULTURE
      Most Ewoks live high among the trees of the forest moon, in villages built between the closely spaced
      trees. The basic design of a tree village has a "Central Village" of thatched-roof huts on the primary
      limbs. These huts are high enough above the ground to be out of reach of predators. Suspended bridges
      connect the gaps between trees, adjoining distant huts. Knotted rope ladders allow access up or
      down. Ewoks enjoy singing and playing music during celebrations and rituals. They are resourceful
      and tend to make use of everything they get their hands on; they use a variety of crude drums, horns,
      flutes, and other instruments in their music. NAMES Ewok names are comprised of growled consonants.
      Female names always end in a vowel. Surnames are clan-based.
