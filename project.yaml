# --- description ----------------------------------------------------------
description: >
  A space-opera roleplaying game on the Crawler Core engine. Blasters, starships,
  a fallen order of mystic knights and the galaxy-spanning empire that hunted
  them. Built on the same rules as Stone & Spear and Project Mutant: a player who
  has rolled in one has rolled in all of them.

