aliases:
  sense: sense_with_range
  natural_attack_upgrade: natural_attack
  conditional_ac: ac_value
  conditional_modifier: flat_modifier
  conditional_damage: conditional_damage_multiplier
  movement: movement_rate_or_mode
  morale: morale_modification
  save: save_bonus
  surprise: surprise_modifier
never_list:
- id: automatic_hit_or_kill
  patterns:
  - automatically hit
  - automatic kill
  - no attack roll needed
  - always hits
- id: broad_immunity
  patterns:
  - immune to all
  - immune to any
  - immunity to a whole
  - nothing physical can
  - no physical attack
  - cannot be harmed by
  - unaffected by all
  note: Narrow, named immunities are fine. Breadth is the violation.
- id: permanent_undetectability
  patterns:
  - cannot be tracked
  - cannot be found
  - permanently undetectable
  - never be detected
- id: undo_effect
  patterns:
  - reroll a failed
  - re-roll a failed
  - may reroll
  - may re-roll
  - reroll one
  - reroll any
  - cancel a failed
  - ignore a failed
  - instead of dying
  - survives a killing blow
  - remain conscious at 0
  - at 0 hp
  - reduced to 0
  - you are not dead
  - come back from
  - below 0
  - to 0 instead
  - leaves you at 1
  - would kill you
  - not die from
  - still standing at 0
  note: May be BOUGHT, never granted free, never more than once per session, priced near the top of a
    pool. Return from 0 hp is governed by 6.4 Comes Back; a trait doing it must name the rule and take
    its price from the delay table.
banned_idiom:
  advantage:
    patterns:
    - advantage on
    - advantage to
    - with advantage
    - disadvantage on
    - disadvantage to
    - at disadvantage
    why: A 5e idiom. This is a 2d6 engine. See Appendix A2 — it is an OPTIONAL swap for an existing flat
      +2, never a way to write a trait.
    rewrite_to:
    - x_in_6
    - flat_modifier
    - surprise_modifier
    - save_bonus
  exhaustion:
    patterns:
    - exhaustion
    - exhausted
    why: Section 7.0 removed Exhaustion as a tracked resource. A trait cannot point at it.
    rewrite_to:
    - permission
  out_of_turn_reaction:
    patterns:
    - as a reaction
    - as an immediate
    - out of turn
    - when x happens to you, respond
    why: 'Not in the bestiary, not in the races, not in the classes. Appendix B: do not invent one.'
    rewrite_to:
    - control_without_damage
    - conditional_to_hit
  once_per_session:
    patterns:
    - once per session
    - once a session
    - 1/session
    why: OSE uses per-round, per-encounter, per-day and per-day-per-level. Never per-session.
    rewrite_to:
    - frequency_limit
    severity: warn
  ungated_knowledge:
    patterns:
    - you automatically know
    - you always know exactly
    - you know at a glance exactly
    - automatically underestimates
    - perfect recall
    - you instantly know
    why: Knowledge is never automatic. Gate it on a roll, usually with an activation cost (Svirfneblin's
      Stone Murmurs).
    rewrite_to:
    - x_in_6
  close_range:
    patterns:
    - close range
    - at close quarters range
    - medium range
    - far range
    why: Section 7.5 uses real measured distance, not abstract zones. Known content debt.
    severity: warn
damage_tiers:
- tier: Minor
  cost:
  - 2
  - 3
  damage: 1d4
- tier: Moderate
  cost:
  - 4
  - 5
  damage: 1d6
- tier: Major
  cost:
  - 6
  - 7
  damage: 1d8
- tier: Severe
  cost:
  - 8
  - null
  damage: 1d10
shape_disposition:
  retired:
    percentage: '43 uses in the OSE corpus and none here, because this book converted every chance roll
      to x_in_6. Kept in the vocabulary so imported material maps cleanly; never written to.

      '
    additive_percentage: 'The same notation one layer up. Retired with it.

      '
  used_by_rules_not_traits:
    ability_score_scaled: 'Not a gap. Encumbrance reads off STR (7.2) and saving throws read off the better
      of two attributes (7.13). The shape is load-bearing - it is simply not something a Family trait
      says.

      '
  available_unused:
    level_scaled: 'Class Picks are static by design and nothing needs to grow with level yet. Worth revisiting
      if Picks ever feel flat at high level.

      '
    self_referential_scaling: 'Exotic. Nothing in the book wants "damage equal to half its own current
      hit points" yet.

      '
    random_table: 'The Mutation pool is the obvious home and has not needed it.

      '
  adopted:
    conditional_rate_x_in_6: 'ADOPTED 2026-09-05. A better tool than a flat rate for every dark-adapted
      sense in the book, and 7.10 now gives the daylight half of the trade real teeth.

      '
    equipment_handling_upgrade: 'ADOPTED 2026-09-05. "Wields two-handed weapons in one hand" is most of
      what being Large is for, and no Large Family had it.

      '
