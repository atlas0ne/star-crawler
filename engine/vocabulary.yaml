meta:
  derived_from: book/appendix-b-trait-vocabulary.md
  corpus: OSE Classic Fantasy (196 monsters, 547 special abilities), Advanced Fantasy and Carcass Crawler
    races, class entries, SRD encounter rules.
  source: Crawler-Core
  note: The corpus-derived sections - shapes, aliases, never_list, banned_idiom, damage_tiers - are identical
    in every game on this engine and are edited HERE. A game adds its own shapes under its own unsanctioned_shapes
    / extensions block in its own repo, never here.
